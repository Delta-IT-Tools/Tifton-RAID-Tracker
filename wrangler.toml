name = "tifton-raid-tracker"
main = "src/index.js"
compatibility_date = "2026-09-08"

# Leaves any plain-text vars added in the dashboard alone on deploy.
# SITE_PASSWORD and SESSION_SECRET no longer depend on this: they live in
# Cloudflare Secrets Store (see the bottom of this file).
keep_vars = true

# Serves public/index.html and any other static files in that folder.
# The "ASSETS" name here matches env.ASSETS used in src/index.js.
#
# run_worker_first = true is essential, not optional: by default
# Cloudflare serves a matching static file directly and skips the Worker,
# which would mean the password gate never runs for the main page. This
# forces every request through src/index.js first, so the auth check
# always happens before any static file is served.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# D1 database binding. Not sensitive (it's an ID, like a resource name),
# so it's safe to commit.
[[d1_databases]]
binding = "DB"
database_name = "tifton-golive-tracker-db"
database_id = "32d6b303-e8ed-477d-8b40-43b485d9a337"

# SITE_PASSWORD and SESSION_SECRET come from Cloudflare Secrets Store.
#
# The secret VALUES live in the dashboard (Secrets Store), never in git.
# These blocks only point the Worker at them, so every deploy recreates
# the bindings instead of wiping them. src/index.js reads them through
# resolveSecret(), which calls .get() on Secrets Store bindings.
#
# Setup (one time):
#   1. Dashboard -> Secrets Store -> create SITE_PASSWORD and
#      SESSION_SECRET with scope "Workers".
#   2. Copy the Store ID from that page into both store_id lines below.
#      (The Store ID is an identifier, not a secret; safe to commit.)
#   3. Delete any SITE_PASSWORD / SESSION_SECRET entries under this
#      Worker's Settings -> Variables and Secrets, so the names don't
#      collide with these bindings.
#
# To change the password later, edit it in Secrets Store. No redeploy needed.
[[secrets_store_secrets]]
binding = "SITE_PASSWORD"
store_id = "73a9bf3c60b640c0889b9e4f2ffc69c1"
secret_name = "RAID-PASSWORD"
