    const groupOrder = currentView === 'board' ? BOARD_STATUS_ORDER : STATUS_ORDER;
    const sections = groupOrder.map(st => {
      const items = list.filter(i => i.status === st);
      if (!items.length) return '';
      const color = EMAIL_COLORS[STATUS_EMAIL_COLOR[st]];
      const rowsHtml = items.map(i => `
        <tr>
          <td style="padding:10px 12px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;">
            <div style="font-weight:700;font-size:13.5px;color:${EMAIL_COLORS.ink};">${esc(i.title)}</div>
            <div style="margin:4px 0;">${issueMetaHtml(i)}</div>
            <div style="font-size:12px;color:${EMAIL_COLORS.inkSoft};">${escNl(i.detail)}</div>
            ${i.notes ? `<div style="font-size:11.5px;color:${EMAIL_COLORS.steel};font-style:italic;margin-top:4px;">${escNl(i.notes)}</div>` : ''}
            ${i.owner ? `<div style="font-size:11.5px;font-weight:700;color:${EMAIL_COLORS.steel};margin-top:6px;">${esc(i.owner)}</div>` : ''}
          </td>
        </tr>`).join('');
      return `
        <div style="margin-bottom:20px;">
          <div style="font-size:14px;font-weight:700;color:${color};border-bottom:2px solid ${color};padding-bottom:4px;margin-bottom:8px;">
            ${esc(STATUS_LABELS[st])} <span style="font-weight:400;color:${EMAIL_COLORS.inkSoft};">(${items.length})</span>
          </div>
          <table style="border-collapse:collapse;width:100%;">
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>`;
    }).filter(Boolean).join('');

    return `<div style="${font}">${headerHtml}${sections}</div>`;
  }

  // Copies rich HTML by rendering it off-screen, selecting it as a real DOM
  // range, and using the classic execCommand('copy'). Unlike the modern async
  // Clipboard API (which some sandboxed hosts silently refuse for anything
  // beyond plain text), this selection-based copy is what browsers have used
  // for rich copy/paste for years and reliably places BOTH an HTML and a
  // plain-text representation on the clipboard in one step.
  function copyRichViaSelection(html, text) {
    const container = document.createElement('div');
    container.setAttribute('contenteditable', 'true');
    container.style.position = 'fixed';
    container.style.top = '0';
    container.style.left = '0';
    container.style.opacity = '0.01';
    container.style.pointerEvents = 'none';
    container.style.zIndex = '-1';
    container.innerHTML = html;
    document.body.appendChild(container);

    let ok = false;
    try {
      const range = document.createRange();
      range.selectNodeContents(container);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ok = document.execCommand('copy');
      sel.removeAllRanges();
    } catch (e) {
      ok = false;
    }
    container.remove();
    return ok;
  }

  async function copyCurrentView() {
    const text = buildCopyText();
    const html = buildCopyHtml();
    const btn = document.getElementById('btn-copy-view');
    let ok = copyRichViaSelection(html, text);

    if (!ok) {
      // Fall back to the modern Clipboard API with both MIME types
      try {
        await navigator.clipboard.write([
          new ClipboardItem({
            'text/plain': new Blob([text], { type: 'text/plain' }),
            'text/html': new Blob([html], { type: 'text/html' }),
          })
        ]);
        ok = true;
      } catch (e) {
        // Fall back further to plain-text-only clipboard write
        try {
          await navigator.clipboard.writeText(text);
          ok = true;
        } catch (e2) {
          // Final fallback for environments where the Clipboard API is unavailable/blocked
          try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            ok = document.execCommand('copy');
            ta.remove();
          } catch (e3) {
            ok = false;
          }
        }
      }
    }
    const original = btn.textContent;
    btn.textContent = ok ? 'Copied!' : 'Copy failed';
    btn.classList.toggle('copied', ok);
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1600);
  }

  function openModal(id) {
    editingId = id || null;
    const issue = id ? issues.find(i => i.id === id) : { title:'', detail:'', status: STATUS_ORDER[0], owner:'', devops:'', priority:'', blocker:'', targetDate:'', notes:'', reportedDate: todayISO() };
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h2>${id ? 'Edit issue' : 'Add issue'}</h2>
        <div class="field"><label>Owner</label><input type="text" id="m-owner" value="${issue.owner||''}" placeholder="optional"></div>
        <div class="field"><label>Title</label><input type="text" id="m-title" value="${issue.title}" placeholder="Short summary"></div>
        <div class="field"><label>Detail</label><textarea id="m-detail" placeholder="Full description">${issue.detail}</textarea></div>
        <div class="field-row">
          <div class="field"><label>DevOps #</label><input type="text" id="m-devops" value="${issue.devops||''}" placeholder="e.g. 24714 (optional)"></div>
          <div class="field">
            <label>Priority</label>
            <select id="m-priority">
              <option value="" ${!issue.priority ? 'selected' : ''}>&mdash;</option>
              <option value="High" ${issue.priority==='High'?'selected':''}>High</option>
              <option value="Medium" ${issue.priority==='Medium'?'selected':''}>Medium</option>
              <option value="Low" ${issue.priority==='Low'?'selected':''}>Low</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Reported date</label><input type="date" id="m-reported" value="${issue.reportedDate||''}"></div>
          <div class="field"><label>Target completion date</label><input type="date" id="m-target" value="${issue.targetDate||''}"></div>
        </div>
        <div class="field">
          <label>Walmart blocker</label>
          <select id="m-blocker">
            <option value="" ${!issue.blocker ? 'selected' : ''}>&mdash;</option>
            <option value="Y" ${issue.blocker==='Y'?'selected':''}>Y</option>
            <option value="N" ${issue.blocker==='N'?'selected':''}>N</option>
            <option value="Y/N" ${issue.blocker==='Y/N'?'selected':''}>Y/N (unclear)</option>
          </select>
        </div>
        <div class="field"><label>Notes</label><textarea id="m-notes" placeholder="optional">${issue.notes||''}</textarea></div>
        <div class="field">
          <label>Status</label>
          <select id="m-status">
            ${STATUS_ORDER.map(s => `<option value="${s}" ${issue.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
          </select>
        </div>
        <div class="modal-actions">
          <div>${id ? '<button class="btn-delete" id="m-delete">Delete</button>' : ''}</div>
          <div style="display:flex;gap:8px;">
            <button class="btn-secondary" id="m-cancel">Cancel</button>
            <button class="btn-primary" id="m-save">Save</button>
          </div>
        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);

    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
    document.getElementById('m-cancel').addEventListener('click', () => backdrop.remove());
    if (id) {
      document.getElementById('m-delete').addEventListener('click', async () => {
        issues = issues.filter(i => i.id !== id);
        await saveIssues();
        backdrop.remove();
        populateFilters();
        render();
      });
    }
    document.getElementById('m-save').addEventListener('click', async () => {
      const data = {
        title: document.getElementById('m-title').value.trim(),
        detail: document.getElementById('m-detail').value.trim(),
        status: document.getElementById('m-status').value,
        owner: document.getElementById('m-owner').value.trim(),
        devops: document.getElementById('m-devops').value.trim(),
        priority: document.getElementById('m-priority').value,
        blocker: document.getElementById('m-blocker').value,
        reportedDate: document.getElementById('m-reported').value,
        targetDate: document.getElementById('m-target').value,
        notes: document.getElementById('m-notes').value.trim(),
      };
      if (!data.title) { document.getElementById('m-title').focus(); return; }
      if (id) {
        const idx = issues.findIndex(i => i.id === id);
        issues[idx] = { ...issues[idx], ...data };
      } else {
        data.id = 'issue-' + Date.now();
        issues.push(data);
      }
      await saveIssues();
      backdrop.remove();
      populateFilters();
      render();
    });
  }

  // Event bindings
  document.getElementById('btn-copy-view').addEventListener('click', copyCurrentView);
  document.getElementById('btn-export').addEventListener('click', exportData);
  document.getElementById('btn-network-diagram').addEventListener('click', openNetworkDiagramModal);
  document.getElementById('btn-import').addEventListener('click', openImportModal);
  document.getElementById('btn-upload-raid').addEventListener('click', openUploadRaidModal);
  document.getElementById('filter-status').addEventListener('change', render);
  document.getElementById('filter-blocker').addEventListener('change', render);
  document.getElementById('filter-missing').addEventListener('change', render);
  document.getElementById('search').addEventListener('input', render);
  document.querySelectorAll('#view-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = btn.getAttribute('data-view');
      document.querySelectorAll('#view-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  document.getElementById('board-scrollbar-proxy').addEventListener('scroll', (e) => {
    if (activeBoardEl) activeBoardEl.scrollLeft = e.target.scrollLeft;
  });
  window.addEventListener('resize', () => {
    if (currentView === 'board') syncBoardScrollbar();
  });

  (async function init() {
    await loadIssues();
    populateFilters();
    render();
  })();
})();
</script>
