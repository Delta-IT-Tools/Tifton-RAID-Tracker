<div id="tifton-tracker">
  <div class="head">
    <div>
      <p class="eyebrow">HY-TEK &middot; DELTA GALIL</p>
      <h1>TIFTON Go-Live Tracker</h1>
      <p class="head-sub" id="header-summary">Loading&hellip;</p>
    </div>
    <div class="stat-row" id="stat-row"></div>
  </div>

  <div class="toolbar">
    <div class="toolbar-filters">
      <select id="filter-area"><option value="">All areas</option></select>
      <select id="filter-status">
        <option value="">All statuses</option>
      </select>
      <select id="filter-blocker">
        <option value="">Blocker: All</option>
        <option value="Y">Walmart blocker only</option>
        <option value="N">Not a blocker</option>
      </select>
      <select id="filter-missing">
        <option value="">Missing info: All</option>
        <option value="devops">Missing DevOps #</option>
        <option value="target">Missing Due Date</option>
        <option value="either">Missing DevOps # or Due Date</option>
      </select>
      <button class="btn-add" id="btn-add">+ Add issue</button>
      <button class="btn-copy" id="btn-copy-view">Copy view</button>
    </div>
    <div class="toolbar-search">
      <input type="text" id="search" placeholder="Search issues...">
      <div class="view-toggle" id="view-toggle">
        <button data-view="board" class="active">Board</button>
        <button data-view="table">Table</button>
        <button data-view="calendar">Calendar</button>
        <button data-view="completed">Completed</button>
      </div>
    </div>
  </div>

  <div class="body" id="body"></div>
  <div class="board-scrollbar-proxy" id="board-scrollbar-proxy">
    <div class="board-scrollbar-proxy-inner" id="board-scrollbar-proxy-inner"></div>
  </div>
  <div class="save-note" id="save-note">Saved to your browser &middot; personal to you</div>
  <div class="data-io">
    <button class="btn-io" id="btn-export">Export JSON</button>
    <button class="btn-io" id="btn-import">Import JSON</button>
  </div>
  <div class="logout-row"><a href="/logout" class="logout-link">Log out</a></div>
</div>

<script>
(function() {
  const ROOT = document.getElementById('tifton-tracker');

  const STATUS_LABELS = { open: 'Open', inprogress: 'In Progress (DEV)', testing: 'Testing (PSO)', readyinstall: 'Ready for Install', readycustomer: 'Ready for Customer', completed: 'Completed' };
  const STATUS_ORDER = ['open', 'inprogress', 'testing', 'readyinstall', 'readycustomer', 'completed'];

  let issues = [];
  let currentView = 'board';
  let calendarMonth = (() => {
    const d = new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  })();
  let selectedCalendarDate = null;
  let editingId = null;
  let activeBoardEl = null;

  async function loadIssues() {
    let storedVersion = 0;
    try {
      const vResult = await window.storage.get(VERSION_KEY, false);
      if (vResult && vResult.value) storedVersion = parseInt(vResult.value) || 0;
    } catch (e) { /* no version stored yet */ }

    if (storedVersion < CURRENT_DATA_VERSION) {
      // Fresh dataset supersedes whatever was previously saved in this browser.
      issues = SEED_ISSUES.slice();
      await saveIssues();
      try { await window.storage.set(VERSION_KEY, String(CURRENT_DATA_VERSION), false); } catch (e) {}
      return;
    }

    try {
      const result = await window.storage.get(STORAGE_KEY, false);
      if (result && result.value) {
        issues = JSON.parse(result.value);
        migrateRemovedStatuses();
        return;
      }
    } catch (e) { /* not found yet */ }
    issues = SEED_ISSUES.slice();
    await saveIssues();
  }

  // Fixes up any saved issues still carrying a status value that no longer exists
  // in the app (e.g. the retired "watching" status), without touching anything else.
  function migrateRemovedStatuses() {
    let changed = false;
    issues.forEach(i => {
      if (!STATUS_ORDER.includes(i.status)) {
        i.status = 'open';
        changed = true;
      }
    });
    if (changed) saveIssues();
  }

  async function saveIssues() {
    const noteEl = document.getElementById('save-note');
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(issues), false);
      if (noteEl) { noteEl.textContent = 'Saved to your browser · personal to you'; }
    } catch (e) {
      if (noteEl) { noteEl.textContent = 'Could not save — changes may not persist'; }
      console.error('Storage error', e);
    }
  }

  function uniqueAreas() {
    return [...new Set(issues.map(i => i.area))].sort();
  }

  function populateFilters() {
    const areaSel = document.getElementById('filter-area');
    const curArea = areaSel.value;
    areaSel.innerHTML = '<option value="">All areas</option>' + uniqueAreas().map(a => `<option value="${a}">${a}</option>`).join('');
    areaSel.value = curArea;

    const statusSel = document.getElementById('filter-status');
    const curStatus = statusSel.value;
    statusSel.innerHTML = '<option value="">All statuses</option>' + STATUS_ORDER.map(s => `<option value="${s}">${STATUS_LABELS[s]}</option>`).join('');
    statusSel.value = curStatus;
  }

  function getFiltered() {
    const area = document.getElementById('filter-area').value;
    const status = document.getElementById('filter-status').value;
    const blockerFilter = document.getElementById('filter-blocker').value;
    const missingFilter = document.getElementById('filter-missing').value;
    const q = document.getElementById('search').value.trim().toLowerCase();
    return issues.filter(i => {
      if (area && i.area !== area) return false;
      if (status && i.status !== status) return false;
      if (blockerFilter === 'Y' && !isBlocker(i.blocker)) return false;
      if (blockerFilter === 'N' && isBlocker(i.blocker)) return false;
      const missingDevops = !i.devops;
      const missingTarget = !i.targetDate;
      if (missingFilter === 'devops' && !missingDevops) return false;
      if (missingFilter === 'target' && !missingTarget) return false;
      if (missingFilter === 'either' && !(missingDevops || missingTarget)) return false;
      if (q) {
        const hay = (i.title + ' ' + i.detail + ' ' + i.area + ' ' + (i.owner||'') + ' ' + (i.devops||'') + ' ' + (i.notes||'')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function renderStats() {
    const counts = {};
    STATUS_ORDER.forEach(s => { counts[s] = 0; });
    issues.forEach(i => { counts[i.status] = (counts[i.status]||0) + 1; });
    const blockerCount = issues.filter(i => isBlocker(i.blocker)).length;
    const blockerActive = document.getElementById('filter-blocker').value === 'Y';
    const row = document.getElementById('stat-row');
    row.innerHTML = STATUS_ORDER.map(s =>
      `<div class="stat ${s}"><div class="n">${counts[s]}</div><div class="l">${STATUS_LABELS[s]}</div></div>`
    ).join('') + `<div class="stat blocker-stat${blockerActive ? ' active' : ''}" id="blocker-stat" title="Click to show only Walmart blockers"><div class="n">${blockerCount}</div><div class="l">Walmart Blockers</div></div>`;
    document.getElementById('blocker-stat').addEventListener('click', () => {
      const sel = document.getElementById('filter-blocker');
      sel.value = sel.value === 'Y' ? '' : 'Y';
      render();
    });
  }

  function renderHeaderSummary() {
    const el = document.getElementById('header-summary');
    const n = issues.length;
    el.textContent = n === 0 ? 'No issues yet' : `${n} tracked issue${n === 1 ? '' : 's'}`;
  }

  function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function isBlocker(blocker) {
    return blocker === 'Y' || blocker === 'Y/N';
  }

  function cardHtml(issue) {
    const priorityClass = (issue.priority || '').toLowerCase();
    return `
      <div class="card ${issue.status}" data-id="${issue.id}">
        <div class="card-top">
          <span class="tag">${issue.area}</span>
          ${isBlocker(issue.blocker) ? `<span class="blocker-tag">Walmart blocker${issue.blocker === 'Y/N' ? ' (Y/N)' : ''}</span>` : ''}
        </div>
        <div class="card-title">${issue.title}</div>
        <div class="meta-row">
          ${issue.priority ? `<span class="priority-tag ${priorityClass}">${issue.priority} priority</span>` : ''}
          ${issue.targetDate ? `<span class="target-tag">Target: ${formatDate(issue.targetDate)}</span>` : ''}
        </div>
        <div class="card-detail">${issue.detail}</div>
        <div class="card-footer">
          <div>
            ${issue.reportedDate ? `<div class="card-reported">Reported ${formatDate(issue.reportedDate)}</div>` : ''}
          </div>
          ${issue.devops ? `<span class="devops-tag">DevOps #${issue.devops}</span>` : ''}
        </div>
      </div>
    `;
  }

  function renderBoard(list) {
    const cols = STATUS_ORDER.map(st => {
      const items = list.filter(i => i.status === st);
      return `
        <div class="board-col">
          <div class="col-head">${STATUS_LABELS[st]} <span class="count">${items.length}</span></div>
          ${items.map(cardHtml).join('') || '<div class="empty">No issues</div>'}
        </div>
      `;
    }).join('');
    return `<div class="board">${cols}</div>`;
  }

  function renderTable(list) {
    const sorted = list.slice().sort((a,b) => {
      const statusDiff = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
      return statusDiff !== 0 ? statusDiff : a.title.localeCompare(b.title);
    });
    if (!sorted.length) return '<div class="empty">No issues match these filters</div>';
    return `
      <table>
        <thead><tr><th>Area</th><th>Issue</th><th>DevOps #</th><th>Priority</th><th>Walmart Blocker</th><th>Reported</th><th>Target</th><th>Owner</th><th>Status</th></tr></thead>
        <tbody>
          ${sorted.map(i => `
            <tr data-id="${i.id}">
              <td>${i.area}</td>
              <td>
                <strong>${i.title}</strong><br><span style="color:var(--ink-soft);font-size:12px;">${i.detail}</span>
                ${i.notes ? `<br><span style="color:var(--steel-dark);font-size:11.5px;font-style:italic;"><strong>Notes:</strong> ${i.notes}</span>` : ''}
              </td>
              <td>${i.devops || '—'}</td>
              <td>${i.priority || '—'}</td>
              <td>${isBlocker(i.blocker) ? `<span class="blocker-tag">${i.blocker}</span>` : (i.blocker || '—')}</td>
              <td>${i.reportedDate ? formatDate(i.reportedDate) : '—'}</td>
              <td>${i.targetDate ? formatDate(i.targetDate) : '—'}</td>
              <td>${i.owner || '—'}</td>
              <td>
                <span class="status-pill ${i.status}">${STATUS_LABELS[i.status]}</span>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function issuesByDueDate(list) {
    const map = {};
    list.forEach(i => {
      if (i.targetDate) (map[i.targetDate] = map[i.targetDate] || []).push(i);
    });
    return map;
  }

  function renderCalendar(list) {
    const dueMap = issuesByDueDate(list);
    const { year, month } = calendarMonth;
    const firstOfMonth = new Date(year, month, 1);
    const startWeekday = firstOfMonth.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const monthLabel = firstOfMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const today = todayISO();
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    let cells = '';
    for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dueIssues = dueMap[iso] || [];
      const classes = ['cal-cell'];
      if (dueIssues.length) classes.push('has-due');
      if (iso === today) classes.push('is-today');
      if (iso === selectedCalendarDate) classes.push('is-selected');
      cells += `
        <div class="${classes.join(' ')}" data-cal-date="${iso}">
          <div class="cal-daynum">${d}</div>
          ${dueIssues.length ? `<div class="cal-count">${dueIssues.length}</div>` : ''}
        </div>`;
    }
    const totalCells = startWeekday + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 0; i < trailing; i++) cells += `<div class="cal-cell empty"></div>`;

    const monthTotal = Object.keys(dueMap).filter(iso => iso.startsWith(`${year}-${String(month + 1).padStart(2,'0')}`)).reduce((sum, iso) => sum + dueMap[iso].length, 0);

    const detailIssues = selectedCalendarDate ? (dueMap[selectedCalendarDate] || []) : [];
    const detailHtml = selectedCalendarDate ? `
      <div class="cal-detail">
        <div class="cal-detail-header">Due ${formatDate(selectedCalendarDate)} <span class="count">(${detailIssues.length})</span></div>
        <div class="cal-detail-list">
          ${detailIssues.length ? detailIssues.map(cardHtml).join('') : '<div class="empty">No issues due this day.</div>'}
        </div>
      </div>` : `
      <div class="cal-detail">
        <div class="empty">Click a highlighted date to see what's due that day.</div>
      </div>`;

    return `
      <div class="calendar">
        <div class="cal-header">
          <button type="button" class="cal-nav" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
          <div class="cal-month-label">${monthLabel}<span class="cal-month-count">${monthTotal} due this month</span></div>
          <button type="button" class="cal-nav" id="cal-next" aria-label="Next month">&rsaquo;</button>
        </div>
        <div class="cal-grid cal-grid-head">${dayNames.map(n => `<div class="cal-dayname">${n}</div>`).join('')}</div>
        <div class="cal-grid">${cells}</div>
      </div>
      ${detailHtml}
    `;
  }

  function renderCompletedList(list) {
    const completed = list.filter(i => i.status === 'completed').sort((a,b) => a.title.localeCompare(b.title));
    if (!completed.length) return '<div class="empty">No completed issues match these filters.</div>';
    return `
      <div class="completed-wrap">
        <div class="completed-header">Completed <span class="count">(${completed.length})</span></div>
        <div class="completed-grid">${completed.map(cardHtml).join('')}</div>
      </div>
    `;
  }

  function render() {
    renderStats();
    renderHeaderSummary();
    const list = getFiltered();
    const body = document.getElementById('body');
    if (currentView === 'board') body.innerHTML = renderBoard(list);
    else if (currentView === 'table') body.innerHTML = renderTable(list);
    else if (currentView === 'calendar') body.innerHTML = renderCalendar(list);
    else body.innerHTML = renderCompletedList(list);

    body.querySelectorAll('[data-id]').forEach(el => {
      el.addEventListener('click', () => openModal(el.getAttribute('data-id')));
    });

    if (currentView === 'calendar') {
      const prevBtn = document.getElementById('cal-prev');
      const nextBtn = document.getElementById('cal-next');
      if (prevBtn) prevBtn.addEventListener('click', () => {
        calendarMonth.month--;
        if (calendarMonth.month < 0) { calendarMonth.month = 11; calendarMonth.year--; }
        render();
      });
      if (nextBtn) nextBtn.addEventListener('click', () => {
        calendarMonth.month++;
        if (calendarMonth.month > 11) { calendarMonth.month = 0; calendarMonth.year++; }
        render();
      });
      body.querySelectorAll('.cal-cell.has-due').forEach(cell => {
        cell.addEventListener('click', () => {
          selectedCalendarDate = cell.getAttribute('data-cal-date');
          render();
        });
      });
    }

    syncBoardScrollbar();
  }

  function syncBoardScrollbar() {
    const proxy = document.getElementById('board-scrollbar-proxy');
    const inner = document.getElementById('board-scrollbar-proxy-inner');
    const board = currentView === 'board' ? document.querySelector('#tifton-tracker .board') : null;
    activeBoardEl = board;

    if (!board) {
      proxy.classList.remove('visible');
      return;
    }
    const overflowing = board.scrollWidth > board.clientWidth + 1;
    if (!overflowing) {
      proxy.classList.remove('visible');
      return;
    }
    proxy.classList.add('visible');
    inner.style.width = board.scrollWidth + 'px';
    proxy.scrollLeft = board.scrollLeft;
    board.addEventListener('scroll', onActiveBoardScroll);
  }

  function onActiveBoardScroll() {
    const proxy = document.getElementById('board-scrollbar-proxy');
    if (activeBoardEl && proxy) proxy.scrollLeft = activeBoardEl.scrollLeft;
  }

  function todayLabel() {
    const d = new Date();
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function todayISO() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  // ---------- Export / Import ----------

  function buildExportPayload() {
    const payload = {
      exportedAt: new Date().toISOString(),
      dataVersion: CURRENT_DATA_VERSION,
      issues: issues,
    };
    return JSON.stringify(payload, null, 2);
  }

  function exportData() {
    const text = buildExportPayload();
    const stamp = new Date().toISOString().slice(0, 10);
    const filename = `tifton-tracker-export-${stamp}.json`;

    // Best-effort automatic download. Sandboxed iframes sometimes block
    // programmatic downloads silently, so this is backed up by the modal
    // below which always gives a guaranteed, working way to get the data.
    let downloadAttempted = false;
    try {
      const blob = new Blob([text], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      downloadAttempted = true;
    } catch (e) {
      downloadAttempted = false;
    }

    showExportModal(text, filename, downloadAttempted);
  }

  function showExportModal(text, filename, downloadAttempted) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal" style="max-width:600px;">
        <h2>Export data</h2>
        <p style="font-size:13px;line-height:1.5;color:var(--ink-soft);margin:0 0 12px;">
          ${downloadAttempted ? `A download (<strong>${filename}</strong>) was started automatically. ` : ''}
          If it didn't save anywhere useful, copy the text below and save it yourself as a <strong>.json</strong> file.
        </p>
        <textarea id="export-textarea" readonly style="width:100%;height:260px;font-family:monospace;font-size:11.5px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);resize:vertical;"></textarea>
        <div class="modal-actions" style="justify-content:flex-end;gap:8px;">
          <button class="btn-secondary" id="export-close">Close</button>
          <button class="btn-primary" id="export-copy">Copy text</button>
        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);
    const ta = backdrop.querySelector('#export-textarea');
    ta.value = text;
    const close = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    backdrop.querySelector('#export-close').addEventListener('click', close);
    backdrop.querySelector('#export-copy').addEventListener('click', async (e) => {
      const btn = e.target;
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (err) {
        try {
          ta.focus();
          ta.select();
          ok = document.execCommand('copy');
        } catch (err2) { ok = false; }
      }
      btn.textContent = ok ? 'Copied!' : 'Select text above and copy manually';
      setTimeout(() => { btn.textContent = 'Copy text'; }, 1800);
    });
  }

  // ---------- Custom alert/confirm (native dialogs are blocked in sandboxed iframes) ----------

  function showAlertModal(message) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h2>Heads up</h2>
        <p style="font-size:13.5px;line-height:1.5;color:var(--ink-soft);margin:0 0 18px;">${message}</p>
        <div class="modal-actions" style="justify-content:flex-end;">
          <button class="btn-primary" id="alert-ok">OK</button>
        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);
    const close = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    backdrop.querySelector('#alert-ok').addEventListener('click', close);
  }

  function parseAndValidateImport(text) {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      return { error: 'That doesn\'t look like valid JSON — check for missing commas, brackets, or quotes.' };
    }
    const incoming = Array.isArray(parsed) ? parsed : parsed.issues;
    if (!Array.isArray(incoming)) {
      return { error: 'This JSON doesn\'t look like a tracker export (expected an array of issues, or an object with an "issues" array).' };
    }
    const looksValid = incoming.every(i => i && typeof i === 'object' && 'id' in i && 'title' in i);
    if (!looksValid) {
      return { error: 'This JSON doesn\'t look like a tracker export — some entries are missing expected fields (id, title).' };
    }
    return { issues: incoming };
  }

  function openImportModal() {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal" style="max-width:600px;">
        <h2>Import data</h2>
        <p style="font-size:13px;line-height:1.5;color:var(--ink-soft);margin:0 0 10px;">
          Choose a previously exported .json file, or paste its contents directly below.
        </p>
        <div class="field">
          <label>Choose file</label>
          <input type="file" id="import-modal-file" accept="application/json,.json">
        </div>
        <div class="field">
          <label>Or paste JSON here</label>
          <textarea id="import-modal-textarea" placeholder="Paste exported JSON here..." style="width:100%;height:200px;font-family:monospace;font-size:11.5px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);resize:vertical;"></textarea>
        </div>
        <p id="import-modal-error" style="font-size:12.5px;color:var(--rust);margin:0 0 8px;display:none;"></p>
        <div class="modal-actions" style="justify-content:flex-end;gap:8px;">
          <button class="btn-secondary" id="import-cancel">Cancel</button>
          <button class="btn-primary" id="import-load">Import</button>
        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);
    const close = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    backdrop.querySelector('#import-cancel').addEventListener('click', close);

    const fileInput = backdrop.querySelector('#import-modal-file');
    const textarea = backdrop.querySelector('#import-modal-textarea');
    const errorEl = backdrop.querySelector('#import-modal-error');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { textarea.value = reader.result; };
      reader.onerror = () => {
        errorEl.textContent = 'Could not read that file — try pasting its contents into the box below instead.';
        errorEl.style.display = 'block';
      };
      reader.readAsText(file);
    });

    backdrop.querySelector('#import-load').addEventListener('click', () => {
      const text = textarea.value.trim();
      if (!text) {
        errorEl.textContent = 'Choose a file above or paste JSON text before importing.';
        errorEl.style.display = 'block';
        return;
      }
      const result = parseAndValidateImport(text);
      if (result.error) {
        errorEl.textContent = result.error;
        errorEl.style.display = 'block';
        return;
      }
      close();
      showConfirmModal(
        `Import ${result.issues.length} issue(s)? This will replace all ${issues.length} issue(s) currently in the tracker.`,
        async () => {
          issues = result.issues;
          migrateRemovedStatuses();
          await saveIssues();
          populateFilters();
          render();
        }
      );
    });
  }

  function showConfirmModal(message, onConfirm) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h2>Please confirm</h2>
        <p style="font-size:13.5px;line-height:1.5;color:var(--ink-soft);margin:0 0 18px;">${message}</p>
        <div class="modal-actions" style="justify-content:flex-end;gap:8px;">
          <button class="btn-secondary" id="confirm-cancel">Cancel</button>
          <button class="btn-primary" id="confirm-ok">Import</button>
        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);
    const close = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    backdrop.querySelector('#confirm-cancel').addEventListener('click', close);
    backdrop.querySelector('#confirm-ok').addEventListener('click', () => {
      close();
      onConfirm();
    });
  }

  // ---------- Copy view ----------

  function statusText(status) {
    return STATUS_LABELS[status] || status;
  }

  function buildCopyText() {
    const list = getFiltered();
    const header = `TIFTON GO-LIVE TRACKER\nGenerated ${todayLabel()}\n${list.length} issue(s)\n`;

    if (!list.length) return header + '\nNo issues match the current filters.';

    if (currentView === 'table') {
      const rows = list.slice().sort((a,b) => {
        const statusDiff = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
        return statusDiff !== 0 ? statusDiff : a.title.localeCompare(b.title);
      }).map(i => {
        return [i.area, i.title, i.detail, i.devops || '\u2014', i.priority || '\u2014', i.blocker || '\u2014', i.reportedDate ? formatDate(i.reportedDate) : '\u2014', i.targetDate ? formatDate(i.targetDate) : '\u2014', i.notes || '\u2014', i.owner || '\u2014', statusText(i.status)].join('\t');
      });
      const cols = ['Area', 'Title', 'Detail', 'DevOps #', 'Priority', 'Walmart Blocker', 'Reported', 'Target', 'Notes', 'Owner', 'Status'].join('\t');
      return header + '\n' + cols + '\n' + rows.join('\n');
    }

    // board view (grouped by status)
    const blocks = STATUS_ORDER.map(st => {
      const items = list.filter(i => i.status === st);
      if (!items.length) return null;
      const lines = items.map(i => formatIssueLine(i));
      return `${statusText(st).toUpperCase()} (${items.length})\n${'-'.repeat(30)}\n${lines.join('\n\n')}`;
    }).filter(Boolean);
    return header + '\n' + blocks.join('\n\n\n');
  }

  function formatIssueLine(i) {
    const owner = i.owner ? `  |  ${i.owner}` : '';
    const devops = i.devops ? `  |  DevOps #${i.devops}` : '';
    const priority = i.priority ? `  |  ${i.priority} priority` : '';
    const blocker = isBlocker(i.blocker) ? `  |  WALMART BLOCKER${i.blocker === 'Y/N' ? ' (Y/N)' : ''}` : '';
    const reported = i.reportedDate ? `  |  Reported: ${formatDate(i.reportedDate)}` : '';
    const target = i.targetDate ? `  |  Target: ${formatDate(i.targetDate)}` : '';
    const notes = i.notes ? `\nNotes: ${i.notes}` : '';
    return `[${i.area}]${devops} ${i.title}\n${i.detail}${owner}${priority}${blocker}${reported}${target}${notes}`;
  }

  // Colors mirrored from the app's CSS variables, hardcoded here since inline
  // styles are required for HTML pasted into external email clients.
  const EMAIL_COLORS = {
    ink: '#1b2027', inkSoft: '#565f6c', line: '#dcd8cc',
    steel: '#3d5a73', steelBg: '#e4ebef',
    amber: '#c4791f', amberBg: '#fbeee0',
    rust: '#a3402f', rustBg: '#f8e6e1',
    moss: '#4a6b4d', mossBg: '#e7efe4',
    slate: '#6b7280', slateBg: '#eceae2',
    teal: '#1f7a72', tealBg: '#daf0ee',
  };
  const STATUS_EMAIL_COLOR = { open: 'rust', inprogress: 'amber', testing: 'steel', readyinstall: 'slate', readycustomer: 'moss', completed: 'teal' };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function escNl(s) {
    return esc(s).replace(/\n/g, '<br>');
  }

  function priorityEmailColor(p) {
    if (p === 'High') return 'rust';
    if (p === 'Medium') return 'amber';
    if (p === 'Low') return 'slate';
    return null;
  }

  function chip(text, colorKey) {
    const c = EMAIL_COLORS[colorKey], bg = EMAIL_COLORS[colorKey + 'Bg'];
    return `<span style="display:inline-block;font-size:11px;font-weight:600;color:${c};background:${bg};border-radius:4px;padding:2px 7px;margin:0 6px 4px 0;white-space:nowrap;">${esc(text)}</span>`;
  }

  function issueMetaHtml(i) {
    const chips = [];
    if (i.devops) chips.push(chip('DevOps #' + i.devops, 'steel'));
    if (i.priority) { const pc = priorityEmailColor(i.priority); if (pc) chips.push(chip(i.priority + ' priority', pc)); }
    if (isBlocker(i.blocker)) chips.push(chip('WALMART BLOCKER' + (i.blocker === 'Y/N' ? ' (Y/N)' : ''), 'rust'));
    if (i.reportedDate) chips.push(chip('Reported: ' + formatDate(i.reportedDate), 'slate'));
    if (i.targetDate) chips.push(chip('Target: ' + formatDate(i.targetDate), 'slate'));
    return chips.join('');
  }

  function buildCopyHtml() {
    const list = getFiltered();
    const font = "font-family:Arial,Helvetica,sans-serif;";
    const headerHtml = `
      <div style="${font}margin-bottom:14px;">
        <div style="font-size:17px;font-weight:700;color:${EMAIL_COLORS.ink};">TIFTON Go-Live Tracker</div>
        <div style="font-size:12px;color:${EMAIL_COLORS.inkSoft};">Generated ${esc(todayLabel())} &middot; ${list.length} issue(s)</div>
      </div>`;

    if (!list.length) {
      return `<div style="${font}">${headerHtml}<p style="color:${EMAIL_COLORS.inkSoft};">No issues match the current filters.</p></div>`;
    }

    if (currentView === 'table') {
      const sorted = list.slice().sort((a,b) => {
        const statusDiff = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
        return statusDiff !== 0 ? statusDiff : a.title.localeCompare(b.title);
      });
      const th = (label) => `<th style="text-align:left;padding:6px 10px;border-bottom:2px solid ${EMAIL_COLORS.ink};font-size:11px;text-transform:uppercase;letter-spacing:0.03em;color:${EMAIL_COLORS.inkSoft};">${esc(label)}</th>`;
      const rowsHtml = sorted.map(i => {
        const statusColor = EMAIL_COLORS[STATUS_EMAIL_COLOR[i.status]];
        const statusBg = EMAIL_COLORS[STATUS_EMAIL_COLOR[i.status] + 'Bg'];
        return `
          <tr>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;">${esc(i.area)}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;">
              <div style="font-weight:700;font-size:13px;color:${EMAIL_COLORS.ink};">${esc(i.title)}</div>
              <div style="font-size:12px;color:${EMAIL_COLORS.inkSoft};margin-top:2px;">${escNl(i.detail)}</div>
              ${i.notes ? `<div style="font-size:11.5px;color:${EMAIL_COLORS.steel};font-style:italic;margin-top:4px;"><strong>Notes:</strong> ${escNl(i.notes)}</div>` : ''}
            </td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;">${esc(i.devops) || '&mdash;'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;">${esc(i.priority) || '&mdash;'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;${isBlocker(i.blocker) ? `color:${EMAIL_COLORS.rust};font-weight:700;` : ''}">${isBlocker(i.blocker) ? 'YES' + (i.blocker === 'Y/N' ? ' (Y/N)' : '') : (esc(i.blocker) || '&mdash;')}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;">${i.reportedDate ? esc(formatDate(i.reportedDate)) : '&mdash;'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;">${i.targetDate ? esc(formatDate(i.targetDate)) : '&mdash;'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;">${esc(i.owner) || '&mdash;'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;">
              <span style="display:inline-block;font-size:11px;font-weight:700;color:${statusColor};background:${statusBg};border-radius:100px;padding:3px 10px;white-space:nowrap;">${esc(STATUS_LABELS[i.status])}</span>
            </td>
          </tr>`;
      }).join('');
      return `
        <div style="${font}">
          ${headerHtml}
          <table style="border-collapse:collapse;width:100%;">
            <thead><tr>${th('Area')}${th('Issue')}${th('DevOps #')}${th('Priority')}${th('Walmart Blocker')}${th('Reported')}${th('Target')}${th('Owner')}${th('Status')}</tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>`;
    }

    // board view (grouped by status) -> a labeled table per status group
    const sections = STATUS_ORDER.map(st => {
      const items = list.filter(i => i.status === st);
      if (!items.length) return '';
      const color = EMAIL_COLORS[STATUS_EMAIL_COLOR[st]];
      const rowsHtml = items.map(i => `
        <tr>
          <td style="padding:10px 12px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;width:120px;font-size:12.5px;color:${EMAIL_COLORS.inkSoft};">${esc(i.area)}</td>
          <td style="padding:10px 12px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;">
            <div style="font-weight:700;font-size:13.5px;color:${EMAIL_COLORS.ink};">${esc(i.title)}</div>
            <div style="margin:4px 0;">${issueMetaHtml(i)}</div>
            <div style="font-size:12px;color:${EMAIL_COLORS.inkSoft};">${escNl(i.detail)}</div>
            ${i.notes ? `<div style="font-size:11.5px;color:${EMAIL_COLORS.steel};font-style:italic;margin-top:4px;">${escNl(i.notes)}</div>` : ''}
            ${i.owner ? `<div style="font-size:11.5px;font-weight:700;color:${EMAIL_COLORS.steel};margin-top:6px;">${esc(i.owner)}</div>` : ''}
          </td>
        </tr>`).join('');
      return `
        <div style="margin-bottom:20px;">
          <div style="font-size:14px;font-weight:700;color:${color};border-bottom:2px solid ${color};padding-bottom:4px;margin-bottom:8px;">
            ${esc(STATUS_LABELS[st])} <span style="font-weight:400;color:${EMAIL_COLORS.inkSoft};">(${items.length})</span>
          </div>
          <table style="border-collapse:collapse;width:100%;">
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>`;
    }).filter(Boolean).join('');

    return `<div style="${font}">${headerHtml}${sections}</div>`;
  }

  // Copies rich HTML by rendering it off-screen, selecting it as a real DOM
  // range, and using the classic execCommand('copy'). Unlike the modern async
  // Clipboard API (which some sandboxed hosts silently refuse for anything
  // beyond plain text), this selection-based copy is what browsers have used
  // for rich copy/paste for years and reliably places BOTH an HTML and a
  // plain-text representation on the clipboard in one step.
  function copyRichViaSelection(html, text) {
    const container = document.createElement('div');
    container.setAttribute('contenteditable', 'true');
    container.style.position = 'fixed';
    container.style.top = '0';
    container.style.left = '0';
    container.style.opacity = '0.01';
    container.style.pointerEvents = 'none';
    container.style.zIndex = '-1';
    container.innerHTML = html;
    document.body.appendChild(container);

    let ok = false;
    try {
      const range = document.createRange();
      range.selectNodeContents(container);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ok = document.execCommand('copy');
      sel.removeAllRanges();
    } catch (e) {
      ok = false;
    }
    container.remove();
    return ok;
  }

  async function copyCurrentView() {
    const text = buildCopyText();
    const html = buildCopyHtml();
    const btn = document.getElementById('btn-copy-view');
    let ok = copyRichViaSelection(html, text);

    if (!ok) {
      // Fall back to the modern Clipboard API with both MIME types
      try {
        await navigator.clipboard.write([
          new ClipboardItem({
            'text/plain': new Blob([text], { type: 'text/plain' }),
            'text/html': new Blob([html], { type: 'text/html' }),
          })
        ]);
        ok = true;
      } catch (e) {
        // Fall back further to plain-text-only clipboard write
        try {
          await navigator.clipboard.writeText(text);
          ok = true;
        } catch (e2) {
          // Final fallback for environments where the Clipboard API is unavailable/blocked
          try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            ok = document.execCommand('copy');
            ta.remove();
          } catch (e3) {
            ok = false;
          }
        }
      }
    }
    const original = btn.textContent;
    btn.textContent = ok ? 'Copied!' : 'Copy failed';
    btn.classList.toggle('copied', ok);
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1600);
  }

  function openModal(id) {
    editingId = id || null;
    const issue = id ? issues.find(i => i.id === id) : { area:'', title:'', detail:'', status: STATUS_ORDER[0], owner:'', devops:'', priority:'', blocker:'', targetDate:'', notes:'', reportedDate: todayISO() };
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h2>${id ? 'Edit issue' : 'Add issue'}</h2>
        <div class="field-row">
          <div class="field"><label>Area</label><input type="text" id="m-area" value="${issue.area}" placeholder="e.g. Exotec, Packing"></div>
          <div class="field"><label>Owner</label><input type="text" id="m-owner" value="${issue.owner||''}" placeholder="optional"></div>
        </div>
        <div class="field"><label>Title</label><input type="text" id="m-title" value="${issue.title}" placeholder="Short summary"></div>
        <div class="field"><label>Detail</label><textarea id="m-detail" placeholder="Full description">${issue.detail}</textarea></div>
        <div class="field-row">
          <div class="field"><label>DevOps #</label><input type="text" id="m-devops" value="${issue.devops||''}" placeholder="e.g. 24714 (optional)"></div>
          <div class="field">
            <label>Priority</label>
            <select id="m-priority">
              <option value="" ${!issue.priority ? 'selected' : ''}>&mdash;</option>
              <option value="High" ${issue.priority==='High'?'selected':''}>High</option>
              <option value="Medium" ${issue.priority==='Medium'?'selected':''}>Medium</option>
              <option value="Low" ${issue.priority==='Low'?'selected':''}>Low</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Reported date</label><input type="date" id="m-reported" value="${issue.reportedDate||''}"></div>
          <div class="field"><label>Target completion date</label><input type="date" id="m-target" value="${issue.targetDate||''}"></div>
        </div>
        <div class="field">
          <label>Walmart blocker</label>
          <select id="m-blocker">
            <option value="" ${!issue.blocker ? 'selected' : ''}>&mdash;</option>
            <option value="Y" ${issue.blocker==='Y'?'selected':''}>Y</option>
            <option value="N" ${issue.blocker==='N'?'selected':''}>N</option>
            <option value="Y/N" ${issue.blocker==='Y/N'?'selected':''}>Y/N (unclear)</option>
          </select>
        </div>
        <div class="field"><label>Notes</label><textarea id="m-notes" placeholder="optional">${issue.notes||''}</textarea></div>
        <div class="field">
          <label>Status</label>
          <select id="m-status">
            ${STATUS_ORDER.map(s => `<option value="${s}" ${issue.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
          </select>
        </div>
        <div class="modal-actions">
          <div>${id ? '<button class="btn-delete" id="m-delete">Delete</button>' : ''}</div>
          <div style="display:flex;gap:8px;">
            <button class="btn-secondary" id="m-cancel">Cancel</button>
            <button class="btn-primary" id="m-save">Save</button>
          </div>
        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);

    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
    document.getElementById('m-cancel').addEventListener('click', () => backdrop.remove());
    if (id) {
      document.getElementById('m-delete').addEventListener('click', async () => {
        issues = issues.filter(i => i.id !== id);
        await saveIssues();
        backdrop.remove();
        populateFilters();
        render();
      });
    }
    document.getElementById('m-save').addEventListener('click', async () => {
      const data = {
        area: document.getElementById('m-area').value.trim() || 'General',
        title: document.getElementById('m-title').value.trim(),
        detail: document.getElementById('m-detail').value.trim(),
        status: document.getElementById('m-status').value,
        owner: document.getElementById('m-owner').value.trim(),
        devops: document.getElementById('m-devops').value.trim(),
        priority: document.getElementById('m-priority').value,
        blocker: document.getElementById('m-blocker').value,
        reportedDate: document.getElementById('m-reported').value,
        targetDate: document.getElementById('m-target').value,
        notes: document.getElementById('m-notes').value.trim(),
      };
      if (!data.title) { document.getElementById('m-title').focus(); return; }
      if (id) {
        const idx = issues.findIndex(i => i.id === id);
        issues[idx] = { ...issues[idx], ...data };
      } else {
        data.id = 'issue-' + Date.now();
        issues.push(data);
      }
      await saveIssues();
      backdrop.remove();
      populateFilters();
      render();
    });
  }

  // Event bindings
  document.getElementById('btn-add').addEventListener('click', () => openModal(null));
  document.getElementById('btn-copy-view').addEventListener('click', copyCurrentView);
  document.getElementById('btn-export').addEventListener('click', exportData);
  document.getElementById('btn-import').addEventListener('click', openImportModal);
  document.getElementById('filter-area').addEventListener('change', render);
  document.getElementById('filter-status').addEventListener('change', render);
  document.getElementById('filter-blocker').addEventListener('change', render);
  document.getElementById('filter-missing').addEventListener('change', render);
  document.getElementById('search').addEventListener('input', render);
  document.querySelectorAll('#view-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = btn.getAttribute('data-view');
      document.querySelectorAll('#view-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  document.getElementById('board-scrollbar-proxy').addEventListener('scroll', (e) => {
    if (activeBoardEl) activeBoardEl.scrollLeft = e.target.scrollLeft;
  });
  window.addEventListener('resize', () => {
    if (currentView === 'board') syncBoardScrollbar();
  });

  (async function init() {
    await loadIssues();
    populateFilters();
    render();
  })();
})();
</script>
