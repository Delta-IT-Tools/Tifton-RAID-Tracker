<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIFTON Go-Live Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  #tifton-tracker {
    --ink: #1b2027;
    --ink-soft: #565f6c;
    --paper: #f3f1ea;
    --panel: #ffffff;
    --line: #dcd8cc;
    --steel: #3d5a73;
    --steel-dark: #2b4256;
    --steel-bg: #e4ebef;
    --amber: #c4791f;
    --amber-bg: #fbeee0;
    --rust: #a3402f;
    --rust-bg: #f8e6e1;
    --moss: #4a6b4d;
    --moss-bg: #e7efe4;
    --slate: #6b7280;
    --slate-bg: #eceae2;
    --teal: #1f7a72;
    --teal-bg: #daf0ee;
    --plum: #6b4fa0;
    --plum-bg: #f2ecfb;
    --forest: #2f6b3a;
    --forest-bg: #e2f0e4;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #9AC6E2 0%, #263138 100%);
    border-radius: 10px;
    padding: 0;
    max-width: 100%;
    box-sizing: border-box;
  }
  #tifton-tracker * { box-sizing: border-box; }
  #tifton-tracker .head {
    padding: 22px 24px 18px;
    background-color: #334249;
    border-radius: 10px 10px 0 0;
    border-bottom: 2px solid #1b2027;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  #tifton-tracker .eyebrow {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: #9AC6E2;
    margin: 0 0 4px;
    font-weight: 600;
  }
  #tifton-tracker h1 {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-size: 30px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    line-height: 1.05;
    color: #f3f1ea;
  }
  #tifton-tracker .head-sub {
    font-size: 13px;
    color: #c3d4da;
    margin-top: 6px;
  }
  #tifton-tracker .stat-row {
    display: flex;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel);
  }
  #tifton-tracker .stat {
    padding: 8px 16px;
    text-align: center;
    border-right: 1px solid var(--line);
    min-width: 74px;
  }
  #tifton-tracker .stat:last-child { border-right: none; }
  #tifton-tracker .stat .n { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 600; line-height: 1; }
  #tifton-tracker .stat .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-top: 3px; }
  #tifton-tracker .stat.open .n { color: var(--rust); }
  #tifton-tracker .stat.inprogress .n { color: var(--amber); }
  #tifton-tracker .stat.testing .n { color: var(--steel); }
  #tifton-tracker .stat.readycustomer .n { color: var(--moss); }
  #tifton-tracker .stat.readyinstall .n { color: var(--slate); }
  #tifton-tracker .stat.monitoring .n { color: var(--plum); }
  #tifton-tracker .stat.onhold .n { color: var(--forest); }
  #tifton-tracker .stat.closed .n { color: var(--teal); }
  #tifton-tracker .stat.late-stat {
    cursor: pointer;
    background: var(--amber-bg);
    border-left: 2px solid var(--amber);
  }
  #tifton-tracker .stat.late-stat .n { color: var(--amber); }
  #tifton-tracker .stat.late-stat .l { color: var(--amber); font-weight: 600; }
  #tifton-tracker .stat.late-stat:hover { background: #f6ddb8; }
  #tifton-tracker .stat.late-stat.active { background: var(--amber); }
  #tifton-tracker .stat.late-stat.active .n,
  #tifton-tracker .stat.late-stat.active .l { color: white; }
  #tifton-tracker .stat.blocker-stat {
    cursor: pointer;
    background: var(--rust-bg);
    border-left: 2px solid var(--rust);
  }
  #tifton-tracker .stat.blocker-stat .n { color: var(--rust); }
  #tifton-tracker .stat.blocker-stat .l { color: var(--rust); font-weight: 600; }
  #tifton-tracker .stat.blocker-stat:hover { background: #f4d9d3; }
  #tifton-tracker .stat.blocker-stat.active { background: var(--rust); }
  #tifton-tracker .stat.blocker-stat.active .n,
  #tifton-tracker .stat.blocker-stat.active .l { color: white; }

  #tifton-tracker .toolbar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.12);
  }
  #tifton-tracker .toolbar-filters {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: space-between;
  }
  #tifton-tracker .toolbar-filters > * { flex: 1 1 0; min-width: 0; }
  #tifton-tracker .toolbar-search {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #tifton-tracker select, #tifton-tracker input[type=text] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
  }
  #tifton-tracker input[type=text] { width: 100%; max-width: 340px; }

  #tifton-tracker .view-toggle {
    display: flex;
    border: 1px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
    margin-left: auto;
  }
  #tifton-tracker .view-toggle button {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    border: none;
    border-right: 1px solid #d5d5d5;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  #tifton-tracker .view-toggle button:last-child { border-right: none; }
  #tifton-tracker .view-toggle button.active { background: var(--ink); color: var(--paper); border-right-color: var(--ink); }
  #tifton-tracker .btn-copy {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border: 1px solid var(--ink);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  #tifton-tracker .btn-copy:hover { background: var(--ink); color: var(--paper); }
  #tifton-tracker .btn-copy.copied { background: var(--moss); border-color: var(--moss); color: white; }

  #tifton-tracker .data-io {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 14px 24px 20px;
    border-top: 1px solid rgba(243,241,234,0.25);
  }
  #tifton-tracker .btn-io {
    display: inline-block;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 14px;
    border: 1px solid rgba(243,241,234,0.5);
    border-radius: 6px;
    background: transparent;
    color: rgba(243,241,234,0.85);
    cursor: pointer;
  }
  #tifton-tracker .btn-io:hover { background: rgba(243,241,234,0.12); border-color: rgba(243,241,234,0.8); color: #f3f1ea; }
  #tifton-tracker .logout-row { text-align: center; padding: 0 24px 16px; }
  #tifton-tracker .logout-link { font-size: 11.5px; color: rgba(243,241,234,0.55); text-decoration: none; }
  #tifton-tracker .logout-link:hover { text-decoration: underline; color: rgba(243,241,234,0.85); }

  /* Network diagram */
  #tifton-tracker .network-fab {
    position: fixed;
    bottom: 16px;
    right: 20px;
    z-index: 400;
    background: rgba(51, 66, 73, 0.9);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #tifton-tracker .network-fab:hover { background: #334249; }
  #tifton-tracker .diagram-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 26, 29, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 600;
    padding: 20px;
  }
  #tifton-tracker .diagram-modal {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    max-width: 720px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  #tifton-tracker .diagram-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  #tifton-tracker .diagram-modal-head h2 { font-size: 16px; font-weight: 700; margin: 0; color: var(--ink); font-family: 'Oswald', sans-serif; }
  #tifton-tracker .diagram-close-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: var(--paper);
    color: var(--ink-soft);
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }
  #tifton-tracker .diagram-close-btn:hover { background: var(--line); color: var(--ink); }
  #tifton-tracker .diagram-visual {
    background: linear-gradient(180deg, #9AC6E2 0%, #263138 100%);
    border-radius: 10px;
    padding: 16px;
  }
  #tifton-tracker .diagram-caption { font-size: 13px; color: #fff; line-height: 1.5; margin-top: 12px; }
  #tifton-tracker .diagram-security { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  #tifton-tracker .diagram-security-title { font-size: 14px; font-weight: 700; color: var(--ink); margin: 0 0 8px; font-family: 'Oswald', sans-serif; }
  #tifton-tracker .diagram-security-text { font-size: 13px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 8px; }
  #tifton-tracker .diagram-security-text:last-child { margin-bottom: 0; }
  #tifton-tracker .visually-hidden-input {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  #tifton-tracker .body { padding: 18px 24px 26px; }

  /* Board view */
  #tifton-tracker .as-of-banner {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--steel);
    border-radius: 6px;
    padding: 10px 16px;
    margin-bottom: 14px;
  }
  #tifton-tracker .as-of-banner-empty {
    color: var(--ink-soft);
    font-weight: 600;
    border-left-color: var(--slate);
    text-transform: none;
    letter-spacing: normal;
  }
  #tifton-tracker .board {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  #tifton-tracker .board-col {
    flex: 1 0 260px;
    min-width: 260px;
  }
  #tifton-tracker .board-scrollbar-proxy {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 16px;
    overflow-x: auto;
    overflow-y: hidden;
    background: rgba(27,32,39,0.85);
    z-index: 500;
    display: none;
  }
  #tifton-tracker .board-scrollbar-proxy.visible { display: block; }
  #tifton-tracker .board-scrollbar-proxy-inner { height: 1px; }
  #tifton-tracker .col-head {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding-bottom: 8px;
    margin-bottom: 10px;
    color: #334249;
    border-bottom: 2px solid rgba(51,66,73,0.55);
    display: flex;
    justify-content: space-between;
  }
  #tifton-tracker .col-head span.count { color: rgba(51,66,73,0.7); font-weight: 400; }
  #tifton-tracker .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--slate);
    border-radius: 6px;
    padding: 11px 12px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  #tifton-tracker .card:hover { border-color: var(--ink); }
  #tifton-tracker .card.open { border-left-color: var(--rust); }
  #tifton-tracker .card.inprogress { border-left-color: var(--amber); }
  #tifton-tracker .card.testing { border-left-color: var(--steel); }
  #tifton-tracker .card.readycustomer { border-left-color: var(--moss); }
  #tifton-tracker .card.readyinstall { border-left-color: var(--slate); }
  #tifton-tracker .card.monitoring { border-left-color: var(--plum); }
  #tifton-tracker .card.onhold { border-left-color: var(--forest); }
  #tifton-tracker .card.closed { border-left-color: var(--teal); }
  #tifton-tracker .card-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  #tifton-tracker .tag {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--steel-dark);
    background: #e4ebef;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  #tifton-tracker .card-title { font-size: 13.5px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; min-height: calc(1.3em * 2); }
  #tifton-tracker .blocker-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: white;
    background: var(--rust);
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  #tifton-tracker .meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  #tifton-tracker .devops-tag {
    display: inline-block;
    font-family: monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--steel-dark);
    background: #e4ebef;
    border: 1px solid #c9d7de;
    border-radius: 4px;
    padding: 1px 7px;
  }
  #tifton-tracker .priority-tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    border-radius: 4px;
    padding: 1px 7px;
    background: var(--steel-bg);
    color: var(--steel);
  }
  #tifton-tracker .priority-tag.high { background: var(--rust-bg); color: var(--rust); }
  #tifton-tracker .priority-tag.medium { background: var(--amber-bg); color: var(--amber); }
  #tifton-tracker .priority-tag.low { background: var(--slate-bg); color: var(--slate); }
  #tifton-tracker .target-tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--steel-dark);
    background: #e4ebef;
    border-radius: 4px;
    padding: 1px 7px;
  }
  #tifton-tracker .card-detail {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: calc(1.4em * 3);
  }
  #tifton-tracker .card-reported { font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }
  #tifton-tracker .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 8px;
    margin-top: auto;
    padding-top: 8px;
  }

  /* Table view */
  #tifton-tracker table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #tifton-tracker thead th {
    text-align: left;
    font-family: 'Oswald', sans-serif;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #f3f1ea;
    padding: 8px 10px;
    border-bottom: 2px solid rgba(243,241,234,0.55);
  }
  #tifton-tracker tbody tr { background: rgba(255,255,255,0.9); }
  #tifton-tracker tbody td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  #tifton-tracker tbody tr:hover { background: #ffffff; cursor: pointer; }
  #tifton-tracker .status-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 100px;
    white-space: nowrap;
    display: inline-block;
  }
  #tifton-tracker .status-pill.open { background: var(--rust-bg); color: var(--rust); }
  #tifton-tracker .status-pill.inprogress { background: var(--amber-bg); color: var(--amber); }
  #tifton-tracker .status-pill.testing { background: var(--steel-bg); color: var(--steel); }
  #tifton-tracker .status-pill.readycustomer { background: var(--moss-bg); color: var(--moss); }
  #tifton-tracker .status-pill.readyinstall { background: var(--slate-bg); color: var(--slate); }
  #tifton-tracker .status-pill.monitoring { background: var(--plum-bg); color: var(--plum); }
  #tifton-tracker .status-pill.onhold { background: var(--forest-bg); color: var(--forest); }
  #tifton-tracker .status-pill.closed { background: var(--teal-bg); color: var(--teal); }

  #tifton-tracker .empty { text-align: center; padding: 40px 20px; color: rgba(243,241,234,0.75); font-size: 13px; }

  /* Calendar view */
  #tifton-tracker .calendar {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  #tifton-tracker .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  #tifton-tracker .cal-month-label {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  #tifton-tracker .cal-month-count { font-size: 12px; font-weight: 400; color: var(--ink-soft); }
  #tifton-tracker .cal-nav {
    font-family: inherit;
    font-size: 18px;
    font-weight: 600;
    width: 30px;
    height: 30px;
    line-height: 1;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  #tifton-tracker .cal-nav:hover { border-color: var(--ink); }
  #tifton-tracker .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  #tifton-tracker .cal-grid-head { margin-bottom: 6px; }
  #tifton-tracker .cal-dayname {
    text-align: center;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding-bottom: 4px;
  }
  #tifton-tracker .cal-cell {
    min-height: 64px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px;
    position: relative;
  }
  #tifton-tracker .cal-cell.empty { border-color: transparent; }
  #tifton-tracker .cal-daynum { font-size: 12px; color: var(--ink-soft); }
  #tifton-tracker .cal-cell.is-today .cal-daynum { color: var(--steel); font-weight: 700; }
  #tifton-tracker .cal-cell.is-today { border-color: var(--steel); border-width: 2px; }
  #tifton-tracker .cal-cell.has-due {
    cursor: pointer;
    background: var(--rust-bg);
    border-color: var(--rust);
  }
  #tifton-tracker .cal-cell.has-due:hover { background: #f4d9d3; }
  #tifton-tracker .cal-cell.has-due.is-selected { background: var(--rust); border-color: var(--rust); }
  #tifton-tracker .cal-cell.has-due.is-selected .cal-daynum,
  #tifton-tracker .cal-cell.has-due.is-selected .cal-count { color: white; }
  #tifton-tracker .cal-count {
    position: absolute;
    bottom: 6px;
    right: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--rust);
  }
  #tifton-tracker .cal-detail {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }
  #tifton-tracker .cal-detail-header {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  #tifton-tracker .cal-detail-header .count { font-weight: 400; color: var(--ink-soft); }
  #tifton-tracker .cal-detail-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

  /* Completed view */
  #tifton-tracker .closed-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }
  #tifton-tracker .closed-header {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--teal);
    border-bottom: 2px solid var(--teal);
    padding-bottom: 8px;
    margin-bottom: 14px;
  }
  #tifton-tracker .closed-header .count { font-weight: 400; color: rgba(243,241,234,0.75); }


  /* History view */
  #tifton-tracker .history-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }
  #tifton-tracker .history-header {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
    padding-bottom: 8px;
    margin-bottom: 14px;
  }
  #tifton-tracker .history-header .count { font-weight: 400; color: var(--ink-soft); }
  #tifton-tracker .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #tifton-tracker .history-table thead th {
    text-align: left;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding: 6px 10px;
    border-bottom: 2px solid var(--line);
  }
  #tifton-tracker .history-table tbody td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  #tifton-tracker .history-delete-btn {
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }
  #tifton-tracker .history-delete-btn:hover { background: var(--rust-bg); color: var(--rust); }
  #tifton-tracker .history-diff-section {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
  }
  #tifton-tracker .history-diff-title { font-family: 'Oswald', sans-serif; font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  #tifton-tracker .history-diff-summary { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; }
  #tifton-tracker .history-diff-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  #tifton-tracker .history-diff-list:last-child { margin-bottom: 0; }
  #tifton-tracker .history-diff-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; flex-wrap: wrap; }
  #tifton-tracker .history-diff-arrow { color: var(--ink-soft); }
  #tifton-tracker .history-diff-item-title { color: var(--ink); }

  /* Modal */
  #tifton-tracker .modal-backdrop {
    position: fixed; inset: 0; background: rgba(27,32,39,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  #tifton-tracker .modal {
    background: var(--panel); border-radius: 10px; padding: 24px;
    max-width: 480px; width: 100%; max-height: 86vh; overflow-y: auto;
    border: 1px solid var(--line);
  }
  #tifton-tracker .modal h2 { font-family: 'Oswald', sans-serif; font-size: 18px; margin: 0 0 14px; }
  #tifton-tracker .field { margin-bottom: 12px; }
  #tifton-tracker .field label { display: block; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin-bottom: 4px; }
  #tifton-tracker .field input, #tifton-tracker .field select, #tifton-tracker .field textarea {
    width: 100%; font-family: inherit; font-size: 13.5px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
  }
  #tifton-tracker .field textarea { min-height: 70px; resize: vertical; }
  #tifton-tracker .field-row { display: flex; gap: 10px; }
  #tifton-tracker .field-row .field { flex: 1; }
  #tifton-tracker .modal-actions { display: flex; justify-content: space-between; margin-top: 18px; gap: 8px; }
  #tifton-tracker .btn-primary {
    font-family: inherit; font-weight: 600; font-size: 13px; padding: 9px 16px;
    border: none; border-radius: 6px; background: var(--steel); color: white; cursor: pointer;
  }
  #tifton-tracker .btn-secondary {
    font-family: inherit; font-weight: 600; font-size: 13px; padding: 9px 16px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer;
  }
  #tifton-tracker .btn-delete {
    font-family: inherit; font-weight: 600; font-size: 13px; padding: 9px 16px;
    border: none; border-radius: 6px; background: transparent; color: var(--rust); cursor: pointer;
  }
  #tifton-tracker .save-note { font-size: 11px; color: rgba(243,241,234,0.7); text-align: right; padding: 0 24px 14px; }

  @media (max-width: 480px) {
    #tifton-tracker .head { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div id="tifton-tracker">
  <div class="head">
    <div>
      <p class="eyebrow">HY-TEK &middot; DELTA GALIL</p>
      <h1>TIFTON Go-Live Tracker</h1>
      <p class="head-sub" id="header-summary">Loading&hellip;</p>
    </div>
    <div class="stat-row" id="stat-row"></div>
  </div>

  <div class="toolbar">
    <div class="toolbar-filters">
      <select id="filter-status">
        <option value="">All statuses</option>
      </select>
      <select id="filter-blocker">
        <option value="">Blocker: All</option>
        <option value="Y">Walmart blocker only</option>
        <option value="N">Not a blocker</option>
      </select>
      <select id="filter-missing">
        <option value="">Missing info: All</option>
        <option value="devops">Missing DevOps #</option>
        <option value="target">Missing Due Date</option>
        <option value="either">Missing DevOps # or Due Date</option>
      </select>
      <button class="btn-copy" id="btn-copy-view">Copy view</button>
    </div>
    <div class="toolbar-search">
      <input type="text" id="search" placeholder="Search issues...">
      <div class="view-toggle" id="view-toggle">
        <button data-view="board" class="active">Board</button>
        <button data-view="table">Table</button>
        <button data-view="calendar">Calendar</button>
        <button data-view="closed">Closed</button>
        <button data-view="history">History</button>
      </div>
    </div>
  </div>

  <div class="body" id="body"></div>
  <div class="board-scrollbar-proxy" id="board-scrollbar-proxy">
    <div class="board-scrollbar-proxy-inner" id="board-scrollbar-proxy-inner"></div>
  </div>
  <div class="save-note" id="save-note">Loading&hellip;</div>
  <div class="data-io">
    <button class="btn-io" id="btn-upload-raid">Upload RAID Log</button>
    <button class="btn-io" id="btn-export">Export JSON</button>
    <button class="btn-io" id="btn-import">Import JSON</button>
  </div>
  <div class="logout-row"><a href="/logout" class="logout-link">Log out</a></div>
  <button type="button" class="network-fab" id="btn-network-diagram">Network diagram</button>
</div>

<script>
(function() {
  const ROOT = document.getElementById('tifton-tracker');
  const CURRENT_DATA_VERSION = 8; // bump this whenever the seed data below should replace what's saved

  const SEED_ISSUES = [];

  const STATUS_LABELS = { open: 'Open', inprogress: 'In Progress (Dev)', testing: 'Testing', readycustomer: 'Ready for Customer', readyinstall: 'Ready for Install', monitoring: 'Monitoring', onhold: 'On Hold', closed: 'Closed' };
  // Full canonical list of every status the tool understands — used by
  // filters, the Table view, and the edit modal's status dropdown.
  const STATUS_ORDER = ['open', 'inprogress', 'testing', 'readycustomer', 'readyinstall', 'monitoring', 'onhold', 'closed'];
  // The Board view intentionally shows only these five, in this exact
  // order — Monitoring/On Hold/Closed items still exist and are fully
  // trackable elsewhere (Table view, Closed tab, filters), they're just
  // not given their own Board column.
  const BOARD_STATUS_ORDER = ['open', 'inprogress', 'testing', 'readycustomer', 'readyinstall'];

  let issues = [];
  let currentAsOfDate = null;
  let currentView = 'board';
  let calendarMonth = (() => {
    const d = new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  })();
  let selectedCalendarDate = null;
  let editingId = null;
  let activeBoardEl = null;

  async function loadIssues() {
    try {
      const res = await fetch('/api/issues');
      if (!res.ok) throw new Error('Failed to load issues: ' + res.status);
      const payload = await res.json();
      const storedVersion = payload.dataVersion || 0;
      currentAsOfDate = payload.asOfDate || null;

      if (storedVersion < CURRENT_DATA_VERSION) {
        // Fresh dataset supersedes whatever was previously saved.
        issues = SEED_ISSUES.slice();
        await saveIssues();
        return;
      }

      issues = Array.isArray(payload.issues) ? payload.issues : [];
      migrateRemovedStatuses();
    } catch (e) {
      console.error('Load error', e);
      issues = SEED_ISSUES.slice();
      const noteEl = document.getElementById('save-note');
      if (noteEl) { noteEl.textContent = 'Could not reach the database — showing default data'; }
    }
  }

  // Fixes up any saved issues still carrying a status value that no longer exists
  // in the app (e.g. the retired "watching" status), without touching anything else.
  function migrateRemovedStatuses() {
    let changed = false;
    issues.forEach(i => {
      if (!STATUS_ORDER.includes(i.status)) {
        i.status = 'open';
        changed = true;
      }
    });
    if (changed) saveIssues();
  }

  // asOfDate is only passed when this save represents a live RAID Log
  // upload (see openUploadRaidModal) — omitting it on manual single-issue
  // edits means the "RAID LOG AS OF" date on the Board only moves when you
  // actually re-upload the source spreadsheet, not on every small tweak.
  async function saveIssues(asOfDate) {
    const noteEl = document.getElementById('save-note');
    try {
      const body = { issues, dataVersion: CURRENT_DATA_VERSION };
      if (asOfDate) body.asOfDate = asOfDate;
      const res = await fetch('/api/issues', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('Save failed: ' + res.status);
      if (asOfDate) currentAsOfDate = asOfDate;
      if (noteEl) { noteEl.textContent = 'Saved · shared with everyone using this tracker'; }
    } catch (e) {
      if (noteEl) { noteEl.textContent = 'Could not save — changes may not persist'; }
      console.error('Storage error', e);
    }
  }

  function populateFilters() {
    const statusSel = document.getElementById('filter-status');
    const curStatus = statusSel.value;
    statusSel.innerHTML = '<option value="">All statuses</option>' + STATUS_ORDER.map(s => `<option value="${s}">${STATUS_LABELS[s]}</option>`).join('');
    statusSel.value = curStatus;
  }

  // A target date that's a real ISO date (not text like "TBD" or "On Hold"),
  // in the past, and not yet closed — closed items don't count as "late"
  // even if their target date has passed, since the work is done.
  function isLate(issue) {
    if (!issue.targetDate || !/^\d{4}-\d{2}-\d{2}$/.test(issue.targetDate)) return false;
    if (issue.status === 'closed') return false;
    return issue.targetDate < todayISO();
  }

  let lateFilterActive = false;

  function getFiltered() {
    const status = document.getElementById('filter-status').value;
    const blockerFilter = document.getElementById('filter-blocker').value;
    const missingFilter = document.getElementById('filter-missing').value;
    const q = document.getElementById('search').value.trim().toLowerCase();
    return issues.filter(i => {
      if (status && i.status !== status) return false;
      if (blockerFilter === 'Y' && !isBlocker(i.blocker)) return false;
      if (blockerFilter === 'N' && isBlocker(i.blocker)) return false;
      const missingDevops = !i.devops;
      // "Missing" a due date means blank OR a non-date placeholder like
      // "TBD"/"On Hold"/"N/A" — anything that isn't a real, usable date.
      const missingTarget = !i.targetDate || !/^\d{4}-\d{2}-\d{2}$/.test(i.targetDate);
      if (missingFilter === 'devops' && !missingDevops) return false;
      if (missingFilter === 'target' && !missingTarget) return false;
      if (missingFilter === 'either' && !(missingDevops || missingTarget)) return false;
      if (lateFilterActive && !isLate(i)) return false;
      if (q) {
        const hay = (i.title + ' ' + i.detail + ' ' + (i.owner||'') + ' ' + (i.devops||'') + ' ' + (i.notes||'')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function renderStats() {
    const counts = {};
    STATUS_ORDER.forEach(s => { counts[s] = 0; });
    issues.forEach(i => { counts[i.status] = (counts[i.status]||0) + 1; });
    const blockerCount = issues.filter(i => isBlocker(i.blocker)).length;
    const blockerActive = document.getElementById('filter-blocker').value === 'Y';
    const lateCount = issues.filter(isLate).length;
    const row = document.getElementById('stat-row');
    // Mirrors the Board view's 5 columns for a clean, consistent header —
    // Monitoring/On Hold/Closed items are still fully counted and
    // visible elsewhere (Table view, Closed tab), just not given their
    // own tile here.
    row.innerHTML = BOARD_STATUS_ORDER.map(s =>
      `<div class="stat ${s}"><div class="n">${counts[s]}</div><div class="l">${STATUS_LABELS[s]}</div></div>`
    ).join('')
      + `<div class="stat late-stat${lateFilterActive ? ' active' : ''}" id="late-stat" title="Click to show only late items (target date has passed)"><div class="n">${lateCount}</div><div class="l">Late</div></div>`
      + `<div class="stat blocker-stat${blockerActive ? ' active' : ''}" id="blocker-stat" title="Click to show only Walmart blockers"><div class="n">${blockerCount}</div><div class="l">Walmart Blockers</div></div>`;
    document.getElementById('late-stat').addEventListener('click', () => {
      lateFilterActive = !lateFilterActive;
      render();
    });
    document.getElementById('blocker-stat').addEventListener('click', () => {
      const sel = document.getElementById('filter-blocker');
      sel.value = sel.value === 'Y' ? '' : 'Y';
      render();
    });
  }

  function renderHeaderSummary() {
    const el = document.getElementById('header-summary');
    const n = issues.length;
    el.textContent = n === 0 ? 'No issues yet' : `${n} tracked issue${n === 1 ? '' : 's'}`;
  }

  function formatDate(iso) {
    if (!iso) return '';
    // Target dates pulled from the RAID log are sometimes text placeholders
    // ("TBD", "On HOLD", "N/A", "FDD to be created") rather than real
    // dates — only attempt to reformat things that actually look like an
    // ISO date (YYYY-MM-DD); anything else is shown exactly as entered
    // rather than becoming "Invalid Date".
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    if (isNaN(dt)) return iso;
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function isBlocker(blocker) {
    return blocker === 'Y' || blocker === 'Y/N';
  }

  function cardHtml(issue) {
    const priorityClass = ['high','medium','low'].includes((issue.priority || '').toLowerCase()) ? issue.priority.toLowerCase() : '';
    const priorityLabel = priorityClass ? `${issue.priority} priority` : `Priority: ${issue.priority}`;
    return `
      <div class="card ${issue.status}" data-id="${issue.id}">
        <div class="card-top">
          ${isBlocker(issue.blocker) ? `<span class="blocker-tag">Walmart blocker${issue.blocker === 'Y/N' ? ' (Y/N)' : ''}</span>` : ''}
        </div>
        <div class="card-title">${issue.title}</div>
        <div class="meta-row">
          ${issue.raidNumber ? `<span class="devops-tag">RAID #${issue.raidNumber}</span>` : ''}
          ${issue.priority ? `<span class="priority-tag ${priorityClass}">${priorityLabel}</span>` : ''}
          ${issue.targetDate ? `<span class="target-tag">Target: ${formatDate(issue.targetDate)}</span>` : ''}
        </div>
        <div class="card-detail">${issue.detail}</div>
        <div class="card-footer">
          <div>
            ${issue.reportedDate ? `<div class="card-reported">Reported ${formatDate(issue.reportedDate)}</div>` : ''}
          </div>
          ${issue.devops ? `<span class="devops-tag">DevOps #${issue.devops}</span>` : ''}
        </div>
      </div>
    `;
  }

  function renderBoard(list) {
    const asOfHtml = currentAsOfDate
      ? `<div class="as-of-banner">RAID LOG AS OF ${formatDate(currentAsOfDate).toUpperCase()}</div>`
      : `<div class="as-of-banner as-of-banner-empty">No RAID log uploaded yet — use "Upload RAID Log" to get started</div>`;
    const cols = BOARD_STATUS_ORDER.map(st => {
      const items = list.filter(i => i.status === st);
      return `
        <div class="board-col">
          <div class="col-head">${STATUS_LABELS[st]} <span class="count">${items.length}</span></div>
          ${items.map(cardHtml).join('') || '<div class="empty">No issues</div>'}
        </div>
      `;
    }).join('');
    return `${asOfHtml}<div class="board">${cols}</div>`;
  }

  function renderTable(list) {
    const sorted = list.slice().sort((a,b) => {
      const statusDiff = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
      return statusDiff !== 0 ? statusDiff : a.title.localeCompare(b.title);
    });
    if (!sorted.length) return '<div class="empty">No issues match these filters</div>';
    return `
      <table>
        <thead><tr><th>Issue</th><th>DevOps #</th><th>Priority</th><th>Walmart Blocker</th><th>Reported</th><th>Target</th><th>Owner</th><th>Status</th></tr></thead>
        <tbody>
          ${sorted.map(i => `
            <tr data-id="${i.id}">
              <td>
                <strong>${i.title}</strong><br><span style="color:var(--ink-soft);font-size:12px;">${i.detail}</span>
                ${i.notes ? `<br><span style="color:var(--steel-dark);font-size:11.5px;font-style:italic;"><strong>Notes:</strong> ${i.notes}</span>` : ''}
              </td>
              <td>${i.devops || '—'}</td>
              <td>${i.priority || '—'}</td>
              <td>${isBlocker(i.blocker) ? `<span class="blocker-tag">${i.blocker}</span>` : (i.blocker || '—')}</td>
              <td>${i.reportedDate ? formatDate(i.reportedDate) : '—'}</td>
              <td>${i.targetDate ? formatDate(i.targetDate) : '—'}</td>
              <td>${i.owner || '—'}</td>
              <td>
                <span class="status-pill ${i.status}">${STATUS_LABELS[i.status]}</span>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function issuesByDueDate(list) {
    const map = {};
    list.forEach(i => {
      if (i.targetDate) (map[i.targetDate] = map[i.targetDate] || []).push(i);
    });
    return map;
  }

  function renderCalendar(list) {
    const dueMap = issuesByDueDate(list);
    const { year, month } = calendarMonth;
    const firstOfMonth = new Date(year, month, 1);
    const startWeekday = firstOfMonth.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const monthLabel = firstOfMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const today = todayISO();
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    let cells = '';
    for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dueIssues = dueMap[iso] || [];
      const classes = ['cal-cell'];
      if (dueIssues.length) classes.push('has-due');
      if (iso === today) classes.push('is-today');
      if (iso === selectedCalendarDate) classes.push('is-selected');
      cells += `
        <div class="${classes.join(' ')}" data-cal-date="${iso}">
          <div class="cal-daynum">${d}</div>
          ${dueIssues.length ? `<div class="cal-count">${dueIssues.length}</div>` : ''}
        </div>`;
    }
    const totalCells = startWeekday + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 0; i < trailing; i++) cells += `<div class="cal-cell empty"></div>`;

    const monthTotal = Object.keys(dueMap).filter(iso => iso.startsWith(`${year}-${String(month + 1).padStart(2,'0')}`)).reduce((sum, iso) => sum + dueMap[iso].length, 0);

    const detailIssues = selectedCalendarDate ? (dueMap[selectedCalendarDate] || []) : [];
    const detailHtml = selectedCalendarDate ? `
      <div class="cal-detail">
        <div class="cal-detail-header">Due ${formatDate(selectedCalendarDate)} <span class="count">(${detailIssues.length})</span></div>
        <div class="cal-detail-list">
          ${detailIssues.length ? detailIssues.map(cardHtml).join('') : '<div class="empty">No issues due this day.</div>'}
        </div>
      </div>` : `
      <div class="cal-detail">
        <div class="empty">Click a highlighted date to see what's due that day.</div>
      </div>`;

    return `
      <div class="calendar">
        <div class="cal-header">
          <button type="button" class="cal-nav" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
          <div class="cal-month-label">${monthLabel}<span class="cal-month-count">${monthTotal} due this month</span></div>
          <button type="button" class="cal-nav" id="cal-next" aria-label="Next month">&rsaquo;</button>
        </div>
        <div class="cal-grid cal-grid-head">${dayNames.map(n => `<div class="cal-dayname">${n}</div>`).join('')}</div>
        <div class="cal-grid">${cells}</div>
      </div>
      ${detailHtml}
    `;
  }

  function renderClosedList(list) {
    const closed = list.filter(i => i.status === 'closed').sort((a,b) => a.title.localeCompare(b.title));
    if (!closed.length) return '<div class="empty">No closed issues match these filters.</div>';
    return `
      <div class="closed-wrap">
        <div class="closed-header">Closed <span class="count">(${closed.length})</span></div>
        <table>
          <thead><tr><th>Issue</th><th>DevOps #</th><th>Priority</th><th>Walmart Blocker</th><th>Reported</th><th>Target</th><th>Owner</th><th>Status</th></tr></thead>
          <tbody>
            ${closed.map(i => `
              <tr data-id="${i.id}">
                <td>
                  <strong>${i.title}</strong><br><span style="color:var(--ink-soft);font-size:12px;">${i.detail}</span>
                  ${i.notes ? `<br><span style="color:var(--steel-dark);font-size:11.5px;font-style:italic;"><strong>Notes:</strong> ${i.notes}</span>` : ''}
                </td>
                <td>${i.devops || '—'}</td>
                <td>${i.priority || '—'}</td>
                <td>${isBlocker(i.blocker) ? `<span class="blocker-tag">${i.blocker}</span>` : (i.blocker || '—')}</td>
                <td>${i.reportedDate ? formatDate(i.reportedDate) : '—'}</td>
                <td>${i.targetDate ? formatDate(i.targetDate) : '—'}</td>
                <td>${i.owner || '—'}</td>
                <td><span class="status-pill ${i.status}">${STATUS_LABELS[i.status]}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  // ---------- History (upload snapshots) ----------

  function diffSnapshotItems(older, newer) {
    const olderMap = new Map(older.map(i => [i.id, i]));
    const newerMap = new Map(newer.map(i => [i.id, i]));
    const added = [];
    const removed = [];
    const statusChanged = [];
    newerMap.forEach((item, id) => {
      if (!olderMap.has(id)) {
        added.push(item);
      } else if (olderMap.get(id).status !== item.status) {
        statusChanged.push({ item, from: olderMap.get(id).status, to: item.status });
      }
    });
    olderMap.forEach((item, id) => {
      if (!newerMap.has(id)) removed.push(item);
    });
    return { added, removed, statusChanged };
  }

  async function loadAndRenderHistory() {
    const body = document.getElementById('body');
    let snapshots;
    try {
      const res = await fetch('/api/snapshots');
      if (!res.ok) throw new Error('Failed to load history: ' + res.status);
      const payload = await res.json();
      snapshots = payload.snapshots || [];
    } catch (e) {
      if (currentView === 'history') {
        body.innerHTML = '<div class="empty">Could not load upload history.</div>';
      }
      return;
    }

    if (currentView !== 'history') return; // view changed while loading

    if (!snapshots.length) {
      body.innerHTML = `
        <div class="history-wrap">
          <div class="history-header">Upload History</div>
          <div class="empty">No RAID log uploads recorded yet. Use "Upload RAID Log" to start building history.</div>
        </div>
      `;
      return;
    }

    const tableRows = snapshots.map(s => {
      const c = s.statusCounts;
      return `
        <tr>
          <td>${formatDateTime(s.uploadedAt)}</td>
          <td>${s.itemCount}</td>
          <td>${c.open || 0}</td>
          <td>${c.inprogress || 0}</td>
          <td>${c.testing || 0}</td>
          <td>${c.monitoring || 0}</td>
          <td>${c.onhold || 0}</td>
          <td>${c.closed || 0}</td>
          <td><button type="button" class="history-delete-btn" data-snapshot-id="${s.id}" title="Delete this upload record">&times;</button></td>
        </tr>
      `;
    }).join('');

    let diffHtml = '';
    if (snapshots.length >= 2) {
      diffHtml = '<div class="history-diff-section"><div class="history-diff-title">Comparing the two most recent uploads&hellip;</div></div>';
    }

    body.innerHTML = `
      <div class="history-wrap">
        <div class="history-header">Upload History <span class="count">(${snapshots.length} upload${snapshots.length === 1 ? '' : 's'})</span></div>
        <div id="history-diff-slot">${diffHtml}</div>
        <table class="history-table">
          <thead><tr><th>Uploaded</th><th>Items</th><th>Open</th><th>In Progress</th><th>Testing</th><th>Monitoring</th><th>On Hold</th><th>Closed</th><th></th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    `;

    body.querySelectorAll('.history-delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-snapshot-id');
        showConfirmModal(
          'Delete this upload record from History? This only removes it from the History log — it does not change your current tracker data.',
          async () => {
            try {
              await fetch('/api/snapshots/' + id, { method: 'DELETE' });
            } catch (e) {
              console.error('Delete snapshot failed', e);
            }
            if (currentView === 'history') loadAndRenderHistory();
          },
          'Delete'
        );
      });
    });

    if (snapshots.length >= 2) {
      const [newest, previous] = snapshots; // already newest-first
      try {
        const [newestRes, previousRes] = await Promise.all([
          fetch('/api/snapshots/' + newest.id),
          fetch('/api/snapshots/' + previous.id),
        ]);
        const newestDetail = await newestRes.json();
        const previousDetail = await previousRes.json();
        if (currentView !== 'history') return;
        const diff = diffSnapshotItems(previousDetail.issues, newestDetail.issues);
        const slot = document.getElementById('history-diff-slot');
        if (slot) slot.innerHTML = renderHistoryDiff(diff, previous.uploadedAt, newest.uploadedAt);
      } catch (e) {
        const slot = document.getElementById('history-diff-slot');
        if (slot) slot.innerHTML = '';
      }
    }
  }

  function renderHistoryDiff(diff, fromDate, toDate) {
    const { added, removed, statusChanged } = diff;
    if (!added.length && !removed.length && !statusChanged.length) {
      return `<div class="history-diff-section"><div class="history-diff-title">Since ${formatDateTime(fromDate)}</div><div class="history-diff-summary">No changes between these two uploads.</div></div>`;
    }
    const changeRows = statusChanged.map(c => `
      <div class="history-diff-item">
        <span class="status-pill ${c.from}">${STATUS_LABELS[c.from] || c.from}</span>
        <span class="history-diff-arrow">&rarr;</span>
        <span class="status-pill ${c.to}">${STATUS_LABELS[c.to] || c.to}</span>
        <span class="history-diff-item-title">${c.item.title}</span>
      </div>
    `).join('');
    const addedRows = added.map(i => `<div class="history-diff-item"><span class="status-pill ${i.status}">New</span><span class="history-diff-item-title">${i.title}</span></div>`).join('');
    const removedRows = removed.map(i => `<div class="history-diff-item"><span class="status-pill closed">Removed</span><span class="history-diff-item-title">${i.title}</span></div>`).join('');
    return `
      <div class="history-diff-section">
        <div class="history-diff-title">Since ${formatDateTime(fromDate)}</div>
        <div class="history-diff-summary">${added.length} new &middot; ${removed.length} removed &middot; ${statusChanged.length} changed status</div>
        ${statusChanged.length ? `<div class="history-diff-list">${changeRows}</div>` : ''}
        ${added.length ? `<div class="history-diff-list">${addedRows}</div>` : ''}
        ${removed.length ? `<div class="history-diff-list">${removedRows}</div>` : ''}
      </div>
    `;
  }

  function formatDateTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function render() {
    renderStats();
    renderHeaderSummary();
    const list = getFiltered();
    const body = document.getElementById('body');
    if (currentView === 'board') body.innerHTML = renderBoard(list);
    else if (currentView === 'table') body.innerHTML = renderTable(list);
    else if (currentView === 'calendar') body.innerHTML = renderCalendar(list);
    else if (currentView === 'closed') body.innerHTML = renderClosedList(list);
    else if (currentView === 'history') {
      body.innerHTML = '<div class="empty">Loading history&hellip;</div>';
      loadAndRenderHistory();
    }

    body.querySelectorAll('[data-id]').forEach(el => {
      el.addEventListener('click', () => openModal(el.getAttribute('data-id')));
    });

    if (currentView === 'calendar') {
      const prevBtn = document.getElementById('cal-prev');
      const nextBtn = document.getElementById('cal-next');
      if (prevBtn) prevBtn.addEventListener('click', () => {
        calendarMonth.month--;
        if (calendarMonth.month < 0) { calendarMonth.month = 11; calendarMonth.year--; }
        render();
      });
      if (nextBtn) nextBtn.addEventListener('click', () => {
        calendarMonth.month++;
        if (calendarMonth.month > 11) { calendarMonth.month = 0; calendarMonth.year++; }
        render();
      });
      body.querySelectorAll('.cal-cell.has-due').forEach(cell => {
        cell.addEventListener('click', () => {
          selectedCalendarDate = cell.getAttribute('data-cal-date');
          render();
        });
      });
    }

    syncBoardScrollbar();
  }

  function syncBoardScrollbar() {
    const proxy = document.getElementById('board-scrollbar-proxy');
    const inner = document.getElementById('board-scrollbar-proxy-inner');
    const board = currentView === 'board' ? document.querySelector('#tifton-tracker .board') : null;
    activeBoardEl = board;

    if (!board) {
      proxy.classList.remove('visible');
      return;
    }
    const overflowing = board.scrollWidth > board.clientWidth + 1;
    if (!overflowing) {
      proxy.classList.remove('visible');
      return;
    }
    proxy.classList.add('visible');
    inner.style.width = board.scrollWidth + 'px';
    proxy.scrollLeft = board.scrollLeft;
    board.addEventListener('scroll', onActiveBoardScroll);
  }

  function onActiveBoardScroll() {
    const proxy = document.getElementById('board-scrollbar-proxy');
    if (activeBoardEl && proxy) proxy.scrollLeft = activeBoardEl.scrollLeft;
  }

  function todayLabel() {
    const d = new Date();
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function todayISO() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  // ---------- Export / Import ----------

  function buildExportPayload() {
    const payload = {
      exportedAt: new Date().toISOString(),
      dataVersion: CURRENT_DATA_VERSION,
      issues: issues,
    };
    return JSON.stringify(payload, null, 2);
  }

  function exportData() {
    const text = buildExportPayload();
    const stamp = new Date().toISOString().slice(0, 10);
    const filename = `tifton-tracker-export-${stamp}.json`;

    // Best-effort automatic download. Sandboxed iframes sometimes block
    // programmatic downloads silently, so this is backed up by the modal
    // below which always gives a guaranteed, working way to get the data.
    let downloadAttempted = false;
    try {
      const blob = new Blob([text], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      downloadAttempted = true;
    } catch (e) {
      downloadAttempted = false;
    }

    showExportModal(text, filename, downloadAttempted);
  }

  function showExportModal(text, filename, downloadAttempted) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal" style="max-width:600px;">
        <h2>Export data</h2>

          ${downloadAttempted ? `A download (<strong>${filename}</strong>) was started automatically. ` : ''}
          If it didn't save anywhere useful, copy the text below and save it yourself as a <strong>.json</strong> file.
        </p>
        <textarea id="export-textarea" readonly style="width:100%;height:260px;font-family:monospace;font-size:11.5px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);resize:vertical;"></textarea>
        <div class="modal-actions" style="justify-content:flex-end;gap:8px;">
          <button class="btn-secondary" id="export-close">Close</button>
          <button class="btn-primary" id="export-copy">Copy text</button>
        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);
    const ta = backdrop.querySelector('#export-textarea');
    ta.value = text;
    const close = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    backdrop.querySelector('#export-close').addEventListener('click', close);
    backdrop.querySelector('#export-copy').addEventListener('click', async (e) => {
      const btn = e.target;

      try {
        await navigator.clipboard.writeText(text);

          ok = document.execCommand('copy');
        } catch (err2) { ok = false; }

      setTimeout(() => { btn.textContent = 'Copy text'; }, 1800);

  // ---------- Upload RAID Log (parses the source spreadsheet directly —
  // .xlsx, .xls, or .csv — then transforms it into this tracker's issue
  // format and records a historical snapshot of the result) ----------
  //
  // Columns are detected by matching HEADER TEXT, not by fixed position.
  // This matters because different saved versions of the same RAID log
  // have genuinely different column layouts (e.g. one export has a
  // "DevOps" column and 22 total columns, another has no DevOps column
  // at all and only 16) — a hardcoded position mapping silently misreads
  // every field whenever that happens. Header-based detection adapts to
  // whichever layout is actually in the uploaded file.

  function normalizeHeader(s) {
    return (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' ');
  }

  // Fixed column positions, per your explicit specification — not detected
  // from header text. Header-text detection was tried first but proved too
  // fragile: the same underlying sheet has used different exact wording for
  // the same column across versions (and sometimes reordered columns
  // entirely), which caused silent misreads. These exact positions are the
  // ones you confirmed to trust for every RAID Log upload going forward.
  //   A: RAID # (kept for stable IDs across uploads — needed for the
  //      History view's diffing to work; not one of your listed columns,
  //      but every version of this sheet has had it in column A)
  //   B: Dev Ops        E: Deployment Status   J: Description
  //   K: Turnover to DG Target Date            M: Walmart Blocker
  //   P: Priority       R: Owner
  // Columns not listed (Type, Internal/External, Notes, Latest Comment,
  // DG Priority) are intentionally not read.
  const FIXED_RAID_COLUMNS = {
    raidNumber: 0,   // A
    devops: 1,       // B
    status: 4,       // E
    description: 9,  // J
    targetDate: 10,  // K
    blocker: 12,     // M
    priority: 15,    // P
    owner: 17,       // R
  };

  function detectColumnMap() {
    // Always the same fixed positions — see FIXED_RAID_COLUMNS above.
    return Object.assign({}, FIXED_RAID_COLUMNS);
  }

  function mapRaidStatus(raw) {
    const s = (raw || '').toString().trim().toLowerCase();
    // Order matters: check the more specific/distinguishing phrases
    // before shorter substrings that could otherwise match too broadly.
    if (s.indexOf('closed') !== -1) return 'closed';
    if (s.indexOf('ready for customer') !== -1) return 'readycustomer';
    if (s.indexOf('ready for install') !== -1) return 'readyinstall';
    if (s.indexOf('in progress') !== -1) return 'inprogress';
    // Both "Testing" and "Testing (PSO)" land in the same bucket.
    if (s.indexOf('testing') !== -1) return 'testing';
    if (s.indexOf('monitoring') !== -1) return 'monitoring';
    if (s.indexOf('on hold') !== -1 || s.indexOf('onhold') !== -1) return 'onhold';
    return 'open';
  }

  // Same lesson as mapRaidStatus: match loosely (any case, trimmed,
  // single-letter or full-word) rather than requiring an exact "Yes"/"No"
  // — real exported values vary (e.g. "yes", "Y", trailing spaces) and an
  // exact match silently miscounted many genuine blockers as non-blockers.
  function mapRaidBlocker(raw) {
    const b = (raw || '').toString().trim().toLowerCase();
    if (b === 'y/n' || b === 'yes/no') return 'Y/N';
    if (b === 'yes' || b === 'y' || b === 'true' || b === '1') return 'Y';
    if (b === 'no' || b === 'n' || b === 'false' || b === '0') return 'N';
    return '';
  }

  // Recognizes a handful of common non-ISO date formats seen in real
  // exports/pastes (e.g. "4-Aug" from a text-formatted Excel cell, or
  // "08/14/26" from a plain paste) and normalizes them to ISO YYYY-MM-DD,
  // so isLate() and the Missing Due Date filter treat them as real dates
  // instead of lumping them in with genuine placeholders like "TBD".
  // Returns null if the text isn't a recognized date format at all.
  function parseFlexibleDate(raw) {
    const s = (raw || '').toString().trim();
    if (!s) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;

    const pad = n => String(n).padStart(2, '0');
    const normalizeYear = (yy) => {
      if (yy.length === 4) return parseInt(yy, 10);
      const n = parseInt(yy, 10);
      return n < 50 ? 2000 + n : 1900 + n;
    };

    // MM/DD/YY or MM/DD/YYYY
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
    if (m) {
      const [, mm, dd, yy] = m;
      return `${normalizeYear(yy)}-${pad(mm)}-${pad(dd)}`;
    }

    const months = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };

    // D-MMM-YY(YY) e.g. "4-Aug-26"
    m = s.match(/^(\d{1,2})-([A-Za-z]{3,})-(\d{2}|\d{4})$/);
    if (m && months[m[2].toLowerCase().slice(0,3)]) {
      const month = months[m[2].toLowerCase().slice(0,3)];
      return `${normalizeYear(m[3])}-${pad(month)}-${pad(m[1])}`;
    }

    // D-MMM with no year e.g. "4-Aug" — assume the current year, since
    // these are near-term project dates, not historical records.
    m = s.match(/^(\d{1,2})-([A-Za-z]{3,})$/);
    if (m && months[m[2].toLowerCase().slice(0,3)]) {
      const month = months[m[2].toLowerCase().slice(0,3)];
      return `${new Date().getFullYear()}-${pad(month)}-${pad(m[1])}`;
    }

    return null;
  }

  function excelCellToDateString(val) {
    if (val instanceof Date && !isNaN(val)) {
      const pad = n => String(n).padStart(2, '0');
      return `${val.getFullYear()}-${pad(val.getMonth() + 1)}-${pad(val.getDate())}`;
    }
    const raw = (val || '').toString().trim();
    const parsed = parseFlexibleDate(raw);
    return parsed || raw;
  }

  function transformRaidRow(row, index) {
    const raidNumber = (row.raidNumber || '').toString().trim();
    const noteParts = [];
    if (row.notes) noteParts.push(row.notes);
    if (row.latestComment) noteParts.push('Latest comment: ' + row.latestComment);
    return {
      id: 'raid-' + (raidNumber || ('noid-' + index)),
      raidNumber: raidNumber,
      area: (row.type || 'General').toString().trim(),
      title: (row.description || '').toString().trim() || 'Untitled item',
      detail: (row.description || '').toString().trim(),
      status: mapRaidStatus(row.status),
      owner: (row.owner || '').toString().trim(),
      devops: (row.devops || '').toString().trim(),
      priority: (row.priority || '').toString().trim(),
      blocker: mapRaidBlocker(row.blocker),
      targetDate: excelCellToDateString(row.targetDate),
      notes: noteParts.join('\n\n'),
      reportedDate: '',
    };
  }

  // Turns a 2D array of raw cell values (however we got it — SheetJS,
  function isRaidHeaderCell(cell) {
    const h = normalizeHeader(cell);
    return h.indexOf('raid') === 0; // "RAID #", "RAID#", "RAID No.", etc.
  }

  // or a hand-parsed paste) into the intermediate row-object shape
  // transformRaidRow() expects, skipping the header row and any blank
  // separator rows (e.g. the "- Risks" section dividers in the source).
  function rawRowsToRaidObjects(rows) {
    // Find the header row: the one whose first cell starts with "RAID".
    let headerIdx = rows.findIndex(r => isRaidHeaderCell(r[0]));
    if (headerIdx === -1) headerIdx = 0; // fall back to assuming row 1 is the header

    const cols = detectColumnMap(rows[headerIdx]);
    const get = (r, field) => (cols[field] !== undefined ? r[cols[field]] : '');

    const dataRows = rows.slice(headerIdx + 1);
    const objects = [];
    dataRows.forEach((r) => {
      const raidNumber = (get(r, 'raidNumber') || '').toString().trim();
      const description = (get(r, 'description') || '').toString().trim();
      // Section-divider rows (marking the start of "Risks"/"Actions"/etc.
      // groupings in the source sheet) always use a lone "-" in the RAID #
      // column. Checking for that directly is more reliable than checking
      // for a blank description — in some file layouts the divider's
      // section label (e.g. "Risks") lands in the description column
      // position, which would otherwise let it slip through as a real
      // item with a blank status (defaulting to "Open").
      if (raidNumber === '-') return;
      if (!description) return; // blank/separator row
      objects.push({
        raidNumber,
        devops: get(r, 'devops'),
        internalExternal: get(r, 'internalExternal'),
        type: get(r, 'type'),
        status: get(r, 'status'),
        blocker: get(r, 'blocker'),
        description,
        targetDate: get(r, 'targetDate'),
        owner: get(r, 'owner'),
        priority: get(r, 'priority'),
        notes: get(r, 'notes'),
        latestComment: get(r, 'latestComment'),
      });
    });
    return objects;
  }

  // Parses an uploaded .xlsx/.xls/.csv file (as an ArrayBuffer) via
  // SheetJS, picks the sheet that actually looks like the RAID log (the
  // one containing a "RAID #"-style header — the workbook also has a
  // summary sheet and a validation-list sheet we want to ignore), and
  // returns the intermediate row-object array.
  function parseSpreadsheetFile(arrayBuffer) {
    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
    for (const sheetName of workbook.SheetNames) {
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
      const headerIdx = rows.findIndex(r => isRaidHeaderCell(r[0]));
      if (headerIdx !== -1) {
        const columnMap = detectColumnMap(rows[headerIdx]);
        return { objects: rawRowsToRaidObjects(rows), sheetName, columnMap };
      }
    }
    return { objects: [], sheetName: null, columnMap: {} };
  }

  const RAID_FIELD_LABELS = {
    raidNumber: 'RAID #', devops: 'DevOps', internalExternal: 'Internal/External', type: 'Type',
    status: 'Status', blocker: 'Blocker', description: 'Description', targetDate: 'Target Date',
    owner: 'Owner', priority: 'Priority', notes: 'Notes', latestComment: 'Latest Comment',
  };

  function describeColumnMap(columnMap) {
    const found = Object.keys(RAID_FIELD_LABELS).filter(f => columnMap[f] !== undefined).map(f => RAID_FIELD_LABELS[f]);
    const missing = Object.keys(RAID_FIELD_LABELS).filter(f => columnMap[f] === undefined).map(f => RAID_FIELD_LABELS[f]);
    let text = 'Columns found: ' + (found.join(', ') || 'none');
    if (missing.length) text += '. Not found: ' + missing.join(', ') + '.';
    return text;
  }

  // Parses text pasted directly from Excel (selecting a range of cells
  // and copying puts tab-separated values on the clipboard).
  function parsePastedRows(text) {
    const lines = text.split(/\r?\n/).filter(l => l.length > 0);
    const rows = lines.map(l => l.split('\t'));
    return rawRowsToRaidObjects(rows);
  }

          <button class="btn-primary" id="raid-load">Upload</button>
        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);
    const close = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    backdrop.querySelector('#raid-cancel').addEventListener('click', close);

    const fileInput = backdrop.querySelector('#raid-modal-file');
    const textarea = backdrop.querySelector('#raid-modal-textarea');
    const dateInput = backdrop.querySelector('#raid-modal-date');
    const errorEl = backdrop.querySelector('#raid-modal-error');
    const fileStatusEl = backdrop.querySelector('#raid-modal-file-status');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      errorEl.style.display = 'none';
      fileStatusEl.textContent = 'Reading file…';
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const { objects, sheetName, columnMap } = parseSpreadsheetFile(reader.result);
          if (!objects.length) {
            pendingObjects = null;
            fileStatusEl.textContent = '';
            errorEl.textContent = 'Could not find a "RAID #" column in any sheet of this file. Make sure this is the RAID log spreadsheet.';
            errorEl.style.display = 'block';
            return;
          }
          pendingObjects = objects;
          fileStatusEl.innerHTML = `Found ${objects.length} row(s) in sheet "${sheetName}". Click Upload to continue.<br><span style="opacity:0.8;">${describeColumnMap(columnMap)}</span>`;
        } catch (e) {
          pendingObjects = null;
          fileStatusEl.textContent = '';
          errorEl.textContent = 'Could not read that file as a spreadsheet — try a .xlsx, .xls, or .csv export, or use the paste option below.';
          errorEl.style.display = 'block';
        }
      };
      reader.onerror = () => {
        pendingObjects = null;
        fileStatusEl.textContent = '';
        errorEl.textContent = 'Could not read that file — try pasting rows into the box below instead.';
        errorEl.style.display = 'block';
      };
      reader.readAsArrayBuffer(file);
    });

    backdrop.querySelector('#raid-load').addEventListener('click', () => {
      let objects = pendingObjects;
      if (!objects) {
        const pasted = textarea.value.trim();
        if (!pasted) {
          errorEl.textContent = 'Choose a file above, or paste copied rows into the box before uploading.';
          errorEl.style.display = 'block';
          return;
        }
        objects = parsePastedRows(pasted);
        if (!objects.length) {
          errorEl.textContent = 'Could not find any RAID log rows in the pasted text.';
          errorEl.style.display = 'block';
          return;
        }
      }
      const snapshotDate = dateInput.value || todayISO();
      const isHistorical = snapshotDate !== todayISO();
      const transformed = objects.map((row, i) => transformRaidRow(row, i));
      close();

      const confirmMessage = isHistorical
        ? `Record this as a historical RAID log snapshot dated ${formatDate(snapshotDate)}? This adds ${transformed.length} item(s) to History only — it will NOT change your current tracker data.`
        : `Upload ${transformed.length} item(s) from this RAID log? This will replace all ${issues.length} item(s) currently in the tracker.`;

      showConfirmModal(
        confirmMessage,
        async () => {
          const snapshotIso = new Date(snapshotDate + 'T12:00:00').toISOString();
          if (isHistorical) {
            // History-only: don't touch the live tracker data.
            await saveSnapshot(transformed, snapshotIso);
            if (currentView === 'history') loadAndRenderHistory();
          } else {
            issues = transformed;
            await saveIssues(snapshotDate);
            await saveSnapshot(issues, snapshotIso);
            populateFilters();
            render();
          }
        },
        'Upload'
      );
    });
  }

  async function saveSnapshot(issuesToSnapshot, uploadedAt) {
    try {
      await fetch('/api/snapshots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ issues: issuesToSnapshot, uploadedAt }),
      });
    } catch (e) {
      console.error('Snapshot save failed', e);
    }
  }

  function parseAndValidateImport(text) {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      return { error: 'That doesn\'t look like valid JSON — check for missing commas, brackets, or quotes.' };
    }
    const incoming = Array.isArray(parsed) ? parsed : parsed.issues;
    if (!Array.isArray(incoming)) {
      return { error: 'This JSON doesn\'t look like a tracker export (expected an array of issues, or an object with an "issues" array).' };
    }
    const looksValid = incoming.every(i => i && typeof i === 'object' && 'id' in i && 'title' in i);
    if (!looksValid) {
      return { error: 'This JSON doesn\'t look like a tracker export — some entries are missing expected fields (id, title).' };
    }
    return { issues: incoming };
  }

  function showConfirmModal(message, onConfirm, confirmLabel) {

  // ---------- Copy view ----------

  function statusText(status) {
    return STATUS_LABELS[status] || status;
  }

  function buildCopyText() {
    const list = getFiltered();
    const header = `TIFTON GO-LIVE TRACKER\nGenerated ${todayLabel()}\n${list.length} issue(s)\n`;

    if (!list.length) return header + '\nNo issues match the current filters.';

    if (currentView === 'table') {
      const rows = list.slice().sort((a,b) => {
        const statusDiff = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
        return statusDiff !== 0 ? statusDiff : a.title.localeCompare(b.title);
      }).map(i => {
        return [i.title, i.detail, i.devops || '\u2014', i.priority || '\u2014', i.blocker || '\u2014', i.reportedDate ? formatDate(i.reportedDate) : '\u2014', i.targetDate ? formatDate(i.targetDate) : '\u2014', i.notes || '\u2014', i.owner || '\u2014', statusText(i.status)].join('\t');
      });
      const cols = ['Title', 'Detail', 'DevOps #', 'Priority', 'Walmart Blocker', 'Reported', 'Target', 'Notes', 'Owner', 'Status'].join('\t');
      return header + '\n' + cols + '\n' + rows.join('\n');
    }

    // Board view groups by only the 5 Board statuses (matching what's on
    // screen); other views that fall through here (Closed, Calendar,
    // History) still group by the full status list so their own items
    // (e.g. Closed) aren't silently dropped.
    const groupOrder = currentView === 'board' ? BOARD_STATUS_ORDER : STATUS_ORDER;
    const blocks = groupOrder.map(st => {
      const items = list.filter(i => i.status === st);
      if (!items.length) return null;
      const lines = items.map(i => formatIssueLine(i));
      return `${statusText(st).toUpperCase()} (${items.length})\n${'-'.repeat(30)}\n${lines.join('\n\n')}`;
    }).filter(Boolean);
    return header + '\n' + blocks.join('\n\n\n');
  }

  function formatIssueLine(i) {
    const devopsPrefix = i.devops ? `DevOps #${i.devops} — ` : '';
    const owner = i.owner ? `  |  ${i.owner}` : '';
    const priority = i.priority ? `  |  ${i.priority} priority` : '';
    const blocker = isBlocker(i.blocker) ? `  |  WALMART BLOCKER${i.blocker === 'Y/N' ? ' (Y/N)' : ''}` : '';
    const reported = i.reportedDate ? `  |  Reported: ${formatDate(i.reportedDate)}` : '';
    const target = i.targetDate ? `  |  Target: ${formatDate(i.targetDate)}` : '';
    const notes = i.notes ? `\nNotes: ${i.notes}` : '';
    return `${devopsPrefix}${i.title}\n${i.detail}${owner}${priority}${blocker}${reported}${target}${notes}`;
  }

  // Colors mirrored from the app's CSS variables, hardcoded here since inline
  // styles are required for HTML pasted into external email clients.
  const EMAIL_COLORS = {
    ink: '#1b2027', inkSoft: '#565f6c', line: '#dcd8cc',
    steel: '#3d5a73', steelBg: '#e4ebef',
    amber: '#c4791f', amberBg: '#fbeee0',
    rust: '#a3402f', rustBg: '#f8e6e1',
    moss: '#4a6b4d', mossBg: '#e7efe4',
    slate: '#6b7280', slateBg: '#eceae2',
    teal: '#1f7a72', tealBg: '#daf0ee',
    plum: '#6b4fa0', plumBg: '#f2ecfb',
    forest: '#2f6b3a', forestBg: '#e2f0e4',
  };
  const STATUS_EMAIL_COLOR = { open: 'rust', inprogress: 'amber', testing: 'steel', readycustomer: 'moss', readyinstall: 'slate', monitoring: 'plum', onhold: 'forest', closed: 'teal' };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function escNl(s) {
    return esc(s).replace(/\n/g, '<br>');
  }

  function priorityEmailColor(p) {
    if (p === 'High') return 'rust';
    if (p === 'Medium') return 'amber';
    if (p === 'Low') return 'slate';
    return null;
  }

  function chip(text, colorKey) {
    const c = EMAIL_COLORS[colorKey], bg = EMAIL_COLORS[colorKey + 'Bg'];
    return `<span style="display:inline-block;font-size:11px;font-weight:600;color:${c};background:${bg};border-radius:4px;padding:2px 7px;margin:0 6px 4px 0;white-space:nowrap;">${esc(text)}</span>`;
  }

  function issueMetaHtml(i) {
    const chips = [];
    if (i.devops) chips.push(chip('DevOps #' + i.devops, 'steel'));
    if (i.priority) { const pc = priorityEmailColor(i.priority); if (pc) chips.push(chip(i.priority + ' priority', pc)); }
    if (isBlocker(i.blocker)) chips.push(chip('WALMART BLOCKER' + (i.blocker === 'Y/N' ? ' (Y/N)' : ''), 'rust'));
    if (i.reportedDate) chips.push(chip('Reported: ' + formatDate(i.reportedDate), 'slate'));
    if (i.targetDate) chips.push(chip('Target: ' + formatDate(i.targetDate), 'slate'));
    return chips.join('');
  }

      const th = (label) => `<th style="text-align:left;padding:6px 10px;border-bottom:2px solid ${EMAIL_COLORS.ink};font-size:11px;text-transform:uppercase;letter-spacing:0.03em;color:${EMAIL_COLORS.inkSoft};">${esc(label)}</th>`;
      const rowsHtml = sorted.map(i => {

          </table>

    }

    // Board view groups by only the 5 Board statuses (matching what's on
    // screen); other views that fall through here still group by the
