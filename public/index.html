<script>
(function() {
  const ROOT = document.getElementById('tifton-tracker');
  const CURRENT_DATA_VERSION = 8; // bump this whenever the seed data below should replace what's saved

  const SEED_ISSUES = [];

  const STATUS_LABELS = { open: 'Open', inprogress: 'In Progress (Dev)', testing: 'Testing', readycustomer: 'Ready for Customer', readyinstall: 'Ready for Install', monitoring: 'Monitoring', onhold: 'On Hold', closed: 'Closed' };
  // Full canonical list of every status the tool understands — used by
  // filters, the Table view, and the edit modal's status dropdown.
  const STATUS_ORDER = ['open', 'inprogress', 'testing', 'readycustomer', 'readyinstall', 'monitoring', 'onhold', 'closed'];
  // The Board view intentionally shows only these five, in this exact
  // order — Monitoring/On Hold/Closed items still exist and are fully
  // trackable elsewhere (Table view, Closed tab, filters), they're just
  // not given their own Board column.
  const BOARD_STATUS_ORDER = ['open', 'inprogress', 'testing', 'readycustomer', 'readyinstall'];

  let issues = [];
  let currentAsOfDate = null;
  let currentView = 'board';
  let calendarMonth = (() => {
    const d = new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  })();
  let selectedCalendarDate = null;
  let editingId = null;
  // Locally-selected FDD review files, one per issue — kept in memory only
  // (not sent to the server/D1), so previews last only for this browser
  // tab until cleared or the page is refreshed.
  // Per-issue FDD file cache. Metadata (filename/size/contentType/
  // uploadedAt) mirrors what's stored server-side in D1; blobUrl/loaded
  // are populated lazily in THIS browser tab only, either right after an
  // upload (built straight from the File object) or the first time a
  // stored file's "View" is clicked (fetched and decoded from the server).
  let fddDocs = {}; // issue id -> {filename, contentType, size, uploadedAt, blobUrl?, loaded, loading?, uploading?}
  let expandedFddId = null; // which row's preview is currently open, if any
  const MAX_FDD_FILE_BYTES = 8 * 1024 * 1024; // ~8 MB raw file (matches the server's base64 size ceiling with room to spare)
  let activeBoardEl = null;

  async function loadIssues() {
    try {
      const res = await fetch('/api/issues');
      if (!res.ok) throw new Error('Failed to load issues: ' + res.status);
      const payload = await res.json();
      const storedVersion = payload.dataVersion || 0;
      currentAsOfDate = payload.asOfDate || null;

      if (storedVersion < CURRENT_DATA_VERSION) {
        // Fresh dataset supersedes whatever was previously saved.
        issues = SEED_ISSUES.slice();
        await saveIssues();
        return;
      }

      issues = Array.isArray(payload.issues) ? payload.issues : [];
      migrateRemovedStatuses();
    } catch (e) {
      console.error('Load error', e);
      issues = SEED_ISSUES.slice();
      const noteEl = document.getElementById('save-note');
      if (noteEl) { noteEl.textContent = 'Could not reach the database — showing default data'; }
    }
  }

  // Fixes up any saved issues still carrying a status value that no longer exists
  // in the app (e.g. the retired "watching" status), without touching anything else.
  function migrateRemovedStatuses() {
    let changed = false;
    issues.forEach(i => {
      if (!STATUS_ORDER.includes(i.status)) {
        i.status = 'open';
        changed = true;
      }
    });
    if (changed) saveIssues();
  }

  // asOfDate is only passed when this save represents a live RAID Log
  // upload (see openUploadRaidModal) — omitting it on manual single-issue
  // edits means the "RAID LOG AS OF" date on the Board only moves when you
  // actually re-upload the source spreadsheet, not on every small tweak.
  async function saveIssues(asOfDate) {
    const noteEl = document.getElementById('save-note');
    try {
      const body = { issues, dataVersion: CURRENT_DATA_VERSION };
      if (asOfDate) body.asOfDate = asOfDate;
      const res = await fetch('/api/issues', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('Save failed: ' + res.status);
      if (asOfDate) currentAsOfDate = asOfDate;
      if (noteEl) { noteEl.textContent = 'Saved · shared with everyone using this tracker'; }
    } catch (e) {
      if (noteEl) { noteEl.textContent = 'Could not save — changes may not persist'; }
      console.error('Storage error', e);
    }
  }

  function populateFilters() {
    const statusSel = document.getElementById('filter-status');
    const curStatus = statusSel.value;
    statusSel.innerHTML = '<option value="">All statuses</option>' + STATUS_ORDER.map(s => `<option value="${s}">${STATUS_LABELS[s]}</option>`).join('');
    statusSel.value = curStatus;
  }

  // A target date that's a real ISO date (not text like "TBD" or "On Hold"),
  // in the past, and not yet closed — closed items don't count as "late"
  // even if their target date has passed, since the work is done.
  function isLate(issue) {
    if (!issue.targetDate || !/^\d{4}-\d{2}-\d{2}$/.test(issue.targetDate)) return false;
    if (issue.status === 'closed') return false;
    return issue.targetDate < todayISO();
  }

  let lateFilterActive = false;

  function getFiltered() {
    const status = document.getElementById('filter-status').value;
    const blockerFilter = document.getElementById('filter-blocker').value;
    const missingFilter = document.getElementById('filter-missing').value;
    const q = document.getElementById('search').value.trim().toLowerCase();
    return issues.filter(i => {
      if (status && i.status !== status) return false;
      if (blockerFilter === 'Y' && !isBlocker(i.blocker)) return false;
      if (blockerFilter === 'N' && isBlocker(i.blocker)) return false;
      const missingDevops = !i.devops;
      // "Missing" a due date means blank OR a non-date placeholder like
      // "TBD"/"On Hold"/"N/A" — anything that isn't a real, usable date.
      const missingTarget = !i.targetDate || !/^\d{4}-\d{2}-\d{2}$/.test(i.targetDate);
      if (missingFilter === 'devops' && !missingDevops) return false;
      if (missingFilter === 'target' && !missingTarget) return false;
      if (missingFilter === 'either' && !(missingDevops || missingTarget)) return false;
      if (lateFilterActive && !isLate(i)) return false;
      if (q) {
        const hay = (i.title + ' ' + i.detail + ' ' + (i.owner||'') + ' ' + (i.devops||'') + ' ' + (i.notes||'')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function renderStats() {
    const counts = {};
    STATUS_ORDER.forEach(s => { counts[s] = 0; });
    issues.forEach(i => { counts[i.status] = (counts[i.status]||0) + 1; });
    // Both the Late and Walmart Blocker header tiles intentionally only
    // count items in an active Board status (Open, In Progress, Testing,
    // Ready for Customer, Ready for Install) — a Closed/On Hold/Monitoring
    // item doesn't need to be flagged as late or as a blocker anymore.
    const blockerCount = issues.filter(i => isBlocker(i.blocker) && BOARD_STATUS_ORDER.includes(i.status)).length;
    const blockerActive = document.getElementById('filter-blocker').value === 'Y';
    const lateCount = issues.filter(i => isLate(i) && BOARD_STATUS_ORDER.includes(i.status)).length;
    const row = document.getElementById('stat-row');
    // Mirrors the Board view's 5 columns for a clean, consistent header —
    // Monitoring/On Hold/Closed items are still fully counted and
    // visible elsewhere (Table view, Closed tab), just not given their
    // own tile here.
    row.innerHTML = BOARD_STATUS_ORDER.map(s =>
      `<div class="stat ${s}"><div class="n">${counts[s]}</div><div class="l">${STATUS_LABELS[s]}</div></div>`
    ).join('')
      + `<div class="stat late-stat${lateFilterActive ? ' active' : ''}" id="late-stat" title="Click to show only late items (target date has passed)"><div class="n">${lateCount}</div><div class="l">Late</div></div>`
      + `<div class="stat blocker-stat${blockerActive ? ' active' : ''}" id="blocker-stat" title="Click to show only Walmart blockers"><div class="n">${blockerCount}</div><div class="l">Walmart Blockers</div></div>`;
    document.getElementById('late-stat').addEventListener('click', () => {
      lateFilterActive = !lateFilterActive;
      render();
    });
    document.getElementById('blocker-stat').addEventListener('click', () => {
      const sel = document.getElementById('filter-blocker');
      sel.value = sel.value === 'Y' ? '' : 'Y';
      render();
    });
  }

  function renderHeaderSummary() {
    const el = document.getElementById('header-summary');
    if (!el) return; // the header no longer shows this text, but keep the function harmless
    const n = issues.length;
    el.textContent = n === 0 ? 'No issues yet' : `${n} tracked issue${n === 1 ? '' : 's'}`;
  }

  function renderActiveFilters() {
    const container = document.getElementById('active-filters');
    const status = document.getElementById('filter-status').value;
    const blocker = document.getElementById('filter-blocker').value;
    const missing = document.getElementById('filter-missing').value;
    const search = document.getElementById('search').value;

    const chips = [];
    if (status) chips.push({ key: 'status', label: STATUS_LABELS[status] || status });
    if (blocker === 'Y') chips.push({ key: 'blocker', label: 'Walmart blocker only' });
    if (blocker === 'N') chips.push({ key: 'blocker', label: 'Not a blocker' });
    if (missing === 'devops') chips.push({ key: 'missing', label: 'Missing DevOps #' });
    if (missing === 'target') chips.push({ key: 'missing', label: 'Missing Due Date' });
    if (missing === 'either') chips.push({ key: 'missing', label: 'Missing DevOps # or Due Date' });
    if (lateFilterActive) chips.push({ key: 'late', label: 'Late', late: true });
    if (search.trim()) chips.push({ key: 'search', label: `Search: "${search.trim()}"` });

    container.innerHTML = chips.map(c =>
      `<span class="filter-chip${c.late ? ' late-chip' : ''}">${c.label}<button type="button" class="filter-chip-x" data-key="${c.key}" title="Remove this filter">&times;</button></span>`
    ).join('');

    container.querySelectorAll('.filter-chip-x').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        if (key === 'status') document.getElementById('filter-status').value = '';
        else if (key === 'blocker') document.getElementById('filter-blocker').value = '';
        else if (key === 'missing') document.getElementById('filter-missing').value = '';
        else if (key === 'late') lateFilterActive = false;
        else if (key === 'search') document.getElementById('search').value = '';
        render();
      });
    });
  }

  function formatDate(iso) {
    if (!iso) return '';
    // Target dates pulled from the RAID log are sometimes text placeholders
    // ("TBD", "On HOLD", "N/A", "FDD to be created") rather than real
    // dates — only attempt to reformat things that actually look like an
    // ISO date (YYYY-MM-DD); anything else is shown exactly as entered
    // rather than becoming "Invalid Date".
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    if (isNaN(dt)) return iso;
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function isBlocker(blocker) {
    return blocker === 'Y' || blocker === 'Y/N';
  }

  function cardHtml(issue) {
    const priorityClass = ['high','medium','low'].includes((issue.priority || '').toLowerCase()) ? issue.priority.toLowerCase() : '';
    const priorityLabel = priorityClass ? `${issue.priority} priority` : `Priority: ${issue.priority}`;
    const late = isLate(issue);
    return `
      <div class="card ${issue.status}${late ? ' is-late' : ''}" data-id="${issue.id}">
        <div class="card-top">
          <div class="card-tag-slot card-tag-left">${late ? `<span class="late-tag">LATE</span>` : ''}</div>
          <div class="card-tag-slot card-tag-right">${isBlocker(issue.blocker) ? `<span class="blocker-tag">Walmart blocker${issue.blocker === 'Y/N' ? ' (Y/N)' : ''}</span>` : ''}</div>
        </div>
        <div class="card-title">${issue.title}</div>
        <div class="meta-row">
          ${issue.priority ? `<span class="priority-tag ${priorityClass}">${priorityLabel}</span>` : ''}
          ${issue.targetDate ? `<span class="target-tag${late ? ' target-tag-late' : ''}">Target: ${formatDate(issue.targetDate)}</span>` : ''}
        </div>
        <div class="card-detail">${issue.detail}</div>
        <div class="card-footer">
          <div>
            ${issue.reportedDate ? `<div class="card-reported">Reported ${formatDate(issue.reportedDate)}</div>` : ''}
          </div>
          ${issue.devops ? `<span class="devops-tag">DevOps #${issue.devops}</span>` : ''}
        </div>
      </div>
    `;
  }

  function renderBoard(list) {
    const asOfHtml = currentAsOfDate
      ? `<div class="as-of-banner">RAID LOG AS OF ${formatDate(currentAsOfDate).toUpperCase()}</div>`
      : `<div class="as-of-banner as-of-banner-empty">No RAID log uploaded yet — use "Upload RAID Log" to get started</div>`;
    const cols = BOARD_STATUS_ORDER.map(st => {
      const items = list.filter(i => i.status === st);
      return `
        <div class="board-col">
          <div class="col-head">${STATUS_LABELS[st]} <span class="count">${items.length}</span></div>
          ${items.map(cardHtml).join('') || '<div class="empty">No issues</div>'}
        </div>
      `;
    }).join('');
    return `${asOfHtml}<div class="board">${cols}</div>`;
  }

  function renderTable(list) {
    const sorted = list.slice().sort((a,b) => {
      const statusDiff = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
      return statusDiff !== 0 ? statusDiff : a.title.localeCompare(b.title);
    });
    if (!sorted.length) {
      return `
        <div class="closed-wrap">
          <div class="closed-header">RAID Log Tabular View</div>
          <div class="empty">No issues match these filters</div>
        </div>
      `;
    }
    return `
      <div class="closed-wrap">
        <div class="closed-header">RAID Log Tabular View <span class="count">(${sorted.length})</span></div>
        <table>
          <thead><tr><th>Issue</th><th>DevOps #</th><th>Priority</th><th>Walmart Blocker</th><th>Reported</th><th>Target</th><th>Owner</th><th>Status</th></tr></thead>
          <tbody>
            ${sorted.map(i => `
              <tr data-id="${i.id}">
                <td>
                  <strong>${i.title}</strong><br><span style="color:var(--ink-soft);font-size:12px;">${i.detail}</span>
                  ${i.notes ? `<br><span style="color:var(--steel-dark);font-size:11.5px;font-style:italic;"><strong>Notes:</strong> ${i.notes}</span>` : ''}
                </td>
                <td>${i.devops || '—'}</td>
                <td>${i.priority || '—'}</td>
                <td>${isBlocker(i.blocker) ? `<span class="blocker-tag">${i.blocker}</span>` : (i.blocker || '—')}</td>
                <td>${i.reportedDate ? formatDate(i.reportedDate) : '—'}</td>
                <td>${i.targetDate ? formatDate(i.targetDate) : '—'}</td>
                <td>${i.owner || '—'}</td>
                <td>
                  <span class="status-pill ${i.status}">${STATUS_LABELS[i.status]}</span>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function issuesByDueDate(list) {
    const map = {};
    list.forEach(i => {
      if (i.targetDate) (map[i.targetDate] = map[i.targetDate] || []).push(i);
    });
    return map;
  }

  function renderCalendar(list) {
    const dueMap = issuesByDueDate(list);
    const { year, month } = calendarMonth;
    const firstOfMonth = new Date(year, month, 1);
    const startWeekday = firstOfMonth.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const monthLabel = firstOfMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const today = todayISO();
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    let cells = '';
    for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dueIssues = dueMap[iso] || [];
      const classes = ['cal-cell'];
      if (dueIssues.length) classes.push('has-due');
      if (iso === today) classes.push('is-today');
      if (iso === selectedCalendarDate) classes.push('is-selected');
      cells += `
        <div class="${classes.join(' ')}" data-cal-date="${iso}">
          <div class="cal-daynum">${d}</div>
          ${dueIssues.length ? `<div class="cal-count">${dueIssues.length}</div>` : ''}
        </div>`;
    }
    const totalCells = startWeekday + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 0; i < trailing; i++) cells += `<div class="cal-cell empty"></div>`;

    const monthTotal = Object.keys(dueMap).filter(iso => iso.startsWith(`${year}-${String(month + 1).padStart(2,'0')}`)).reduce((sum, iso) => sum + dueMap[iso].length, 0);

    const detailIssues = selectedCalendarDate ? (dueMap[selectedCalendarDate] || []) : [];
    const detailHtml = selectedCalendarDate ? `
      <div class="cal-detail">
        <div class="cal-detail-header">Due ${formatDate(selectedCalendarDate)} <span class="count">(${detailIssues.length})</span></div>
        <div class="cal-detail-list">
          ${detailIssues.length ? detailIssues.map(cardHtml).join('') : '<div class="empty">No issues due this day.</div>'}
        </div>
      </div>` : `
      <div class="cal-detail">
        <div class="empty">Click a highlighted date to see what's due that day.</div>
      </div>`;

    return `
      <div class="calendar">
        <div class="cal-header">
          <button type="button" class="cal-nav" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
          <div class="cal-month-label">${monthLabel}<span class="cal-month-count">${monthTotal} due this month</span></div>
          <button type="button" class="cal-nav" id="cal-next" aria-label="Next month">&rsaquo;</button>
        </div>
        <div class="cal-grid cal-grid-head">${dayNames.map(n => `<div class="cal-dayname">${n}</div>`).join('')}</div>
        <div class="cal-grid">${cells}</div>
      </div>
      ${detailHtml}
    `;
  }

  function renderClosedList(list) {
    const closed = list.filter(i => i.status === 'closed').sort((a,b) => a.title.localeCompare(b.title));
    if (!closed.length) return '<div class="empty">No closed issues match these filters.</div>';
    return `
      <div class="closed-wrap">
        <div class="closed-header">Closed <span class="count">(${closed.length})</span></div>
        <table>
          <thead><tr><th>Issue</th><th>DevOps #</th><th>Priority</th><th>Walmart Blocker</th><th>Reported</th><th>Target</th><th>Owner</th><th>Status</th></tr></thead>
          <tbody>
            ${closed.map(i => `
              <tr data-id="${i.id}">
                <td>
                  <strong>${i.title}</strong><br><span style="color:var(--ink-soft);font-size:12px;">${i.detail}</span>
                  ${i.notes ? `<br><span style="color:var(--steel-dark);font-size:11.5px;font-style:italic;"><strong>Notes:</strong> ${i.notes}</span>` : ''}
                </td>
                <td>${i.devops || '—'}</td>
                <td>${i.priority || '—'}</td>
                <td>${isBlocker(i.blocker) ? `<span class="blocker-tag">${i.blocker}</span>` : (i.blocker || '—')}</td>
                <td>${i.reportedDate ? formatDate(i.reportedDate) : '—'}</td>
                <td>${i.targetDate ? formatDate(i.targetDate) : '—'}</td>
                <td>${i.owner || '—'}</td>
                <td><span class="status-pill ${i.status}">${STATUS_LABELS[i.status]}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  // ---------- FDD (Functional Design Document) tracker ----------
  //
  // An item is "FDD-related" if the word "FDD" shows up anywhere relevant
  // to it — the title, the target date field (which sometimes holds a
  // placeholder like "FDD to be created" instead of a real date), or the
  // detail/notes text. That single check also naturally covers an FDD ID
  // like "FDD 17676" appearing anywhere in that text.
  function fddSearchText(issue) {
    return [issue.title, issue.detail, issue.notes, issue.targetDate].filter(Boolean).join(' ');
  }

  function isFddItem(issue) {
    return /FDD/i.test(fddSearchText(issue));
  }

  // Pulls the first FDD number found (e.g. "FDD 17676", "FDD#17676",
  // "FDD-17676") out of the item's text. Returns null if none is found,
  // so the caller can show "FDD# REQUIRED" instead.
  function extractFddNumber(issue) {
    const m = fddSearchText(issue).match(/FDD\s*#?\s*-?\s*(\d{3,6})/i);
    return m ? m[1] : null;
  }

  function formatFileSize(bytes) {
    if (bytes == null) return '';
    return bytes > 1024 * 1024 ? (bytes / (1024 * 1024)).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB';
  }

  // Reads a File as base64 (stripping the "data:<mime>;base64," prefix
  // that FileReader's readAsDataURL includes) so it can be sent as plain
  // JSON text to /api/fdd/<issueId>.
  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result || '';
        const idx = result.indexOf(',');
        resolve(idx !== -1 ? result.slice(idx + 1) : result);
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  // Reverses that — turns base64 text fetched back from the server into a
  // blob URL the <iframe>/download link can actually use.
  function base64ToBlobUrl(base64, contentType) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const blob = new Blob([new Uint8Array(byteNumbers)], { type: contentType || 'application/octet-stream' });
    return URL.createObjectURL(blob);
  }

  function renderFddItemsList(fddItems) {
    if (!fddItems.length) {
      return '<div class="empty">No FDD-related items match the current filters. An item is picked up here when "FDD" appears in its title, target date, or notes/description — including an FDD ID like "FDD 17676".</div>';
    }
    const sorted = fddItems.slice().sort((a, b) => {
      const statusDiff = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
      return statusDiff !== 0 ? statusDiff : a.title.localeCompare(b.title);
    });
    return `
      <table class="fdd-table">
        <thead><tr><th>Issue</th><th>FDD #</th><th>Status</th><th>Target</th><th>FDD Document</th></tr></thead>
        <tbody>
          ${sorted.map(i => {
            const fddNum = extractFddNumber(i);
            const doc = fddDocs[i.id];
            const isExpanded = expandedFddId === i.id && doc && doc.blobUrl;
            return `
              <tr data-id="${i.id}">
                <td>
                  <strong>${i.title}</strong><br><span style="color:var(--ink-soft);font-size:12px;">${i.detail}</span>
                </td>
                <td>${fddNum ? `FDD ${fddNum}` : '<span class="status-pill unmatched">FDD# REQUIRED</span>'}</td>
                <td><span class="status-pill ${i.status}">${STATUS_LABELS[i.status]}</span></td>
                <td>${i.targetDate ? formatDate(i.targetDate) : '—'}</td>
                <td>${renderFddRowUploadCell(i)}</td>
              </tr>
              ${isExpanded ? `<tr class="fdd-detail-row"><td colspan="5">${renderFddPreview(doc)}</td></tr>` : ''}
            `;
          }).join('')}
        </tbody>
      </table>
    `;
  }

  // Per-item upload control — each FDD-related line item gets its own file
  // slot, since a given RAID/FDD item is reviewed against its own specific
  // document, not a single document for the whole tracker.
  function renderFddRowUploadCell(issue) {
    const doc = fddDocs[issue.id];
    if (!doc) {
      return `
        <div class="fdd-row-controls">
          <input type="file" class="fdd-row-upload-input" data-fdd-issue-id="${issue.id}" accept=".pdf,.doc,.docx">
        </div>
      `;
    }
    if (doc.uploading) {
      return `<div class="fdd-row-controls"><span class="fdd-row-file-size">Uploading&hellip;</span></div>`;
    }
    const viewing = expandedFddId === issue.id;
    const viewLabel = doc.loading ? 'Loading&hellip;' : (viewing ? 'Hide' : 'View');
    return `
      <div class="fdd-row-controls fdd-row-file">
        <span class="fdd-row-file-name" title="${doc.filename}">${doc.filename}</span>
        <span class="fdd-row-file-size">(${formatFileSize(doc.size)})</span>
        <button type="button" class="btn-secondary fdd-row-view-btn" data-fdd-view-id="${issue.id}"${doc.loading ? ' disabled' : ''}>${viewLabel}</button>
        <button type="button" class="history-delete-btn fdd-row-remove-btn" data-fdd-remove-id="${issue.id}" title="Remove this file">&times;</button>
      </div>
    `;
  }

  function renderFddPreview(doc) {
    const canPreviewInline = doc.contentType === 'application/pdf';
    return canPreviewInline
      ? `<iframe src="${doc.blobUrl}" class="fdd-preview-frame" title="FDD preview"></iframe>`
      : `<div class="empty">Preview isn't available for this file type in-browser. <a href="${doc.blobUrl}" download="${doc.filename}">Download ${doc.filename}</a> to view it.</div>`;
  }

  // Redraws just the FDD tab's body content and (re)wires its controls —
  // called both after the initial server load and after any local action
  // (upload/view/remove), without needing to hit the network again except
  // where the action itself requires it (see the handlers below).
  function renderFddBody(list) {
    const body = document.getElementById('body');
    const fddItems = list.filter(i => isFddItem(i) && i.status !== 'closed');
    body.innerHTML = `
      <div class="history-wrap">
        <div class="history-header">FDD Tracker <span class="count">(${fddItems.length} item${fddItems.length === 1 ? '' : 's'})</span></div>
        <p class="history-hint">Items are matched automatically when "FDD" appears in the title, target date, or notes/description — including an FDD ID like "FDD 17676" (Closed items are left off this list). Upload each item's FDD document in its own row — files are saved to the shared tracker (up to ~8 MB each) so everyone sees the same document.</p>
        ${renderFddItemsList(fddItems)}
      </div>
    `;

    body.querySelectorAll('[data-id]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.fdd-row-controls')) return;
        openModal(el.getAttribute('data-id'));
      });
    });

    body.querySelectorAll('.fdd-row-upload-input').forEach(input => {
      input.addEventListener('click', (e) => e.stopPropagation());
      input.addEventListener('change', async () => {
        const file = input.files[0];
        if (!file) return;
        const issueId = input.getAttribute('data-fdd-issue-id');
        if (file.size > MAX_FDD_FILE_BYTES) {
          showAlertModal(`That file is too large to store (limit is roughly ${Math.round(MAX_FDD_FILE_BYTES / (1024 * 1024))} MB). Try a smaller file.`);
          input.value = '';
          return;
        }
        fddDocs[issueId] = { uploading: true };
        renderFddBody(getFiltered());
        try {
          const base64 = await readFileAsBase64(file);
          const res = await fetch('/api/fdd/' + encodeURIComponent(issueId), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: file.name, contentType: file.type, size: file.size, data: base64 }),
          });
          if (!res.ok) throw new Error('Upload failed: ' + res.status);
          const payload = await res.json();
          fddDocs[issueId] = {
            filename: file.name,
            contentType: file.type,
            size: file.size,
            uploadedAt: payload.uploadedAt || new Date().toISOString(),
            blobUrl: URL.createObjectURL(file),
            loaded: true,
          };
          expandedFddId = issueId;
        } catch (e) {
          console.error('FDD upload failed', e);
          delete fddDocs[issueId];
          showAlertModal('Could not upload that file — please try again.');
        }
        renderFddBody(getFiltered());
      });
    });

    body.querySelectorAll('.fdd-row-view-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const issueId = btn.getAttribute('data-fdd-view-id');
        if (expandedFddId === issueId) {
          expandedFddId = null;
          renderFddBody(getFiltered());
          return;
        }
        const doc = fddDocs[issueId];
        if (doc && !doc.loaded && !doc.loading) {
          doc.loading = true;
          renderFddBody(getFiltered());
          try {
            const res = await fetch('/api/fdd/' + encodeURIComponent(issueId));
            if (!res.ok) throw new Error('Failed to load: ' + res.status);
            const payload = await res.json();
            doc.blobUrl = base64ToBlobUrl(payload.data, payload.contentType);
            doc.loaded = true;
          } catch (err) {
            console.error('FDD load failed', err);
            doc.loading = false;
            renderFddBody(getFiltered());
            showAlertModal('Could not load that FDD file — please try again.');
            return;
          }
          doc.loading = false;
        }
        expandedFddId = issueId;
        renderFddBody(getFiltered());
      });
    });

    body.querySelectorAll('.fdd-row-remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const issueId = btn.getAttribute('data-fdd-remove-id');
        showConfirmModal(
          'Remove this FDD file? This deletes it from the shared tracker for everyone.',
          async () => {
            try {
              await fetch('/api/fdd/' + encodeURIComponent(issueId), { method: 'DELETE' });
            } catch (err) {
              console.error('FDD delete failed', err);
            }
            const existing = fddDocs[issueId];
            if (existing && existing.blobUrl) URL.revokeObjectURL(existing.blobUrl);
            delete fddDocs[issueId];
            if (expandedFddId === issueId) expandedFddId = null;
            renderFddBody(getFiltered());
          },
          'Remove'
        );
      });
    });
  }

  // Entry point for the FDD tab — fetches the current file metadata from
  // the server (so a page refresh, or another person's upload, shows up
  // correctly) and merges it into the local cache without clobbering a
  // blobUrl already fetched/created earlier in this same session.
  async function loadAndRenderFddView(list) {
    let files;
    try {
      const res = await fetch('/api/fdd');
      if (!res.ok) throw new Error('Failed to load: ' + res.status);
      const payload = await res.json();
      files = payload.files || [];
    } catch (e) {
      if (currentView === 'fdd') {
        document.getElementById('body').innerHTML = '<div class="empty">Could not load FDD documents.</div>';
      }
      return;
    }
    if (currentView !== 'fdd') return;

    const serverIds = new Set(files.map(f => f.issueId));
    files.forEach(f => {
      const existing = fddDocs[f.issueId];
      fddDocs[f.issueId] = {
        filename: f.filename,
        contentType: f.contentType,
        size: f.size,
        uploadedAt: f.uploadedAt,
        loaded: existing ? existing.loaded : false,
        blobUrl: existing ? existing.blobUrl : undefined,
      };
    });
    // Drop cached entries for files removed server-side (e.g. by someone
    // else, or in another tab).
    Object.keys(fddDocs).forEach(id => {
      if (!serverIds.has(id)) {
        if (fddDocs[id] && fddDocs[id].blobUrl) URL.revokeObjectURL(fddDocs[id].blobUrl);
        delete fddDocs[id];
      }
    });

    renderFddBody(list);
  }

  // ---------- History (upload snapshots) ----------

  // An issue's id is 'devops-<number>' when it has a DevOps #, or
  // 'nodevops-...' when it doesn't (see transformRaidRow). Only
  // 'devops-' ids are meaningful to match across uploads — RAID # is just
  // a spreadsheet row position and was dropped as the join key because it
  // isn't stable across uploads (rows get added/removed/resorted), and a
  // 'nodevops-' id is deliberately unique per upload (never matches
  // anything, past or future), so those items must never be silently
  // counted as "new" or "removed" — they're surfaced separately instead.
  function isTrackableId(id) {
    return typeof id === 'string' && id.indexOf('devops-') === 0;
  }

  function diffSnapshotItems(older, newer) {
    const olderTrackable = older.filter(i => isTrackableId(i.id));
    const newerTrackable = newer.filter(i => isTrackableId(i.id));
    const olderMap = new Map(olderTrackable.map(i => [i.id, i]));
    const newerMap = new Map(newerTrackable.map(i => [i.id, i]));
    const added = [];
    const removed = [];
    const statusChanged = [];
    const dateChanged = [];
    newerMap.forEach((item, id) => {
      if (!olderMap.has(id)) {
        added.push(item);
        return;
      }
      const older = olderMap.get(id);
      if (older.status !== item.status) {
        statusChanged.push({ item, from: older.status, to: item.status });
      }
      // Target date is tracked independently of status — an item can sit
      // in the same status across uploads while its due date quietly
      // moves, and that's exactly the case this is meant to catch.
      if ((older.targetDate || '') !== (item.targetDate || '')) {
        dateChanged.push({ item, from: older.targetDate, to: item.targetDate });
      }
    });
    olderMap.forEach((item, id) => {
      if (!newerMap.has(id)) removed.push(item);
    });
    // Items with no DevOps # in the NEWER upload can't be matched against
    // anything (they've got a one-time-use id), so they're neither "added"
    // nor "removed" — just flagged so they don't get miscounted either way.
    // Only flagged when the item is in one of the active Board statuses
    // (Open, In Progress, Testing, Ready for Customer, Ready for Install) —
    // Monitoring/On Hold/Closed items aren't worth calling out here.
    const unmatched = newer.filter(i => !isTrackableId(i.id) && BOARD_STATUS_ORDER.includes(i.status));
    return { added, removed, statusChanged, dateChanged, unmatched };
  }

  // A due-date change only counts as a "slip" or "pull-in" when both the
  // old and new values are real ISO dates — comparing "TBD" to "TBD" or
  // to a real date isn't a meaningful direction, just a text change.
  function dateChangeDirection(fromDate, toDate) {
    const fromValid = /^\d{4}-\d{2}-\d{2}$/.test(fromDate || '');
    const toValid = /^\d{4}-\d{2}-\d{2}$/.test(toDate || '');
    if (!fromValid || !toValid) return null;
    if (toDate > fromDate) return 'slip';
    if (toDate < fromDate) return 'pullin';
    return null;
  }

  function dateChangeLabel(iso) {
    if (!iso) return 'No due date';
    return formatDate(iso);
  }

  async function loadAndRenderHistory() {
    const body = document.getElementById('body');
    let snapshots;
    try {
      const res = await fetch('/api/snapshots');
      if (!res.ok) throw new Error('Failed to load history: ' + res.status);
      const payload = await res.json();
      snapshots = payload.snapshots || [];
    } catch (e) {
      if (currentView === 'history') {
        body.innerHTML = '<div class="empty">Could not load upload history.</div>';
      }
      return;
    }

    if (currentView !== 'history') return; // view changed while loading

    if (!snapshots.length) {
      body.innerHTML = `
        <div class="history-wrap">
          <div class="history-header">Upload History</div>
          <div class="empty">No RAID log uploads recorded yet. Use "Upload RAID Log" to start building history.</div>
        </div>
      `;
      return;
    }

    body.innerHTML = `
      <div class="history-wrap">
        <div class="history-header">Upload History <span class="count">(${snapshots.length} upload${snapshots.length === 1 ? '' : 's'})</span></div>
        <div class="empty">Loading item-level comparisons&hellip;</div>
      </div>
    `;

    // Fetch full item-level detail for every upload so we can compute a
    // New Items count and a full diff for every consecutive pair, not
    // just the two most recent — a click on any row (other than the very
    // first/oldest) expands to show exactly what changed since the
    // upload right before it.
    let details;
    try {
      details = await Promise.all(snapshots.map(s => fetch('/api/snapshots/' + s.id).then(r => r.json())));
    } catch (e) {
      details = null;
    }
    if (currentView !== 'history') return;

    const detailById = {};
    if (details) details.forEach(d => { if (d && d.id) detailById[d.id] = d; });

    // snapshots is newest-first; pair each row with the one right after it
    // in the array (i.e. chronologically just before it) to diff against.
    const diffs = {}; // snapshot id -> diff vs the previous upload
    for (let i = 0; i < snapshots.length - 1; i++) {
      const newer = detailById[snapshots[i].id];
      const older = detailById[snapshots[i + 1].id];
      if (newer && older) diffs[snapshots[i].id] = diffSnapshotItems(older.issues, newer.issues);
    }

    // Every snapshot (including the oldest, which has no "previous" to
    // diff against) still gets its own no-DevOps# count, since that's a
    // property of the upload itself, not of a comparison between two.
    const noDevopsCounts = {};
    snapshots.forEach(s => {
      const d = detailById[s.id];
      // Only Monitoring/On Hold/Closed items are excluded — nothing left worth tracking there.
      noDevopsCounts[s.id] = d ? d.issues.filter(i => !isTrackableId(i.id) && BOARD_STATUS_ORDER.includes(i.status)).length : 0;
    });

    const tableRows = snapshots.map((s, i) => {
      const c = s.statusCounts;
      const diff = diffs[s.id];
      const isOldest = i === snapshots.length - 1;
      const newItemsCell = isOldest ? '&mdash;' : (diff ? diff.added.length : '&hellip;');
      const clickable = !isOldest;
      const noDevopsCell = noDevopsCounts[s.id] || 0;
      return `
        <tr class="history-row${clickable ? ' clickable' : ''}" data-snapshot-id="${s.id}">
          <td>${clickable ? '<span class="history-expand-caret">&#9656;</span>' : ''}${formatDateTime(s.uploadedAt)}</td>
          <td>${s.itemCount}</td>
          <td>${newItemsCell}</td>
          <td>${noDevopsCell ? `<span class="status-pill unmatched" title="Items in this upload with no DevOps # — can't be tracked across uploads">${noDevopsCell}</span>` : '&mdash;'}</td>
          <td>${c.open || 0}</td>
          <td>${c.inprogress || 0}</td>
          <td>${c.testing || 0}</td>
          <td>${c.monitoring || 0}</td>
          <td>${c.onhold || 0}</td>
          <td>${c.closed || 0}</td>
          <td><button type="button" class="history-delete-btn" data-snapshot-id="${s.id}" title="Delete this upload record">&times;</button></td>
        </tr>
        <tr class="history-detail-row" data-detail-for="${s.id}" style="display:none;"><td colspan="11"></td></tr>
      `;
    }).join('');

    body.innerHTML = `
      <div class="history-wrap">
        <div class="history-header">Upload History <span class="count">(${snapshots.length} upload${snapshots.length === 1 ? '' : 's'})</span></div>
        <p class="history-hint">Click any upload to see exactly what changed since the one before it. "No DevOps #" items can't be matched across uploads, so they're never counted as new or removed.</p>
        <table class="history-table">
          <thead><tr><th>Uploaded</th><th>Items</th><th>New Items</th><th>No DevOps #</th><th>Open</th><th>In Progress</th><th>Testing</th><th>Monitoring</th><th>On Hold</th><th>Closed</th><th></th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    `;

    body.querySelectorAll('.history-row.clickable').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('.history-delete-btn')) return;
        const id = row.getAttribute('data-snapshot-id');
        const detailRow = body.querySelector(`.history-detail-row[data-detail-for="${id}"]`);
        if (!detailRow) return;
        const isOpen = detailRow.style.display !== 'none';
        if (isOpen) {
          detailRow.style.display = 'none';
          row.classList.remove('expanded');
          return;
        }
        // Collapse any other open row first, so only one is expanded at a time.
        body.querySelectorAll('.history-detail-row').forEach(dr => { dr.style.display = 'none'; });
        body.querySelectorAll('.history-row.expanded').forEach(r => r.classList.remove('expanded'));

        const idx = snapshots.findIndex(s => String(s.id) === String(id));
        const diff = diffs[id];
        const cell = detailRow.querySelector('td');
        if (diff && idx !== -1 && idx < snapshots.length - 1) {
          cell.innerHTML = renderHistoryDiff(diff, snapshots[idx + 1].uploadedAt, snapshots[idx].uploadedAt);
        } else {
          cell.innerHTML = '<div class="history-diff-section"><div class="history-diff-summary">Comparison unavailable.</div></div>';
        }
        detailRow.style.display = '';
        row.classList.add('expanded');
      });
    });

    body.querySelectorAll('.history-delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-snapshot-id');
        showConfirmModal(
          'Delete this upload record from History? This only removes it from the History log — it does not change your current tracker data.',
          async () => {
            try {
              await fetch('/api/snapshots/' + id, { method: 'DELETE' });
            } catch (e) {
              console.error('Delete snapshot failed', e);
            }
            if (currentView === 'history') loadAndRenderHistory();
          },
          'Delete'
        );
      });
    });
  }

  function renderHistoryDiff(diff, fromDate, toDate) {
    const { added, removed, statusChanged, dateChanged, unmatched } = diff;
    const dc = dateChanged || [];
    if (!added.length && !removed.length && !statusChanged.length && !dc.length && !(unmatched && unmatched.length)) {
      return `<div class="history-diff-section"><div class="history-diff-title">Since ${formatDateTime(fromDate)}</div><div class="history-diff-summary">No changes between these two uploads.</div></div>`;
    }
    const changeRows = statusChanged.map(c => `
      <div class="history-diff-item">
        <span class="status-pill ${c.from}">${STATUS_LABELS[c.from] || c.from}</span>
        <span class="history-diff-arrow">&rarr;</span>
        <span class="status-pill ${c.to}">${STATUS_LABELS[c.to] || c.to}</span>
        <span class="history-diff-item-title">${c.item.title}</span>
      </div>
    `).join('');
    const dateRows = dc.map(c => {
      const direction = dateChangeDirection(c.from, c.to);
      const toClass = direction === 'slip' ? 'target-tag target-tag-late' : 'target-tag';
      const directionLabel = direction === 'slip' ? ' <span style="color:var(--rust);font-weight:600;">(pushed out)</span>' : direction === 'pullin' ? ' <span style="color:var(--moss);font-weight:600;">(pulled in)</span>' : '';
      return `
      <div class="history-diff-item">
        <span class="target-tag">${dateChangeLabel(c.from)}</span>
        <span class="history-diff-arrow">&rarr;</span>
        <span class="${toClass}">${dateChangeLabel(c.to)}</span>
        <span class="history-diff-item-title">${c.item.title}${directionLabel}</span>
      </div>
    `;
    }).join('');
    const addedRows = added.map(i => `<div class="history-diff-item"><span class="status-pill ${i.status}">New</span><span class="history-diff-item-title">${i.title}</span></div>`).join('');
    const removedRows = removed.map(i => `<div class="history-diff-item"><span class="status-pill closed">Removed</span><span class="history-diff-item-title">${i.title}</span></div>`).join('');
    const unmatchedRows = (unmatched || []).map(i => `<div class="history-diff-item"><span class="status-pill unmatched">No DevOps #</span><span class="history-diff-item-title">${i.title}</span></div>`).join('');
    return `
      <div class="history-diff-section">
        <div class="history-diff-title">Since ${formatDateTime(fromDate)}</div>
        <div class="history-diff-summary">${added.length} new &middot; ${removed.length} removed &middot; ${statusChanged.length} changed status${dc.length ? ` &middot; ${dc.length} due date change${dc.length === 1 ? '' : 's'}` : ''}${unmatched && unmatched.length ? ` &middot; ${unmatched.length} unmatched (no DevOps #)` : ''}</div>
        ${statusChanged.length ? `<div class="history-diff-list">${changeRows}</div>` : ''}
        ${dc.length ? `<div class="history-diff-list">${dateRows}</div>` : ''}
        ${added.length ? `<div class="history-diff-list">${addedRows}</div>` : ''}
        ${removed.length ? `<div class="history-diff-list">${removedRows}</div>` : ''}
        ${unmatched && unmatched.length ? `<div class="history-diff-list">${unmatchedRows}</div>` : ''}
      </div>
    `;
  }

  function formatDateTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function shortDateLabel(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  // ---------- Analysis (trend charts, closure velocity, stuck items) ----------

  // A minimal hand-rolled SVG line chart — no charting library dependency,
  // since this needs to keep working as a single self-contained file.
  // Assumes every series shares the same x positions (one point per
  // upload, evenly spaced by index rather than true elapsed time — good
  // enough for "is this trending up or down", and avoids the complexity
  // of a real time-scaled axis for what's usually a handful of uploads).
  function renderLineChartSVG(series, xLabels) {
    const width = 640, height = 220;
    const padL = 42, padR = 16, padT = 16, padB = 28;
    const plotW = width - padL - padR;
    const plotH = height - padT - padB;
    const n = xLabels.length;

    let yMax = 0;
    series.forEach(s => s.points.forEach(v => { if (v > yMax) yMax = v; }));
    const rawStep = Math.max(1, yMax * 1.15) / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
    const step = Math.max(1, Math.ceil(rawStep / mag) * mag);
    yMax = step * 4;

    const xAt = (i) => n <= 1 ? padL + plotW / 2 : padL + (plotW * i) / (n - 1);
    const yAt = (v) => padT + plotH - (plotH * v) / yMax;

    let gridLines = '';
    for (let g = 0; g <= 4; g++) {
      const v = step * g;
      const y = yAt(v);
      gridLines += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="#dcd8cc" stroke-width="1"/>`;
      gridLines += `<text x="${padL - 8}" y="${y + 4}" font-size="11" fill="#565f6c" text-anchor="end">${Math.round(v)}</text>`;
    }

    let xTicks = '';
    const tickEvery = n > 8 ? Math.ceil(n / 8) : 1;
    xLabels.forEach((lbl, i) => {
      if (i % tickEvery !== 0 && i !== n - 1) return;
      xTicks += `<text x="${xAt(i)}" y="${height - 8}" font-size="10.5" fill="#565f6c" text-anchor="middle">${lbl}</text>`;
    });

    let lines = '';
    let legend = '';
    series.forEach((s) => {
      const pts = s.points.map((v, i) => `${xAt(i)},${yAt(v)}`).join(' ');
      lines += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
      s.points.forEach((v, i) => { lines += `<circle cx="${xAt(i)}" cy="${yAt(v)}" r="3" fill="${s.color}"/>`; });
      legend += `<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:${s.color};"></span>${s.name}</span>`;
    });

    return `
      <div class="chart-wrap">
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-width:${width}px;display:block;">
          ${gridLines}
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#565f6c" stroke-width="1"/>
          <line x1="${padL}" y1="${padT + plotH}" x2="${width - padR}" y2="${padT + plotH}" stroke="#565f6c" stroke-width="1"/>
          ${lines}
          ${xTicks}
        </svg>
        <div class="chart-legend">${legend}</div>
      </div>
    `;
  }

  // A matching hand-rolled SVG bar chart, styled the same as the line
  // chart above (same grid/axis look), for single-series counts like New
  // Items per upload.
  function renderBarChartSVG(values, xLabels, color) {
    const width = 640, height = 220;
    const padL = 42, padR = 16, padT = 16, padB = 28;
    const plotW = width - padL - padR;
    const plotH = height - padT - padB;
    const n = xLabels.length;

    let yMax = 0;
    values.forEach(v => { if (v > yMax) yMax = v; });
    const rawStep = Math.max(1, yMax * 1.15) / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
    const step = Math.max(1, Math.ceil(rawStep / mag) * mag);
    yMax = step * 4;

    const yAt = (v) => padT + plotH - (plotH * v) / yMax;

    let gridLines = '';
    for (let g = 0; g <= 4; g++) {
      const v = step * g;
      const y = yAt(v);
      gridLines += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="#dcd8cc" stroke-width="1"/>`;
      gridLines += `<text x="${padL - 8}" y="${y + 4}" font-size="11" fill="#565f6c" text-anchor="end">${Math.round(v)}</text>`;
    }

    const slotW = n > 0 ? plotW / n : plotW;
    const barW = Math.max(4, slotW * 0.55);

    let bars = '';
    values.forEach((v, i) => {
      const x = padL + slotW * i + (slotW - barW) / 2;
      const y = yAt(v);
      const h = (padT + plotH) - y;
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(0, h)}" fill="${color}" rx="2"/>`;
      if (h > 14) {
        bars += `<text x="${x + barW / 2}" y="${y - 5}" font-size="10.5" fill="#565f6c" text-anchor="middle">${v}</text>`;
      }
    });

    let xTicks = '';
    const tickEvery = n > 8 ? Math.ceil(n / 8) : 1;
    xLabels.forEach((lbl, i) => {
      if (i % tickEvery !== 0 && i !== n - 1) return;
      const x = padL + slotW * i + slotW / 2;
      xTicks += `<text x="${x}" y="${height - 8}" font-size="10.5" fill="#565f6c" text-anchor="middle">${lbl}</text>`;
    });

    return `
      <div class="chart-wrap">
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-width:${width}px;display:block;">
          ${gridLines}
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#565f6c" stroke-width="1"/>
          <line x1="${padL}" y1="${padT + plotH}" x2="${width - padR}" y2="${padT + plotH}" stroke="#565f6c" stroke-width="1"/>
          ${bars}
          ${xTicks}
        </svg>
      </div>
    `;
  }

  async function loadAndRenderAnalysis() {
    const body = document.getElementById('body');
    let snapshots;
    try {
      const res = await fetch('/api/snapshots');
      if (!res.ok) throw new Error('Failed to load: ' + res.status);
      const payload = await res.json();
      snapshots = payload.snapshots || [];
    } catch (e) {
      if (currentView === 'analysis') body.innerHTML = '<div class="empty">Could not load upload history for analysis.</div>';
      return;
    }
    if (currentView !== 'analysis') return;

    if (snapshots.length < 2) {
      body.innerHTML = `
        <div class="analysis-wrap">
          <div class="analysis-header">Analysis</div>
          <div class="empty">Need at least 2 uploads to show trends. Upload another RAID log to start building this out.</div>
        </div>
      `;
      return;
    }

    body.innerHTML = '<div class="empty">Crunching item-level history&hellip;</div>';

    let details;
    try {
      details = await Promise.all(snapshots.map(s => fetch('/api/snapshots/' + s.id).then(r => r.json())));
    } catch (e) {
      if (currentView === 'analysis') body.innerHTML = '<div class="empty">Could not load item-level history for analysis.</div>';
      return;
    }
    if (currentView !== 'analysis') return;

    const detailById = {};
    details.forEach(d => { if (d && d.id) detailById[d.id] = d; });

    // Chronological order (oldest first) for trend/velocity computation —
    // the History view sorts newest-first, but trends read naturally left
    // (past) to right (present).
    const chrono = snapshots.slice().sort((a, b) => new Date(a.uploadedAt) - new Date(b.uploadedAt));
    const xLabels = chrono.map(s => shortDateLabel(s.uploadedAt));

    // Blocker count over time — not in statusCounts, so this needs
    // the full item list per snapshot (already fetched above).
    const blockerPoints = chrono.map(s => {
      const d = detailById[s.id];
      return d ? d.issues.filter(i => isBlocker(i.blocker)).length : 0;
    });

    // New Items per upload and Closures per upload, computed from the
    // same interval-by-interval diff used for date-change tracking below.
    const newItemsPerInterval = [];
    const closuresPerInterval = [];
    let totalDateSlips = 0;
    let totalDatePullIns = 0;
    const dateSlipItems = [];
    const datePullInItems = [];
    for (let i = 1; i < chrono.length; i++) {
      const prevDetail = detailById[chrono[i - 1].id];
      const curDetail = detailById[chrono[i].id];
      if (!prevDetail || !curDetail) { newItemsPerInterval.push(0); closuresPerInterval.push(0); continue; }
      const diff = diffSnapshotItems(prevDetail.issues, curDetail.issues);
      newItemsPerInterval.push(diff.added.length);
      closuresPerInterval.push(diff.statusChanged.filter(c => c.to === 'closed').length);
      diff.dateChanged.forEach(c => {
        const direction = dateChangeDirection(c.from, c.to);
        const record = { title: c.item.title, id: c.item.id, from: c.from, to: c.to, uploadedAt: chrono[i].uploadedAt };
        if (direction === 'slip') { totalDateSlips++; dateSlipItems.push(record); }
        else if (direction === 'pullin') { totalDatePullIns++; datePullInItems.push(record); }
      });
    }
    // Most recent change first within each list.
    dateSlipItems.sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));
    datePullInItems.sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));
    // New Items / Closures charts share an x-axis: one bar per interval,
    // labeled with the date of the NEWER upload in that pair — so it
    // lines up with chrono.slice(1).
    const newItemsXLabels = xLabels.slice(1);

    // 2. Stuck items — for each currently-open issue, walk backward
    // through uploads (newest to oldest) and count how many consecutive
    // uploads it's held its CURRENT status. Only surfaced once an item
    // has persisted across at least 2 uploads, so a single upload's
    // items don't all show up as "stuck" on day one.
    const newestFirst = chrono.slice().reverse();
    const stuckItems = issues
      .filter(i => i.status !== 'closed')
      .map(issue => {
        let streak = 0;
        let sinceDate = null;
        for (const snap of newestFirst) {
          const d = detailById[snap.id];
          if (!d) break;
          const match = d.issues.find(x => x.id === issue.id);
          if (!match || match.status !== issue.status) break;
          streak++;
          sinceDate = snap.uploadedAt;
        }
        const days = sinceDate ? Math.round((Date.now() - new Date(sinceDate)) / 86400000) : null;
        return { issue, streak, sinceDate, days };
      })
      .filter(s => s.streak >= 2)
      .sort((a, b) => b.streak - a.streak);

    const renderDateChangeRows = (items) => items.map(r => `
      <tr data-id="${r.id}">
        <td>${r.title}</td>
        <td>${formatDate(r.from)}</td>
        <td>${formatDate(r.to)}</td>
        <td>${formatDate(r.uploadedAt.slice(0, 10))}</td>
      </tr>
    `).join('');

    const dueDateHtml = `
      <div class="analysis-card">
        <div class="analysis-card-title">Due Date Changes <span class="count">(across ${chrono.length} uploads)</span></div>
        <div class="analysis-stat-row">
          <div class="analysis-stat"><div class="analysis-stat-n" style="color:var(--rust);">${totalDateSlips}</div><div class="analysis-stat-l">Due dates pushed out</div></div>
          <div class="analysis-stat"><div class="analysis-stat-n" style="color:var(--moss);">${totalDatePullIns}</div><div class="analysis-stat-l">Due dates pulled in</div></div>
        </div>
        <p class="history-hint" style="margin-top:10px;">Counted whenever an item's target date changed between two consecutive uploads and both dates were real (not "TBD" or similar). Click a row to open that item.</p>
        ${dateSlipItems.length ? `
          <div style="margin-top:4px;">
            <div class="history-diff-title" style="color:var(--rust);">Pushed Out (${dateSlipItems.length})</div>
            <table class="stuck-table">
              <thead><tr><th>Issue</th><th>Was</th><th>Now</th><th>Seen in upload</th></tr></thead>
              <tbody>${renderDateChangeRows(dateSlipItems)}</tbody>
            </table>
          </div>
        ` : ''}
        ${datePullInItems.length ? `
          <div style="margin-top:${dateSlipItems.length ? '18px' : '4px'};">
            <div class="history-diff-title" style="color:var(--moss);">Pulled In (${datePullInItems.length})</div>
            <table class="stuck-table">
              <thead><tr><th>Issue</th><th>Was</th><th>Now</th><th>Seen in upload</th></tr></thead>
              <tbody>${renderDateChangeRows(datePullInItems)}</tbody>
            </table>
          </div>
        ` : ''}
        ${!dateSlipItems.length && !datePullInItems.length ? `<div class="empty">No due date changes detected yet between consecutive uploads.</div>` : ''}
      </div>
    `;

    const newItemsHtml = `
      <div class="analysis-card">
        <div class="analysis-card-title">New Items per Upload</div>
        ${renderBarChartSVG(newItemsPerInterval, newItemsXLabels, '#a3402f')}
      </div>
    `;

    const closuresHtml = `
      <div class="analysis-card">
        <div class="analysis-card-title">Closures per Upload</div>
        ${renderBarChartSVG(closuresPerInterval, newItemsXLabels, '#4a6b4d')}
      </div>
    `;

    const stuckHtml = stuckItems.length ? `
      <div class="analysis-card">
        <div class="analysis-card-title">Stuck Items <span class="count">(${stuckItems.length})</span></div>
        <p class="history-hint">Items that have held the same status across multiple uploads &mdash; click one to open it.</p>
        <table class="stuck-table">
          <thead><tr><th>Issue</th><th>Status</th><th>Owner</th><th>Since</th><th>Uploads</th><th>Days</th></tr></thead>
          <tbody>
            ${stuckItems.map(s => `
              <tr data-id="${s.issue.id}">
                <td>${s.issue.title}</td>
                <td><span class="status-pill ${s.issue.status}">${STATUS_LABELS[s.issue.status] || s.issue.status}</span></td>
                <td>${s.issue.owner || '&mdash;'}</td>
                <td>${formatDate(s.sinceDate ? s.sinceDate.slice(0,10) : '')}</td>
                <td>${s.streak}</td>
                <td>${s.days}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    ` : `
      <div class="analysis-card">
        <div class="analysis-card-title">Stuck Items</div>
        <div class="empty">No items have persisted in the same status across multiple uploads yet.</div>
      </div>
    `;

    body.innerHTML = `
      <div class="analysis-wrap">
        <div class="analysis-header">Analysis <span class="count">(across ${chrono.length} uploads)</span></div>
        <div class="analysis-chart-row">
          <div class="analysis-card">
            <div class="analysis-card-title">Walmart Blockers Over Time</div>
            ${renderLineChartSVG([{ name: 'Walmart Blockers', color: '#a3402f', points: blockerPoints }], xLabels)}
          </div>
          ${newItemsHtml}
          ${closuresHtml}
        </div>
        ${dueDateHtml}
        ${stuckHtml}
      </div>
    `;

    body.querySelectorAll('.stuck-table tbody tr').forEach(tr => {
      tr.addEventListener('click', () => openModal(tr.getAttribute('data-id')));
    });
  }

  function render() {
    renderStats();
    renderHeaderSummary();
    renderActiveFilters();
    const list = getFiltered();

    else if (currentView === 'calendar') body.innerHTML = renderCalendar(list);

  function syncBoardScrollbar() {
    const proxy = document.getElementById('board-scrollbar-proxy');
    const inner = document.getElementById('board-scrollbar-proxy-inner');
    const board = currentView === 'board' ? document.querySelector('#tifton-tracker .board') : null;
    activeBoardEl = board;

    if (!board) {
      proxy.classList.remove('visible');
      return;
    }
    const overflowing = board.scrollWidth > board.clientWidth + 1;
    if (!overflowing) {
      proxy.classList.remove('visible');
      return;
    }
    proxy.classList.add('visible');
    inner.style.width = board.scrollWidth + 'px';
    proxy.scrollLeft = board.scrollLeft;
    board.addEventListener('scroll', onActiveBoardScroll);
  }

  function onActiveBoardScroll() {
    const proxy = document.getElementById('board-scrollbar-proxy');
    if (activeBoardEl && proxy) proxy.scrollLeft = activeBoardEl.scrollLeft;
  }

  function todayLabel() {
    const d = new Date();
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function todayISO() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  // ---------- Export / Import ----------

  function buildExportPayload() {
    const payload = {
      exportedAt: new Date().toISOString(),
      dataVersion: CURRENT_DATA_VERSION,
      issues: issues,
    };
    return JSON.stringify(payload, null, 2);
  }

  function exportData() {
    const text = buildExportPayload();
    const stamp = new Date().toISOString().slice(0, 10);
    const filename = `tifton-tracker-export-${stamp}.json`;

    // Best-effort automatic download. Sandboxed iframes sometimes block
    // programmatic downloads silently, so this is backed up by the modal
    // below which always gives a guaranteed, working way to get the data.
    let downloadAttempted = false;
    try {
      const blob = new Blob([text], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      downloadAttempted = true;
    } catch (e) {
      downloadAttempted = false;
    }

    showExportModal(text, filename, downloadAttempted);
  }

  function showExportModal(text, filename, downloadAttempted) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal" style="max-width:600px;">
        <h2>Export data</h2>
        <p style="font-size:13px;line-height:1.5;color:var(--ink-soft);margin:0 0 12px;">
          ${downloadAttempted ? `A download (<strong>${filename}</strong>) was started automatically. ` : ''}

        <div class="modal-actions" style="justify-content:flex-end;gap:8px;">
          <button class="btn-secondary" id="export-close">Close</button>
          <button class="btn-primary" id="export-copy">Copy text</button>
        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);
    const ta = backdrop.querySelector('#export-textarea');
    ta.value = text;
    const close = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    backdrop.querySelector('#export-close').addEventListener('click', close);
    backdrop.querySelector('#export-copy').addEventListener('click', async (e) => {
      const btn = e.target;
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (err) {
        try {
          ta.focus();
          ta.select();
          ok = document.execCommand('copy');
        } catch (err2) { ok = false; }
      }
      btn.textContent = ok ? 'Copied!' : 'Select text above and copy manually';
      setTimeout(() => { btn.textContent = 'Copy text'; }, 1800);
    });
  }

  // ---------- Upload RAID Log (parses the source spreadsheet directly —
  // .xlsx, .xls, or .csv — then transforms it into this tracker's issue
  // format and records a historical snapshot of the result) ----------
  //
  // Columns are detected by matching HEADER TEXT, not by fixed position.
  // This matters because different saved versions of the same RAID log
  // have genuinely different column layouts (e.g. one export has a
  // "DevOps" column and 22 total columns, another has no DevOps column
  // at all and only 16) — a hardcoded position mapping silently misreads
  // every field whenever that happens. Header-based detection adapts to
  // whichever layout is actually in the uploaded file.

  function normalizeHeader(s) {
    return (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' ');
  }

  // Fixed column positions, per your explicit specification — not detected
  // from header text. Header-text detection was tried first but proved too
  // fragile: the same underlying sheet has used different exact wording for
  // the same column across versions (and sometimes reordered columns
  // entirely), which caused silent misreads. These exact positions are the
  // ones you confirmed to trust for every RAID Log upload going forward.
  //   A: RAID # (kept only for display — no longer used for the stable
  //      ID; RAID # is just a spreadsheet row position, not a durable
  //      identifier — see transformRaidRow)
  //   B: Dev Ops        E: Deployment Status   J: Description
  //   K: Turnover to DG Target Date            M: Walmart Blocker
  //   P: Priority       R: Owner
  // Columns not listed (Type, Internal/External, Notes, Latest Comment,
  // DG Priority) are intentionally not read.
  const FIXED_RAID_COLUMNS = {
    raidNumber: 0,   // A
    devops: 1,       // B
    status: 4,       // E
    description: 9,  // J
    targetDate: 10,  // K
    blocker: 12,     // M
    priority: 15,    // P
    owner: 17,       // R
  };

  function detectColumnMap() {
    // Always the same fixed positions — see FIXED_RAID_COLUMNS above.
    return Object.assign({}, FIXED_RAID_COLUMNS);
  }

  function mapRaidStatus(raw) {
    const s = (raw || '').toString().trim().toLowerCase();
    // Order matters: check the more specific/distinguishing phrases
    // before shorter substrings that could otherwise match too broadly.
    if (s.indexOf('closed') !== -1) return 'closed';
    if (s.indexOf('ready for customer') !== -1) return 'readycustomer';
    if (s.indexOf('ready for install') !== -1) return 'readyinstall';
    if (s.indexOf('in progress') !== -1) return 'inprogress';
    // Both "Testing" and "Testing (PSO)" land in the same bucket.
    if (s.indexOf('testing') !== -1) return 'testing';
    if (s.indexOf('monitoring') !== -1) return 'monitoring';
    if (s.indexOf('on hold') !== -1 || s.indexOf('onhold') !== -1) return 'onhold';
    return 'open';
  }

  // Same lesson as mapRaidStatus: match loosely (any case, trimmed,
  // single-letter or full-word) rather than requiring an exact "Yes"/"No"
  // — real exported values vary (e.g. "yes", "Y", trailing spaces) and an
  // exact match silently miscounted many genuine blockers as non-blockers.
  function mapRaidBlocker(raw) {
    const b = (raw || '').toString().trim().toLowerCase();
    if (b === 'y/n' || b === 'yes/no') return 'Y/N';
    if (b === 'yes' || b === 'y' || b === 'true' || b === '1') return 'Y';
    if (b === 'no' || b === 'n' || b === 'false' || b === '0') return 'N';
    return '';
  }

  // Recognizes a handful of common non-ISO date formats seen in real
  // exports/pastes (e.g. "4-Aug" from a text-formatted Excel cell, or
  // "08/14/26" from a plain paste) and normalizes them to ISO YYYY-MM-DD,
  // so isLate() and the Missing Due Date filter treat them as real dates
  // instead of lumping them in with genuine placeholders like "TBD".
  // Returns null if the text isn't a recognized date format at all.
  function parseFlexibleDate(raw) {
    const s = (raw || '').toString().trim();
    if (!s) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;

    const pad = n => String(n).padStart(2, '0');
    const normalizeYear = (yy) => {
      if (yy.length === 4) return parseInt(yy, 10);
      const n = parseInt(yy, 10);
      return n < 50 ? 2000 + n : 1900 + n;
    };

    // MM/DD/YY or MM/DD/YYYY
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
    if (m) {
      const [, mm, dd, yy] = m;
      return `${normalizeYear(yy)}-${pad(mm)}-${pad(dd)}`;
    }

    const months = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };

    // D-MMM-YY(YY) e.g. "4-Aug-26"
    m = s.match(/^(\d{1,2})-([A-Za-z]{3,})-(\d{2}|\d{4})$/);
    if (m && months[m[2].toLowerCase().slice(0,3)]) {
      const month = months[m[2].toLowerCase().slice(0,3)];
      return `${normalizeYear(m[3])}-${pad(month)}-${pad(m[1])}`;
    }

    // D-MMM with no year e.g. "4-Aug" — assume the current year, since
    // these are near-term project dates, not historical records.
    m = s.match(/^(\d{1,2})-([A-Za-z]{3,})$/);
    if (m && months[m[2].toLowerCase().slice(0,3)]) {
      const month = months[m[2].toLowerCase().slice(0,3)];
      return `${new Date().getFullYear()}-${pad(month)}-${pad(m[1])}`;
    }

    return null;
  }

  function excelCellToDateString(val) {
    if (val instanceof Date && !isNaN(val)) {
      const pad = n => String(n).padStart(2, '0');
      return `${val.getFullYear()}-${pad(val.getMonth() + 1)}-${pad(val.getDate())}`;
    }
    const raw = (val || '').toString().trim();
    const parsed = parseFlexibleDate(raw);
    return parsed || raw;
  }

  // Every row that comes through here gets a monotonically-increasing
  // sequence number for the CURRENT upload only — used purely to make
  // each unmatched ("nodevops-") id unique within this one upload's
  // array of issues; it carries no meaning across uploads.
  let _raidRowSeq = 0;

  function transformRaidRow(row, index) {
    const raidNumber = (row.raidNumber || '').toString().trim();
    const devops = (row.devops || '').toString().trim();
    const noteParts = [];
    if (row.notes) noteParts.push(row.notes);
    if (row.latestComment) noteParts.push('Latest comment: ' + row.latestComment);
    // Stable ID is based on DevOps # — it's assigned to the actual issue,
    // not to a spreadsheet row, so it stays put even when rows get
    // added/removed/resorted in Excel (unlike RAID #, which is really
    // just a row position and broke History's diffing for exactly that
    // reason). Rows with no DevOps # yet get a one-time-use id that will
    // never match anything in another upload — diffSnapshotItems()
    // recognizes that prefix and reports them as "unmatched" rather than
    // silently counting them as new or removed every time.
    const id = devops ? ('devops-' + devops) : ('nodevops-' + (raidNumber || 'row') + '-' + (_raidRowSeq++));
    return {
      id: id,
      raidNumber: raidNumber,
      area: (row.type || 'General').toString().trim(),
      title: (row.description || '').toString().trim() || 'Untitled item',
      detail: (row.description || '').toString().trim(),
      status: mapRaidStatus(row.status),
      owner: (row.owner || '').toString().trim(),
      devops: devops,
      priority: (row.priority || '').toString().trim(),
      blocker: mapRaidBlocker(row.blocker),
      targetDate: excelCellToDateString(row.targetDate),
      notes: noteParts.join('\n\n'),
      reportedDate: '',
    };
  }

  // Turns a 2D array of raw cell values (however we got it — SheetJS,
  function isRaidHeaderCell(cell) {
    const h = normalizeHeader(cell);
    return h.indexOf('raid') === 0; // "RAID #", "RAID#", "RAID No.", etc.
  }

  // or a hand-parsed paste) into the intermediate row-object shape
  // transformRaidRow() expects, skipping the header row and any blank
  // separator rows (e.g. the "- Risks" section dividers in the source).
  function rawRowsToRaidObjects(rows) {
    // Find the header row: the one whose first cell starts with "RAID".
    let headerIdx = rows.findIndex(r => isRaidHeaderCell(r[0]));
    if (headerIdx === -1) headerIdx = 0; // fall back to assuming row 1 is the header

    const cols = detectColumnMap(rows[headerIdx]);
    const get = (r, field) => (cols[field] !== undefined ? r[cols[field]] : '');

    const dataRows = rows.slice(headerIdx + 1);
    const objects = [];
    dataRows.forEach((r) => {
      const raidNumber = (get(r, 'raidNumber') || '').toString().trim();
      const description = (get(r, 'description') || '').toString().trim();
      // Section-divider rows (marking the start of "Risks"/"Actions"/etc.
      // groupings in the source sheet) always use a lone "-" in the RAID #
      // column. Checking for that directly is more reliable than checking
      // for a blank description — in some file layouts the divider's
      // section label (e.g. "Risks") lands in the description column
      // position, which would otherwise let it slip through as a real
      // item with a blank status (defaulting to "Open").
      if (raidNumber === '-') return;
      if (!description) return; // blank/separator row
      objects.push({
        raidNumber,
        devops: get(r, 'devops'),
        internalExternal: get(r, 'internalExternal'),
        type: get(r, 'type'),
        status: get(r, 'status'),
        blocker: get(r, 'blocker'),
        description,
        targetDate: get(r, 'targetDate'),
        owner: get(r, 'owner'),
        priority: get(r, 'priority'),
        notes: get(r, 'notes'),
        latestComment: get(r, 'latestComment'),
      });
    });
    return objects;
  }

  // Parses an uploaded .xlsx/.xls/.csv file (as an ArrayBuffer) via
  // SheetJS, picks the sheet that actually looks like the RAID log (the
  // one containing a "RAID #"-style header — the workbook also has a
  // summary sheet and a validation-list sheet we want to ignore), and
  // returns the intermediate row-object array.
  function parseSpreadsheetFile(arrayBuffer) {
    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
    for (const sheetName of workbook.SheetNames) {
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
      const headerIdx = rows.findIndex(r => isRaidHeaderCell(r[0]));
      if (headerIdx !== -1) {
        const columnMap = detectColumnMap(rows[headerIdx]);
        return { objects: rawRowsToRaidObjects(rows), sheetName, columnMap };
      }
    }
    return { objects: [], sheetName: null, columnMap: {} };
  }

  const RAID_FIELD_LABELS = {
    raidNumber: 'RAID #', devops: 'DevOps', internalExternal: 'Internal/External', type: 'Type',
    status: 'Status', blocker: 'Blocker', description: 'Description', targetDate: 'Target Date',
    owner: 'Owner', priority: 'Priority', notes: 'Notes', latestComment: 'Latest Comment',
  };

  function describeColumnMap(columnMap) {
    const found = Object.keys(RAID_FIELD_LABELS).filter(f => columnMap[f] !== undefined).map(f => RAID_FIELD_LABELS[f]);
    const missing = Object.keys(RAID_FIELD_LABELS).filter(f => columnMap[f] === undefined).map(f => RAID_FIELD_LABELS[f]);
    let text = 'Columns found: ' + (found.join(', ') || 'none');
    if (missing.length) text += '. Not found: ' + missing.join(', ') + '.';
    return text;
  }

  // Parses text pasted directly from Excel (selecting a range of cells
  // and copying puts tab-separated values on the clipboard).
  function parsePastedRows(text) {
    const lines = text.split(/\r?\n/).filter(l => l.length > 0);
    const rows = lines.map(l => l.split('\t'));
    return rawRowsToRaidObjects(rows);
  }

  function openUploadRaidModal() {
    let pendingObjects = null; // set once a file has been successfully parsed

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal" style="max-width:600px;">
        <h2>Upload RAID Log</h2>
        <p style="font-size:13px;line-height:1.5;color:var(--ink-soft);margin:0 0 10px;">

          <p style="font-size:12px;color:var(--ink-soft);margin:6px 0 0;">
            Today's date: replaces your current tracker data and records this upload in History.
            A past date: adds a historical record to History only — your current tracker data

        </div>
        <div class="field">
          <label>Choose file</label>
