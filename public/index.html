          <textarea id="raid-modal-textarea" placeholder="Paste copied Excel rows here..." style="width:100%;height:140px;font-family:monospace;font-size:11.5px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);resize:vertical;"></textarea>
        </div>
        <p id="raid-modal-error" style="font-size:12.5px;color:var(--rust);margin:0 0 8px;display:none;"></p>
        <div class="modal-actions" style="justify-content:flex-end;gap:8px;">
          <button class="btn-secondary" id="raid-cancel">Cancel</button>
          <button class="btn-primary" id="raid-load">Upload</button>
        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);
    const close = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    backdrop.querySelector('#raid-cancel').addEventListener('click', close);

    const fileInput = backdrop.querySelector('#raid-modal-file');
    const textarea = backdrop.querySelector('#raid-modal-textarea');
    const dateInput = backdrop.querySelector('#raid-modal-date');
    const errorEl = backdrop.querySelector('#raid-modal-error');
    const fileStatusEl = backdrop.querySelector('#raid-modal-file-status');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      errorEl.style.display = 'none';
      fileStatusEl.textContent = 'Reading file…';
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const { objects, sheetName, columnMap } = parseSpreadsheetFile(reader.result);
          if (!objects.length) {
            pendingObjects = null;
            fileStatusEl.textContent = '';
            errorEl.textContent = 'Could not find a "RAID #" column in any sheet of this file. Make sure this is the RAID log spreadsheet.';
            errorEl.style.display = 'block';
            return;
          }
          pendingObjects = objects;
          fileStatusEl.innerHTML = `Found ${objects.length} row(s) in sheet "${sheetName}". Click Upload to continue.<br><span style="opacity:0.8;">${describeColumnMap(columnMap)}</span>`;
        } catch (e) {
          pendingObjects = null;
          fileStatusEl.textContent = '';
          errorEl.textContent = 'Could not read that file as a spreadsheet — try a .xlsx, .xls, or .csv export, or use the paste option below.';
          errorEl.style.display = 'block';
        }
      };
      reader.onerror = () => {
        pendingObjects = null;
        fileStatusEl.textContent = '';
        errorEl.textContent = 'Could not read that file — try pasting rows into the box below instead.';
        errorEl.style.display = 'block';
      };
      reader.readAsArrayBuffer(file);
    });

    backdrop.querySelector('#raid-load').addEventListener('click', () => {
      let objects = pendingObjects;
      if (!objects) {
        const pasted = textarea.value.trim();
        if (!pasted) {
          errorEl.textContent = 'Choose a file above, or paste copied rows into the box before uploading.';
          errorEl.style.display = 'block';
          return;
        }
        objects = parsePastedRows(pasted);
        if (!objects.length) {
          errorEl.textContent = 'Could not find any RAID log rows in the pasted text.';
          errorEl.style.display = 'block';
          return;
        }
      }
      const snapshotDate = dateInput.value || todayISO();
      const isHistorical = snapshotDate !== todayISO();
      _raidRowSeq = 0;
      const transformed = objects.map((row, i) => transformRaidRow(row, i));
      close();

      const confirmMessage = isHistorical
        ? `Record this as a historical RAID log snapshot dated ${formatDate(snapshotDate)}? This adds ${transformed.length} item(s) to History only — it will NOT change your current tracker data.`
        : `Upload ${transformed.length} item(s) from this RAID log? This will replace all ${issues.length} item(s) currently in the tracker.`;

      showConfirmModal(
        confirmMessage,
        async () => {
          // Live uploads use the real current moment (full timestamp
          // precision) so multiple uploads on the same calendar day still
          // sort in the order they actually happened — using a fixed
          // noon-of-that-date timestamp for every live upload would make
          // same-day uploads indistinguishable and their History order
          // effectively random. Historical (backdated) uploads don't have
          // a real time to anchor to, so noon-of-that-date is the
          // reasonable choice there.
          const snapshotIso = isHistorical ? new Date(snapshotDate + 'T12:00:00').toISOString() : new Date().toISOString();
          if (isHistorical) {
            // History-only: don't touch the live tracker data.
            await saveSnapshot(transformed, snapshotIso);
            if (currentView === 'history') loadAndRenderHistory();
          } else {
            issues = transformed;
            await saveIssues(snapshotDate);
            await saveSnapshot(issues, snapshotIso);
            populateFilters();
            render();
          }
        },
        'Upload'
      );
    });
  }

  async function saveSnapshot(issuesToSnapshot, uploadedAt) {
    try {
      await fetch('/api/snapshots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ issues: issuesToSnapshot, uploadedAt }),
      });
    } catch (e) {
      console.error('Snapshot save failed', e);
    }
  }

  function parseAndValidateImport(text) {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      return { error: 'That doesn\'t look like valid JSON — check for missing commas, brackets, or quotes.' };
    }
    const incoming = Array.isArray(parsed) ? parsed : parsed.issues;
    if (!Array.isArray(incoming)) {
      return { error: 'This JSON doesn\'t look like a tracker export (expected an array of issues, or an object with an "issues" array).' };
    }
    const looksValid = incoming.every(i => i && typeof i === 'object' && 'id' in i && 'title' in i);
    if (!looksValid) {
      return { error: 'This JSON doesn\'t look like a tracker export — some entries are missing expected fields (id, title).' };
    }
    return { issues: incoming };
  }

      const reader = new FileReader();

        async () => {

  function showConfirmModal(message, onConfirm, confirmLabel) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">

        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);
    const close = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    backdrop.querySelector('#confirm-cancel').addEventListener('click', close);
    backdrop.querySelector('#confirm-ok').addEventListener('click', () => {
      close();
      onConfirm();
    });
  }

  // ---------- Copy view ----------

  function statusText(status) {
    return STATUS_LABELS[status] || status;
  }

  function buildCopyText() {
    const list = getFiltered();
    const header = `TIFTON GO-LIVE TRACKER\nGenerated ${todayLabel()}\n${list.length} issue(s)\n`;

    if (!list.length) return header + '\nNo issues match the current filters.';

    if (currentView === 'table') {
      const rows = list.slice().sort((a,b) => {
        const statusDiff = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
        return statusDiff !== 0 ? statusDiff : a.title.localeCompare(b.title);
      }).map(i => {
        return [i.title, i.detail, i.devops || '\u2014', i.priority || '\u2014', i.blocker || '\u2014', i.reportedDate ? formatDate(i.reportedDate) : '\u2014', i.targetDate ? formatDate(i.targetDate) : '\u2014', i.notes || '\u2014', i.owner || '\u2014', statusText(i.status)].join('\t');
      });
      const cols = ['Title', 'Detail', 'DevOps #', 'Priority', 'Walmart Blocker', 'Reported', 'Target', 'Notes', 'Owner', 'Status'].join('\t');
      return header + '\n' + cols + '\n' + rows.join('\n');
    }

    // Board view groups by only the 5 Board statuses (matching what's on
    // screen); other views that fall through here (Closed, Calendar,
    // History) still group by the full status list so their own items
    // (e.g. Closed) aren't silently dropped.
    const groupOrder = currentView === 'board' ? BOARD_STATUS_ORDER : STATUS_ORDER;
    const blocks = groupOrder.map(st => {
      const items = list.filter(i => i.status === st);
      if (!items.length) return null;
      const lines = items.map(i => formatIssueLine(i));
      return `${statusText(st).toUpperCase()} (${items.length})\n${'-'.repeat(30)}\n${lines.join('\n\n')}`;
    }).filter(Boolean);
    return header + '\n' + blocks.join('\n\n\n');
  }

  function formatIssueLine(i) {
    const devopsPrefix = i.devops ? `DevOps #${i.devops} — ` : '';
    const owner = i.owner ? `  |  ${i.owner}` : '';
    const priority = i.priority ? `  |  ${i.priority} priority` : '';
    const blocker = isBlocker(i.blocker) ? `  |  WALMART BLOCKER${i.blocker === 'Y/N' ? ' (Y/N)' : ''}` : '';
    const reported = i.reportedDate ? `  |  Reported: ${formatDate(i.reportedDate)}` : '';
    const target = i.targetDate ? `  |  Target: ${formatDate(i.targetDate)}` : '';
    const notes = i.notes ? `\nNotes: ${i.notes}` : '';
    return `${devopsPrefix}${i.title}\n${i.detail}${owner}${priority}${blocker}${reported}${target}${notes}`;
  }

  // Colors mirrored from the app's CSS variables, hardcoded here since inline
  // styles are required for HTML pasted into external email clients.
  const EMAIL_COLORS = {
    ink: '#1b2027', inkSoft: '#565f6c', line: '#dcd8cc',
    steel: '#3d5a73', steelBg: '#e4ebef',
    amber: '#c4791f', amberBg: '#fbeee0',
    rust: '#a3402f', rustBg: '#f8e6e1',
    moss: '#4a6b4d', mossBg: '#e7efe4',
    slate: '#6b7280', slateBg: '#eceae2',
    teal: '#1f7a72', tealBg: '#daf0ee',
    plum: '#6b4fa0', plumBg: '#f2ecfb',
    forest: '#2f6b3a', forestBg: '#e2f0e4',
  };
  const STATUS_EMAIL_COLOR = { open: 'rust', inprogress: 'amber', testing: 'steel', readycustomer: 'moss', readyinstall: 'slate', monitoring: 'plum', onhold: 'forest', closed: 'teal' };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function escNl(s) {
    return esc(s).replace(/\n/g, '<br>');
  }

  function priorityEmailColor(p) {
    if (p === 'High') return 'rust';
    if (p === 'Medium') return 'amber';
    if (p === 'Low') return 'slate';
    return null;
  }

  function chip(text, colorKey) {
    const c = EMAIL_COLORS[colorKey], bg = EMAIL_COLORS[colorKey + 'Bg'];
    return `<span style="display:inline-block;font-size:11px;font-weight:600;color:${c};background:${bg};border-radius:4px;padding:2px 7px;margin:0 6px 4px 0;white-space:nowrap;">${esc(text)}</span>`;
  }

  function issueMetaHtml(i) {
    const chips = [];
    if (i.devops) chips.push(chip('DevOps #' + i.devops, 'steel'));
    if (i.priority) { const pc = priorityEmailColor(i.priority); if (pc) chips.push(chip(i.priority + ' priority', pc)); }
    if (isBlocker(i.blocker)) chips.push(chip('WALMART BLOCKER' + (i.blocker === 'Y/N' ? ' (Y/N)' : ''), 'rust'));
    if (i.reportedDate) chips.push(chip('Reported: ' + formatDate(i.reportedDate), 'slate'));
    if (i.targetDate) chips.push(chip('Target: ' + formatDate(i.targetDate), 'slate'));
    return chips.join('');
  }

      });
      const th = (label) => `<th style="text-align:left;padding:6px 10px;border-bottom:2px solid ${EMAIL_COLORS.ink};font-size:11px;text-transform:uppercase;letter-spacing:0.03em;color:${EMAIL_COLORS.inkSoft};">${esc(label)}</th>`;
      const rowsHtml = sorted.map(i => {
        const statusColor = EMAIL_COLORS[STATUS_EMAIL_COLOR[i.status]];
        const statusBg = EMAIL_COLORS[STATUS_EMAIL_COLOR[i.status] + 'Bg'];
        return `
          <tr>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;">
              <div style="font-weight:700;font-size:13px;color:${EMAIL_COLORS.ink};">${esc(i.title)}</div>
              <div style="font-size:12px;color:${EMAIL_COLORS.inkSoft};margin-top:2px;">${escNl(i.detail)}</div>
              ${i.notes ? `<div style="font-size:11.5px;color:${EMAIL_COLORS.steel};font-style:italic;margin-top:4px;"><strong>Notes:</strong> ${escNl(i.notes)}</div>` : ''}
            </td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;">${esc(i.devops) || '&mdash;'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;">${esc(i.priority) || '&mdash;'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;${isBlocker(i.blocker) ? `color:${EMAIL_COLORS.rust};font-weight:700;` : ''}">${isBlocker(i.blocker) ? 'YES' + (i.blocker === 'Y/N' ? ' (Y/N)' : '') : (esc(i.blocker) || '&mdash;')}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;">${i.reportedDate ? esc(formatDate(i.reportedDate)) : '&mdash;'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;">${i.targetDate ? esc(formatDate(i.targetDate)) : '&mdash;'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;font-size:12.5px;">${esc(i.owner) || '&mdash;'}</td>
            <td style="padding:8px 10px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;">
              <span style="display:inline-block;font-size:11px;font-weight:700;color:${statusColor};background:${statusBg};border-radius:100px;padding:3px 10px;white-space:nowrap;">${esc(STATUS_LABELS[i.status])}</span>
            </td>
          </tr>`;
      }).join('');
      return `
        <div style="${font}">
          ${headerHtml}
          <table style="border-collapse:collapse;width:100%;">
            <thead><tr>${th('Issue')}${th('DevOps #')}${th('Priority')}${th('Walmart Blocker')}${th('Reported')}${th('Target')}${th('Owner')}${th('Status')}</tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>`;
    }

    // Board view groups by only the 5 Board statuses (matching what's on
    // screen); other views that fall through here still group by the
    // full status list so their own items aren't silently dropped.
    const groupOrder = currentView === 'board' ? BOARD_STATUS_ORDER : STATUS_ORDER;
    const sections = groupOrder.map(st => {
      const items = list.filter(i => i.status === st);
      if (!items.length) return '';
      const color = EMAIL_COLORS[STATUS_EMAIL_COLOR[st]];
      const rowsHtml = items.map(i => `
        <tr>
          <td style="padding:10px 12px;border-bottom:1px solid ${EMAIL_COLORS.line};vertical-align:top;">
            <div style="font-weight:700;font-size:13.5px;color:${EMAIL_COLORS.ink};">${esc(i.title)}</div>
            <div style="margin:4px 0;">${issueMetaHtml(i)}</div>
            <div style="font-size:12px;color:${EMAIL_COLORS.inkSoft};">${escNl(i.detail)}</div>
            ${i.notes ? `<div style="font-size:11.5px;color:${EMAIL_COLORS.steel};font-style:italic;margin-top:4px;">${escNl(i.notes)}</div>` : ''}
            ${i.owner ? `<div style="font-size:11.5px;font-weight:700;color:${EMAIL_COLORS.steel};margin-top:6px;">${esc(i.owner)}</div>` : ''}
          </td>
        </tr>`).join('');
      return `
        <div style="margin-bottom:20px;">
          <div style="font-size:14px;font-weight:700;color:${color};border-bottom:2px solid ${color};padding-bottom:4px;margin-bottom:8px;">
            ${esc(STATUS_LABELS[st])} <span style="font-weight:400;color:${EMAIL_COLORS.inkSoft};">(${items.length})</span>
          </div>
          <table style="border-collapse:collapse;width:100%;">
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>`;
    }).filter(Boolean).join('');

    return `<div style="${font}">${headerHtml}${sections}</div>`;
  }

  // Copies rich HTML by rendering it off-screen, selecting it as a real DOM
  // range, and using the classic execCommand('copy'). Unlike the modern async
  // Clipboard API (which some sandboxed hosts silently refuse for anything
  // beyond plain text), this selection-based copy is what browsers have used
  // for rich copy/paste for years and reliably places BOTH an HTML and a
  // plain-text representation on the clipboard in one step.
  function copyRichViaSelection(html, text) {
    const container = document.createElement('div');
    container.setAttribute('contenteditable', 'true');
    container.style.position = 'fixed';
    container.style.top = '0';
    container.style.left = '0';
    container.style.opacity = '0.01';
    container.style.pointerEvents = 'none';
    container.style.zIndex = '-1';
    container.innerHTML = html;
    document.body.appendChild(container);

    let ok = false;
    try {
      const range = document.createRange();
      range.selectNodeContents(container);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ok = document.execCommand('copy');
      sel.removeAllRanges();
    } catch (e) {
      ok = false;
    }
    container.remove();
    return ok;
  }

  async function copyCurrentView() {
    const text = buildCopyText();
    const html = buildCopyHtml();
    const btn = document.getElementById('btn-copy-view');
    let ok = copyRichViaSelection(html, text);

    if (!ok) {
      // Fall back to the modern Clipboard API with both MIME types
      try {
        await navigator.clipboard.write([
          new ClipboardItem({
            'text/plain': new Blob([text], { type: 'text/plain' }),
            'text/html': new Blob([html], { type: 'text/html' }),
          })
        ]);
        ok = true;
      } catch (e) {
        // Fall back further to plain-text-only clipboard write
        try {
          await navigator.clipboard.writeText(text);
          ok = true;
        } catch (e2) {
          // Final fallback for environments where the Clipboard API is unavailable/blocked
          try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            ok = document.execCommand('copy');
            ta.remove();
          } catch (e3) {
            ok = false;
          }
        }
      }
    }
    const original = btn.textContent;
    btn.textContent = ok ? 'Copied!' : 'Copy failed';
    btn.classList.toggle('copied', ok);
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1600);
  }

  function openModal(id) {
    editingId = id || null;
    const issue = id ? issues.find(i => i.id === id) : { title:'', detail:'', status: STATUS_ORDER[0], owner:'', devops:'', priority:'', blocker:'', targetDate:'', notes:'', reportedDate: todayISO() };
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h2>${id ? 'Edit issue' : 'Add issue'}</h2>
        <div class="field"><label>Owner</label><input type="text" id="m-owner" value="${issue.owner||''}" placeholder="optional"></div>
        <div class="field"><label>Title</label><input type="text" id="m-title" value="${issue.title}" placeholder="Short summary"></div>
        <div class="field"><label>Detail</label><textarea id="m-detail" placeholder="Full description">${issue.detail}</textarea></div>
        <div class="field-row">
          <div class="field"><label>DevOps #</label><input type="text" id="m-devops" value="${issue.devops||''}" placeholder="e.g. 24714 (optional)"></div>
          <div class="field">
            <label>Priority</label>
            <select id="m-priority">
              <option value="" ${!issue.priority ? 'selected' : ''}>&mdash;</option>
              <option value="High" ${issue.priority==='High'?'selected':''}>High</option>
              <option value="Medium" ${issue.priority==='Medium'?'selected':''}>Medium</option>
              <option value="Low" ${issue.priority==='Low'?'selected':''}>Low</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Reported date</label><input type="date" id="m-reported" value="${issue.reportedDate||''}"></div>
          <div class="field"><label>Target completion date</label><input type="date" id="m-target" value="${issue.targetDate||''}"></div>
        </div>
        <div class="field">
          <label>Walmart blocker</label>
          <select id="m-blocker">
            <option value="" ${!issue.blocker ? 'selected' : ''}>&mdash;</option>
            <option value="Y" ${issue.blocker==='Y'?'selected':''}>Y</option>
            <option value="N" ${issue.blocker==='N'?'selected':''}>N</option>
            <option value="Y/N" ${issue.blocker==='Y/N'?'selected':''}>Y/N (unclear)</option>
          </select>
        </div>
        <div class="field"><label>Notes</label><textarea id="m-notes" placeholder="optional">${issue.notes||''}</textarea></div>
        <div class="field">
          <label>Status</label>
          <select id="m-status">
            ${STATUS_ORDER.map(s => `<option value="${s}" ${issue.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
          </select>
        </div>
        <div class="modal-actions">
          <div>${id ? '<button class="btn-delete" id="m-delete">Delete</button>' : ''}</div>
          <div style="display:flex;gap:8px;">
            <button class="btn-secondary" id="m-cancel">Cancel</button>
            <button class="btn-primary" id="m-save">Save</button>
          </div>
        </div>
      </div>
    `;
    ROOT.appendChild(backdrop);

    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
    document.getElementById('m-cancel').addEventListener('click', () => backdrop.remove());
    if (id) {
      document.getElementById('m-delete').addEventListener('click', async () => {
        issues = issues.filter(i => i.id !== id);
        await saveIssues();
        backdrop.remove();
        populateFilters();
        render();
      });
    }
    document.getElementById('m-save').addEventListener('click', async () => {
      const data = {
        title: document.getElementById('m-title').value.trim(),
        detail: document.getElementById('m-detail').value.trim(),
        status: document.getElementById('m-status').value,
        owner: document.getElementById('m-owner').value.trim(),
        devops: document.getElementById('m-devops').value.trim(),
        priority: document.getElementById('m-priority').value,
        blocker: document.getElementById('m-blocker').value,
        reportedDate: document.getElementById('m-reported').value,
        targetDate: document.getElementById('m-target').value,
        notes: document.getElementById('m-notes').value.trim(),
      };
      if (!data.title) { document.getElementById('m-title').focus(); return; }
      if (id) {
        const idx = issues.findIndex(i => i.id === id);
        issues[idx] = { ...issues[idx], ...data };
      } else {
        data.id = 'issue-' + Date.now();
        issues.push(data);
      }
      await saveIssues();
      backdrop.remove();
      populateFilters();
      render();
    });
  }

  // Event bindings
  document.getElementById('btn-copy-view').addEventListener('click', copyCurrentView);
  document.getElementById('btn-export').addEventListener('click', exportData);
  document.getElementById('btn-network-diagram').addEventListener('click', openNetworkDiagramModal);
  document.getElementById('btn-import').addEventListener('click', openImportModal);
  document.getElementById('btn-upload-raid').addEventListener('click', openUploadRaidModal);
  document.getElementById('filter-status').addEventListener('change', render);
  document.getElementById('filter-blocker').addEventListener('change', render);
  document.getElementById('filter-missing').addEventListener('change', render);
  document.getElementById('search').addEventListener('input', render);
  document.querySelectorAll('#view-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = btn.getAttribute('data-view');
      document.querySelectorAll('#view-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  document.getElementById('board-scrollbar-proxy').addEventListener('scroll', (e) => {
    if (activeBoardEl) activeBoardEl.scrollLeft = e.target.scrollLeft;
  });
  window.addEventListener('resize', () => {
    if (currentView === 'board') syncBoardScrollbar();
  });

  (async function init() {
    await loadIssues();
    populateFilters();
    render();
  })();
})();
</script>
