<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIFTON Go-Live Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  #tifton-tracker {
    --ink: #1b2027;
    --ink-soft: #565f6c;
    --paper: #f3f1ea;
    --panel: #ffffff;
    --line: #dcd8cc;
    --steel: #3d5a73;
    --steel-dark: #2b4256;
    --steel-bg: #e4ebef;
    --amber: #c4791f;
    --amber-bg: #fbeee0;
    --rust: #a3402f;
    --rust-bg: #f8e6e1;
    --moss: #4a6b4d;
    --moss-bg: #e7efe4;
    --slate: #6b7280;
    --slate-bg: #eceae2;
    --teal: #1f7a72;
    --teal-bg: #daf0ee;
    --plum: #6b4fa0;
    --plum-bg: #f2ecfb;
    --forest: #2f6b3a;
    --forest-bg: #e2f0e4;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #9AC6E2 0%, #263138 100%);
    border-radius: 10px;
    padding: 0;
    max-width: 100%;
    box-sizing: border-box;
  }
  #tifton-tracker * { box-sizing: border-box; }
  #tifton-tracker .head {
    position: relative;
    padding: 22px 24px 18px;
    background-color: #334249;
    border-radius: 10px 10px 0 0;
    border-bottom: 2px solid #1b2027;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  #tifton-tracker .head-brand {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
  #tifton-tracker .head-logo {
    height: 100px;
    width: auto;
    display: block;
    flex-shrink: 0;
  }
  #tifton-tracker .nav-row {
    padding: 14px 24px;
    display: flex;
    justify-content: flex-start;
    border-bottom: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.12);
  }
  #tifton-tracker .eyebrow {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: #9AC6E2;
    margin: 0 0 4px;
    font-weight: 600;
  }
  #tifton-tracker h1 {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-size: 30px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    line-height: 1.05;
    color: #f3f1ea;
  }
  #tifton-tracker .head-sub {
    font-size: 13px;
    color: #c3d4da;
    margin-top: 6px;
  }
  #tifton-tracker .stat-row {
    display: flex;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel);
  }
  #tifton-tracker .stat {
    padding: 8px 16px;
    text-align: center;
    border-right: 1px solid var(--line);
    min-width: 74px;
  }
  #tifton-tracker .stat:last-child { border-right: none; }
  #tifton-tracker .stat .n { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 600; line-height: 1; }
  #tifton-tracker .stat .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-top: 3px; }
  #tifton-tracker .stat.open .n { color: var(--rust); }
  #tifton-tracker .stat.inprogress .n { color: var(--amber); }
  #tifton-tracker .stat.testing .n { color: var(--steel); }
  #tifton-tracker .stat.readycustomer .n { color: var(--moss); }
  #tifton-tracker .stat.readyinstall .n { color: var(--slate); }
  #tifton-tracker .stat.monitoring .n { color: var(--plum); }
  #tifton-tracker .stat.onhold .n { color: var(--forest); }
  #tifton-tracker .stat.closed .n { color: var(--teal); }
  #tifton-tracker .stat.late-stat {
    cursor: pointer;
    background: var(--amber-bg);
    border-left: 2px solid var(--amber);
  }
  #tifton-tracker .stat.late-stat .n { color: var(--amber); }
  #tifton-tracker .stat.late-stat .l { color: var(--amber); font-weight: 600; }
  #tifton-tracker .stat.late-stat:hover { background: #f6ddb8; }
  #tifton-tracker .stat.late-stat.active { background: var(--amber); }
  #tifton-tracker .stat.late-stat.active .n,
  #tifton-tracker .stat.late-stat.active .l { color: white; }
  #tifton-tracker .stat.blocker-stat {
    cursor: pointer;
    background: var(--rust-bg);
    border-left: 2px solid var(--rust);
  }
  #tifton-tracker .stat.blocker-stat .n { color: var(--rust); }
  #tifton-tracker .stat.blocker-stat .l { color: var(--rust); font-weight: 600; }
  #tifton-tracker .stat.blocker-stat:hover { background: #f4d9d3; }
  #tifton-tracker .stat.blocker-stat.active { background: var(--rust); }
  #tifton-tracker .stat.blocker-stat.active .n,
  #tifton-tracker .stat.blocker-stat.active .l { color: white; }

  #tifton-tracker .toolbar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.12);
  }
  #tifton-tracker .toolbar-filters {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: space-between;
  }
  #tifton-tracker .toolbar-filters > * { flex: 1 1 0; min-width: 0; }
  #tifton-tracker .toolbar-search {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #tifton-tracker .active-filters {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    min-width: 0;
  }
  #tifton-tracker .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--steel);
    background: var(--steel-bg);
    border-radius: 999px;
    padding: 4px 6px 4px 10px;
    white-space: nowrap;
  }
  #tifton-tracker .filter-chip.late-chip { color: var(--amber); background: var(--amber-bg); }
  #tifton-tracker .filter-chip-x {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
  }
  #tifton-tracker .filter-chip-x:hover { background: rgba(0,0,0,0.12); }
  #tifton-tracker select {
    font-family: inherit;
    font-size: 11.5px;
    padding: 4px 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
  }
  #tifton-tracker input[type=text] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
  }
  #tifton-tracker input[type=text] { width: 100%; max-width: 340px; }

  #tifton-tracker .view-toggle {
    display: flex;
    border: 1px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
  }
  #tifton-tracker .view-toggle button {
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 600;
    padding: 12px 20px;
    border: none;
    border-right: 1px solid #d5d5d5;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  #tifton-tracker .view-toggle button:last-child { border-right: none; }
  #tifton-tracker .view-toggle button.active { background: var(--ink); color: var(--paper); border-right-color: var(--ink); }
  #tifton-tracker .btn-copy {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border: 1px solid var(--ink);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  #tifton-tracker .btn-copy:hover { background: var(--ink); color: var(--paper); }
  #tifton-tracker .btn-copy.copied { background: var(--moss); border-color: var(--moss); color: white; }
  #tifton-tracker .btn-copy-header {
    position: absolute;
    top: 16px;
    right: 24px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border: 1px solid rgba(243,241,234,0.5);
    border-radius: 6px;
    background: transparent;
    color: rgba(243,241,234,0.9);
    cursor: pointer;
    white-space: nowrap;
  }
  #tifton-tracker .btn-copy-header:hover { background: rgba(243,241,234,0.15); border-color: rgba(243,241,234,0.8); color: #f3f1ea; }
  #tifton-tracker .btn-copy-header.copied { background: var(--moss); border-color: var(--moss); color: white; }

  #tifton-tracker .data-io {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 14px 24px 20px;
    border-top: 1px solid rgba(243,241,234,0.25);
  }
  #tifton-tracker .btn-io {
    display: inline-block;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 14px;
    border: 1px solid rgba(243,241,234,0.5);
    border-radius: 6px;
    background: transparent;
    color: rgba(243,241,234,0.85);
    cursor: pointer;
  }
  #tifton-tracker .btn-io:hover { background: rgba(243,241,234,0.12); border-color: rgba(243,241,234,0.8); color: #f3f1ea; }
  #tifton-tracker .logout-row { text-align: center; padding: 0 24px 16px; }
  #tifton-tracker .logout-link { font-size: 11.5px; color: rgba(243,241,234,0.55); text-decoration: none; }
  #tifton-tracker .logout-link:hover { text-decoration: underline; color: rgba(243,241,234,0.85); }

  /* Network diagram */
  #tifton-tracker .network-fab {
    position: fixed;
    bottom: 16px;
    right: 20px;
    z-index: 400;
    background: rgba(51, 66, 73, 0.9);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #tifton-tracker .network-fab:hover { background: #334249; }
  #tifton-tracker .diagram-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 26, 29, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 600;
    padding: 20px;
  }
  #tifton-tracker .diagram-modal {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    max-width: 720px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  #tifton-tracker .diagram-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  #tifton-tracker .diagram-modal-head h2 { font-size: 16px; font-weight: 700; margin: 0; color: var(--ink); font-family: 'Oswald', sans-serif; }
  #tifton-tracker .diagram-close-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: var(--paper);
    color: var(--ink-soft);
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }
  #tifton-tracker .diagram-close-btn:hover { background: var(--line); color: var(--ink); }
  #tifton-tracker .diagram-visual {
    background: linear-gradient(180deg, #9AC6E2 0%, #263138 100%);
    border-radius: 10px;
    padding: 16px;
  }
  #tifton-tracker .diagram-caption { font-size: 13px; color: #fff; line-height: 1.5; margin-top: 12px; }
  #tifton-tracker .diagram-security { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  #tifton-tracker .diagram-security-title { font-size: 14px; font-weight: 700; color: var(--ink); margin: 0 0 8px; font-family: 'Oswald', sans-serif; }
  #tifton-tracker .diagram-security-text { font-size: 13px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 8px; }
  #tifton-tracker .diagram-security-text:last-child { margin-bottom: 0; }
  #tifton-tracker .visually-hidden-input {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  #tifton-tracker .body { padding: 18px 24px 26px; }

  /* Board view */
  #tifton-tracker .as-of-banner {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--rust);
    background: transparent;
    border: none;
    padding: 0;
    margin-bottom: 14px;
  }
  #tifton-tracker .as-of-banner-empty {
    color: var(--ink-soft);
    font-weight: 600;
    text-transform: none;
    letter-spacing: normal;
  }
  #tifton-tracker .board {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  #tifton-tracker .board-col {
    flex: 1 0 260px;
    min-width: 260px;
  }
  #tifton-tracker .board-scrollbar-proxy {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 16px;
    overflow-x: auto;
    overflow-y: hidden;
    background: rgba(27,32,39,0.85);
    z-index: 500;
    display: none;
  }
  #tifton-tracker .board-scrollbar-proxy.visible { display: block; }
  #tifton-tracker .board-scrollbar-proxy-inner { height: 1px; }
  #tifton-tracker .col-head {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding-bottom: 8px;
    margin-bottom: 10px;
    color: #334249;
    border-bottom: 2px solid rgba(51,66,73,0.55);
    display: flex;
    justify-content: space-between;
  }
  #tifton-tracker .col-head span.count { color: rgba(51,66,73,0.7); font-weight: 400; }
  #tifton-tracker .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--slate);
    border-radius: 6px;
    padding: 11px 12px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  #tifton-tracker .card:hover { border-color: var(--ink); }
  #tifton-tracker .card.open { border-left-color: var(--rust); }
  #tifton-tracker .card.inprogress { border-left-color: var(--amber); }
  #tifton-tracker .card.testing { border-left-color: var(--steel); }
  #tifton-tracker .card.readycustomer { border-left-color: var(--moss); }
  #tifton-tracker .card.readyinstall { border-left-color: var(--slate); }
  #tifton-tracker .card.monitoring { border-left-color: var(--plum); }
  #tifton-tracker .card.onhold { border-left-color: var(--forest); }
  #tifton-tracker .card.closed { border-left-color: var(--teal); }
  #tifton-tracker .card-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  #tifton-tracker .tag {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--steel-dark);
    background: #e4ebef;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  #tifton-tracker .card-title { font-size: 13.5px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; min-height: calc(1.3em * 2); }
  #tifton-tracker .blocker-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: white;
    background: var(--rust);
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  #tifton-tracker .card-tag-slot { display: flex; }
  #tifton-tracker .late-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: white;
    background: var(--amber);
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  #tifton-tracker .card.is-late { border-left-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber-bg); }
  #tifton-tracker .meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  #tifton-tracker .devops-tag {
    display: inline-block;
    font-family: monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--steel-dark);
    background: #e4ebef;
    border: 1px solid #c9d7de;
    border-radius: 4px;
    padding: 1px 7px;
  }
  #tifton-tracker .priority-tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    border-radius: 4px;
    padding: 1px 7px;
    background: var(--steel-bg);
    color: var(--steel);
  }
  #tifton-tracker .priority-tag.high { background: var(--rust-bg); color: var(--rust); }
  #tifton-tracker .priority-tag.medium { background: var(--amber-bg); color: var(--amber); }
  #tifton-tracker .priority-tag.low { background: var(--slate-bg); color: var(--slate); }
  #tifton-tracker .target-tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--steel-dark);
    background: #e4ebef;
    border-radius: 4px;
    padding: 1px 7px;
  }
  #tifton-tracker .target-tag.target-tag-late {
    color: var(--rust);
    background: var(--rust-bg);
    font-weight: 700;
  }
  #tifton-tracker .card-detail {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: calc(1.4em * 3);
  }
  #tifton-tracker .card-reported { font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }
  #tifton-tracker .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 8px;
    margin-top: auto;
    padding-top: 8px;
  }

  /* Table view */
  #tifton-tracker table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #tifton-tracker thead th {
    text-align: left;
    font-family: 'Oswald', sans-serif;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink);
    padding: 8px 10px;
    border-bottom: 2px solid var(--ink);
  }
  #tifton-tracker tbody tr { background: rgba(255,255,255,0.9); }
  #tifton-tracker tbody td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  #tifton-tracker tbody tr:hover { background: #ffffff; cursor: pointer; }
  #tifton-tracker .status-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 100px;
    white-space: nowrap;
    display: inline-block;
  }
  #tifton-tracker .status-pill.open { background: var(--rust-bg); color: var(--rust); }
  #tifton-tracker .status-pill.inprogress { background: var(--amber-bg); color: var(--amber); }
  #tifton-tracker .status-pill.testing { background: var(--steel-bg); color: var(--steel); }
  #tifton-tracker .status-pill.readycustomer { background: var(--moss-bg); color: var(--moss); }
  #tifton-tracker .status-pill.readyinstall { background: var(--slate-bg); color: var(--slate); }
  #tifton-tracker .status-pill.monitoring { background: var(--plum-bg); color: var(--plum); }
  #tifton-tracker .status-pill.onhold { background: var(--forest-bg); color: var(--forest); }
  #tifton-tracker .status-pill.closed { background: var(--teal-bg); color: var(--teal); }

  #tifton-tracker .empty { text-align: center; padding: 40px 20px; color: rgba(243,241,234,0.75); font-size: 13px; }

  /* Calendar view */
  #tifton-tracker .calendar {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  #tifton-tracker .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  #tifton-tracker .cal-month-label {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  #tifton-tracker .cal-month-count { font-size: 12px; font-weight: 400; color: var(--ink-soft); }
  #tifton-tracker .cal-nav {
    font-family: inherit;
    font-size: 18px;
    font-weight: 600;
    width: 30px;
    height: 30px;
    line-height: 1;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  #tifton-tracker .cal-nav:hover { border-color: var(--ink); }
  #tifton-tracker .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  #tifton-tracker .cal-grid-head { margin-bottom: 6px; }
  #tifton-tracker .cal-dayname {
    text-align: center;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding-bottom: 4px;
  }
  #tifton-tracker .cal-cell {
    min-height: 64px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px;
    position: relative;
  }
  #tifton-tracker .cal-cell.empty { border-color: transparent; }
  #tifton-tracker .cal-daynum { font-size: 12px; color: var(--ink-soft); }
  #tifton-tracker .cal-cell.is-today .cal-daynum { color: var(--steel); font-weight: 700; }
  #tifton-tracker .cal-cell.is-today { border-color: var(--steel); border-width: 2px; }
  #tifton-tracker .cal-cell.has-due {
    cursor: pointer;
    background: var(--rust-bg);
    border-color: var(--rust);
  }
  #tifton-tracker .cal-cell.has-due:hover { background: #f4d9d3; }
  #tifton-tracker .cal-cell.has-due.is-selected { background: var(--rust); border-color: var(--rust); }
  #tifton-tracker .cal-cell.has-due.is-selected .cal-daynum,
  #tifton-tracker .cal-cell.has-due.is-selected .cal-count { color: white; }
  #tifton-tracker .cal-count {
    position: absolute;
    bottom: 6px;
    right: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--rust);
  }
  #tifton-tracker .cal-detail {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }
  #tifton-tracker .cal-detail-header {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  #tifton-tracker .cal-detail-header .count { font-weight: 400; color: var(--ink-soft); }
  #tifton-tracker .cal-detail-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

  /* Completed view */
  #tifton-tracker .closed-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }
  #tifton-tracker .closed-header {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--teal);
    border-bottom: 2px solid var(--teal);
    padding-bottom: 8px;
    margin-bottom: 14px;
  }
  #tifton-tracker .closed-header .count { font-weight: 400; color: rgba(243,241,234,0.75); }


  /* FDD view */
  #tifton-tracker .fdd-table thead th {
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
  }
  #tifton-tracker .fdd-row-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
    white-space: nowrap;
  }
  #tifton-tracker .fdd-row-upload-input {
    font-size: 11.5px;
    max-width: 190px;
  }
  #tifton-tracker .fdd-row-file-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    max-width: 100px;
    flex-shrink: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #tifton-tracker .fdd-row-file-size {
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    flex-shrink: 0;
  }
  #tifton-tracker .fdd-row-view-btn {
    padding: 4px 10px;
    font-size: 12px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  #tifton-tracker .fdd-row-remove-btn {
    flex-shrink: 0;
  }
  #tifton-tracker .fdd-detail-row td {
    padding: 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  #tifton-tracker .fdd-preview-frame {
    width: 100%;
    height: 60vh;
    min-height: 360px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: white;
  }

  /* History view */
  #tifton-tracker .history-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }
  #tifton-tracker .history-header {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
    padding-bottom: 8px;
    margin-bottom: 14px;
  }
  #tifton-tracker .history-header .count { font-weight: 400; color: var(--ink-soft); }
  #tifton-tracker .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #tifton-tracker .history-table thead th {
    text-align: left;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding: 6px 10px;
    border-bottom: 2px solid var(--line);
  }
  #tifton-tracker .history-table tbody td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  #tifton-tracker .history-delete-btn {
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }
  #tifton-tracker .history-delete-btn:hover { background: var(--rust-bg); color: var(--rust); }
  #tifton-tracker .history-hint { font-size: 12.5px; color: var(--ink-soft); margin: -6px 0 12px; }

  /* Analysis view */
  #tifton-tracker .analysis-wrap { display: flex; flex-direction: column; gap: 16px; }
  #tifton-tracker .analysis-chart-row { display: flex; gap: 16px; flex-wrap: wrap; }
  #tifton-tracker .analysis-chart-row .analysis-card { flex: 1 1 320px; min-width: 0; margin-bottom: 0; }
  #tifton-tracker .analysis-header {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
  }
  #tifton-tracker .analysis-header .count { font-weight: 400; color: var(--ink-soft); }
  #tifton-tracker .analysis-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }
  #tifton-tracker .analysis-card-title {
    font-family: 'Oswald', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 10px;
  }
  #tifton-tracker .analysis-card-title .count { font-weight: 400; color: var(--ink-soft); font-size: 13px; }
  #tifton-tracker .chart-wrap { width: 100%; }
  #tifton-tracker .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  #tifton-tracker .chart-legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); }
  #tifton-tracker .chart-legend-swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #tifton-tracker .analysis-stat-row { display: flex; gap: 20px; flex-wrap: wrap; }
  #tifton-tracker .analysis-stat { flex: 1; min-width: 140px; }
  #tifton-tracker .analysis-stat-n { font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700; color: var(--steel); }
  #tifton-tracker .analysis-stat-l { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  #tifton-tracker .stuck-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #tifton-tracker .stuck-table thead th {
    text-align: left;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding: 6px 10px;
    border-bottom: 2px solid var(--line);
  }
  #tifton-tracker .stuck-table tbody td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  #tifton-tracker .stuck-table tbody tr { cursor: pointer; }
  #tifton-tracker .stuck-table tbody tr:hover { background: var(--paper); }
  #tifton-tracker .history-row.clickable { cursor: pointer; }
  #tifton-tracker .history-row.clickable:hover { background: var(--paper); }
  #tifton-tracker .history-row.expanded { background: var(--paper); }
  #tifton-tracker .history-expand-caret {
    display: inline-block;
    width: 12px;
    color: var(--ink-soft);
    transition: transform 0.15s ease;
  }
  #tifton-tracker .history-row.expanded .history-expand-caret { transform: rotate(90deg); }
  #tifton-tracker .history-detail-row td { padding: 0; border-bottom: 1px solid var(--line); }
  #tifton-tracker .history-detail-row .history-diff-section { margin: 0; border-radius: 0; border-left: none; border-right: none; border-top: none; }
  #tifton-tracker .history-diff-section {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
  }
  #tifton-tracker .history-diff-title { font-family: 'Oswald', sans-serif; font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  #tifton-tracker .history-diff-summary { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; }
  #tifton-tracker .history-diff-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  #tifton-tracker .history-diff-list:last-child { margin-bottom: 0; }
  #tifton-tracker .history-diff-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; flex-wrap: wrap; }
  #tifton-tracker .history-diff-arrow { color: var(--ink-soft); }
  #tifton-tracker .history-diff-item-title { color: var(--ink); }
  #tifton-tracker .status-pill.unmatched { background: var(--slate-bg); color: var(--slate); }

  /* Modal */
  #tifton-tracker .modal-backdrop {
    position: fixed; inset: 0; background: rgba(27,32,39,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  #tifton-tracker .modal {
    background: var(--panel); border-radius: 10px; padding: 24px;
    max-width: 480px; width: 100%; max-height: 86vh; overflow-y: auto;
    border: 1px solid var(--line);
  }
  #tifton-tracker .modal h2 { font-family: 'Oswald', sans-serif; font-size: 18px; margin: 0 0 14px; }
  #tifton-tracker .field { margin-bottom: 12px; }
  #tifton-tracker .field label { display: block; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin-bottom: 4px; }
  #tifton-tracker .field input, #tifton-tracker .field select, #tifton-tracker .field textarea {
    width: 100%; font-family: inherit; font-size: 13.5px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
  }
  #tifton-tracker .field textarea { min-height: 70px; resize: vertical; }
  #tifton-tracker .field-row { display: flex; gap: 10px; }
  #tifton-tracker .field-row .field { flex: 1; }
  #tifton-tracker .modal-actions { display: flex; justify-content: space-between; margin-top: 18px; gap: 8px; }
  #tifton-tracker .btn-primary {
    font-family: inherit; font-weight: 600; font-size: 13px; padding: 9px 16px;
    border: none; border-radius: 6px; background: var(--steel); color: white; cursor: pointer;
  }
  #tifton-tracker .btn-secondary {
    font-family: inherit; font-weight: 600; font-size: 13px; padding: 9px 16px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer;
  }
  #tifton-tracker .btn-delete {
    font-family: inherit; font-weight: 600; font-size: 13px; padding: 9px 16px;
    border: none; border-radius: 6px; background: transparent; color: var(--rust); cursor: pointer;
  }
  #tifton-tracker .save-note { font-size: 11px; color: rgba(243,241,234,0.7); text-align: right; padding: 0 24px 14px; }

  @media (max-width: 480px) {
    #tifton-tracker .head { flex-direction: column; align-items: flex-start; }
  }
</style>

        <option value="">Missing info: All</option>
        <option value="devops">Missing DevOps #</option>
